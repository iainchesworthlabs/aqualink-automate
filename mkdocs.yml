site_name: Aqualink Automate
site_description: >-
  Local control of Jandy/Zodiac (Fluidra) Aqualink RS and Pentair pool
  controllers over RS-485 — Web UI, HTTP API, MQTT, and a Matter bridge,
  with no cloud service required.
site_author: Iain Chesworth
# The docs site IS the GitHub Pages root (the docs home is the landing page).
# The signed APT/DNF package machinery (apt/, rpm/, key.gpg, install-*.sh) lives
# alongside it at the root, published by publish-repos.yml.
site_url: https://iainchesworthlabs.github.io/aqualink-automate/

repo_url: https://github.com/iainchesworthlabs/aqualink-automate
repo_name: iainchesworthlabs/aqualink-automate
edit_uri: edit/main/docs/

# In-repo Markdown is the single source of truth; this builds a curated subset.
docs_dir: docs
site_dir: site

plugins:
  # Zensical has its own built-in search implementation and ignores this
  # entry, but it's declared for anyone still building with real MkDocs +
  # Material, where `search` is a default plugin that a `plugins:` list
  # replaces unless it's listed explicitly.
  - search

theme:
  name: material
  # Zensical (docs/ci-cd.md), the Rust-core successor to MkDocs + Material
  # that builds this same config, defaults to its own "modern" look; classic
  # keeps this site on the Material appearance the skin below is built for.
  # Real MkDocs + Material ignores this key.
  variant: classic
  # Brand skin lives in overrides/ (templates) + docs/stylesheets/aqualink.css
  # (palette + self-hosted fonts). Mirrors the web-UI design (assets/web).
  custom_dir: overrides
  logo: assets/brand/favicon.svg
  favicon: assets/brand/favicon.svg
  # Self-host the brand faces (Bricolage Grotesque + Hanken Grotesk) via
  # aqualink.css instead of pulling Google Fonts.
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share
  # Dark is the default (first entry), matching the app; colours come from the
  # custom OKLCH scheme in aqualink.css, so primary/accent are set to custom.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - stylesheets/aqualink.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      # Match GitHub's heading-slug algorithm so in-page anchors resolve
      # identically whether a doc is read on GitHub or on the rendered site.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Working notes, protocol reverse-engineering, and planning documents stay in the
# repository as reference but are not part of the published site. Design/planning
# snapshots (roadmaps, analyses, decompositions, the UI-reskin handoff) live under
# docs/design/ and are excluded wholesale via the `design/` entry; the generated
# consteval/constexpr opportunity reports under docs/refactoring/ likewise.
#
# Links FROM a published page TO anything excluded here (or to a repo file outside
# docs/) must be absolute https://github.com/... URLs: MkDocs only logs those at
# INFO, so they ship broken and silent rather than failing --strict.
#
# Zensical does not honour exclude_docs (as of 0.0.60) — it builds every page
# regardless. scripts/zensical-prune-excluded.py re-applies this same list as a
# post-build step (reading it straight out of this file, so it can't drift);
# docs.yml runs it after `zensical build`. Drop that script once Zensical adds
# native support.
exclude_docs: |
  alwin32/
  design/
  refactoring/
  i18n-scoping.md
  alwin32_simulator_protocol.md
  aqualink_rs_revisions.md
  iaqualink2_init_handshake.md
  to_master_decoding.md
  onetouch_schedule_protocol.md

nav:
  - Home: index.md
  - User guide:
      - Install: INSTALL.md
      - Configuration: configuration.md
      - Usage, HTTP API & WebSocket: usage-and-api.md
      - MQTT & Home Assistant: mqtt-home-assistant.md
      - Home Assistant add-on: homeassistant-addon.md
      - Home Assistant companion package: homeassistant-companion.md
      - Matter (smart home): MATTER.md
      - Raspberry Pi: raspberry-pi.md
      - RS-485 wiring: hardware-rs485-connectivity.md
      - Server & hosting: hardware-server-automation.md
      - Security: SECURITY.md
  - Development:
      - Contributing: CONTRIBUTING.md
      - Internationalization (i18n): i18n.md
      - Releasing: releasing.md
      - CI/CD: ci-cd.md
      - Self-hosted CI runners: ci-self-hosted-runners.md
      - Git worktrees: worktrees.md
      - Record / replay: RECORD_REPLAY.md
      - Profiling: profiling.md
      - Logging sinks: logging-sinks-redesign.md
      - Platform isolation: platform-isolation.md
      - Fuzzing: fuzzing.md
  - Design & protocol notes:
      - Auth system design: auth-redesign.md
      - Schedules design: schedules-design.md
      - iAQ schedule protocol: iaq_schedule_protocol.md
