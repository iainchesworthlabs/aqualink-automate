# GENERATED from ../aqualink-automate by scripts/gen-homeassistant-edge-addon.ps1 — DO NOT EDIT.
# Change the stable add-on, then re-run the generator and commit (CI enforces no drift).
# Home Assistant add-on manifest for Aqualink Automate.
#
# The add-on wraps the multi-arch app image published to GHCR by release.yml — no app
# rebuild; the Dockerfile only layers bashio + run.sh on the published base (its tag is
# this add-on's `version`, via the Dockerfile `ARG BUILD_VERSION`). The Supervisor PULLS
# the prebuilt wrapper (see `image:` below), so it never builds on-device.
#
# `version` is the single source of truth: it is both the wrapper image tag pulled and
# the base image tag built FROM. The CI `Home Assistant Add-on` check enforces it.
name: Aqualink Automate (Edge)
version: "0.12.0-beta.7"
slug: aqualink_automate_edge
# Pre-1.0: no stable release exists yet, so the main channel is marked experimental.
# Flip to `stable` at the first non-prerelease release. The generated Edge channel
# (aqualink-automate-edge, tracks the newest prerelease) stays `experimental`.
stage: experimental
description: >-
  Control and monitor Jandy/Zodiac & Pentair pool systems over RS-485, with
  native Home Assistant MQTT discovery.
url: https://github.com/iainchesworth/aqualink-automate
# Prebuilt image: the Supervisor PULLS the per-arch wrapper image published by
# release.yml (job `homeassistant-addon-publish`) instead of building on-device. HA
# substitutes {arch} (aarch64/amd64) and appends the add-on `version` as the tag.
# The Dockerfile is the recipe CI builds from; it is also the local-build fallback if
# you comment this line out to test an unpublished build.
image: "ghcr.io/iainchesworth/aqualink-automate/homeassistant-{arch}"
# arm64 (aarch64) + amd64 only — matches what release.yml builds. armv7/armhf
# (32-bit Pi) is a later phase.
arch:
  - aarch64
  - amd64
# The published image bundles tini as PID 1 and its own entrypoint, so do NOT let
# the Supervisor inject its own init.
init: false
startup: application
boot: manual
# Serial: auto-map host TTY devices (/dev/ttyUSB*, /dev/ttyACM*, /dev/ttyAMA*,
# /dev/serial/by-id/*) into the container so a /dev path in `serial_port` resolves.
# A network `host:port` in `serial_port` needs none of this.
uart: true
# MQTT: `want` makes the Supervisor inject the Home Assistant broker's connection
# details via its Services API (read in run.sh) without failing install if there
# is no broker. This is the zero-config MQTT path.
services:
  - mqtt:want
# Storage maps:
#   - ssl (read-only): HA's /ssl share, so the MQTT TLS certificate options
#     (mqtt_ca_cert / mqtt_client_cert / mqtt_client_key) can point at files there.
#   - addon_config (read-write): the add-on's own user-accessible config directory
#     (/config in the container; /addon_configs/<slug> on the host, editable via Samba /
#     the File editor) for user-managed files.
map:
  - type: ssl
    read_only: true
  - type: addon_config
    read_only: false
# Web UI via INGRESS: Home Assistant serves the UI through its own authenticated
# proxy and shows it in the sidebar — not published on the LAN, and secured by HA's
# own login (so the app's auth stays off). The frontend is ingress-aware (see
# assets/web/scripts/base-path.js).
ingress: true
ingress_port: 8099
panel_icon: mdi:pool
panel_title: Aqualink (Edge)
# Optional direct LAN port. By default the UI is reached ONLY through the Home
# Assistant sidebar (ingress); this port stays unmapped, which is why it appears under
# "Show disabled ports" in the add-on's Network panel. To ALSO reach the UI directly
# on your LAN (e.g. a wall tablet), set a host port there — 8099 is a fine choice.
# That direct path is UNAUTHENTICATED unless you turn on "Require web UI login" below.
ports:
  "8099/tcp": null
ports_description:
  "8099/tcp": Optional — reach the web UI directly on your LAN (unauthenticated unless you enable the login option). The sidebar works without this.
# Liveness watchdog: the Supervisor polls this and restarts the add-on if it stops
# answering (e.g. a hung poll loop). It reaches the container over the internal hassio
# network on the fixed CONTAINER port 8099 — NOT the [PORT] host mapping, which may be
# unset. /api/health is the app's unauthenticated probe; the connection bypasses ingress.
watchdog: "http://[HOST]:8099/api/health"
# ── Options form ───────────────────────────────────────────────────────────────
# Defaults defer to Home Assistant: auth is off (ingress provides it), and history
# and the scheduler are off (use HA's Recorder and automations); each is an opt-in
# toggle for users who want the app's own versions. Preferences + the equipment
# cache persist to /data automatically (wired in run.sh), so they are not surfaced.
# Only REQUIRED fields (no `?` in the schema) carry a default here. Optional (`?`)
# fields — mqtt_host/username/password, the mqtt cert paths, auth_password — MUST NOT
# have a default (an empty-string default on an OPTIONAL field is what made the old
# device picker reject ''). The serial fields (serial_protocol + serial_port) are the
# deliberate exception: they are REQUIRED BECAUSE Home Assistant hides UNUSED optional
# options from the form — an optional serial field simply doesn't appear, and it is the
# essential thing to configure. serial_port is a plain `str` (not the `device()` type)
# with an empty default, so it renders a normal, always-visible text box with no device
# validation (no '' save error); run.sh rejects an empty value at start.
options:
  serial_protocol: usb
  serial_port: ""
  mqtt_mode: auto
  mqtt_port: 1883
  mqtt_tls: false
  mqtt_tls_skip_verify: false
  home_assistant_discovery: true
  enable_auth: false
  auth_username: admin
  log_level: info
  enable_history: false
  enable_scheduler: false
  pool_configuration: auto
  jandy_device_type: onetouch
  jandy_device_id: "0x41"
schema:
  # Serial protocol: ONE explicit choice of how to reach the panel — `usb` for a local
  # device (--serial-port), or `rfc2217` / `rawtcp` for a serial-to-ethernet adapter
  # (--remote-serial-port + the matching transport flag). The app has only these two
  # network transports: rfc2217 (telnet) and raw TCP; `--no-rfc2217` ("plain") is just
  # another spelling of rawtcp (both set use_rfc2217=false), so it is NOT surfaced.
  # REQUIRED so Home Assistant always renders it (HA hides UNUSED optional fields).
  serial_protocol: list(usb|rfc2217|rawtcp)
  # The device to connect to. For `usb`: a local path (--serial-port) like
  # /dev/serial/by-id/usb-... (preferred) or /dev/ttyUSB0 (uart:true maps host TTYs in).
  # For `rfc2217` / `rawtcp`: a host:port (--remote-serial-port). REQUIRED plain `str`
  # (NOT the `device()` type, so no '' validation error and it is always visible);
  # run.sh rejects an empty value.
  serial_port: str
  # auto -> discover the HA broker ; manual -> the fields below ; disabled -> no MQTT
  mqtt_mode: list(auto|manual|disabled)
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: bool
  # TLS trust (used whenever the broker connection is TLS). Certificate paths are
  # filenames placed in Home Assistant's /ssl share (mounted read-only above).
  mqtt_tls_skip_verify: bool
  mqtt_ca_cert: str?
  mqtt_client_cert: str?
  mqtt_client_key: str?
  home_assistant_discovery: bool
  # Web UI login. Off by default — ingress fronts the UI with Home Assistant's own
  # login. Turn ON (and set auth_password) if you publish the direct LAN port above,
  # so that path is not left unauthenticated; the admin is created on first start.
  enable_auth: bool
  auth_username: str
  auth_password: password?
  # Surfaced operationally; the HA add-on Log tab captures stdout.
  log_level: list(info|debug|trace)
  # Off by default — Home Assistant's Recorder/History and automations are the
  # expected sources. Toggle on to use the app's own (persisted under /data).
  enable_history: bool
  enable_scheduler: bool
  # Advanced (defaults suit most installs).
  pool_configuration: list(auto|pool-only|spa-only|combo|dual)
  jandy_device_type: str
  jandy_device_id: str
