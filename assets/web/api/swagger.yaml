# TODO: Swagger UI should be provided via a developer Docker image rather than
#       being bundled into the application. This file is served as raw YAML only.

openapi: 3.0.3
info:
  title: Aqualink Automate API
  description: |
    REST API for controlling and monitoring Aqualink pool automation equipment.
    This API provides endpoints for retrieving equipment status, managing buttons/devices,
    controlling temperature setpoints, and managing diagnostics.

    ## Authentication

    Authentication is **optional and disabled by default**. When the server is
    started without an API auth token (the `--api-auth-token` CLI flag /
    `api-auth-token` config key is unset), every endpoint is reachable without
    credentials and the documented `401` responses never occur — fully
    backward-compatible behaviour.

    When an API auth token is configured, every `/api` request must carry an
    `Authorization: Bearer <token>` header. A request with a missing or
    mismatched token is rejected with `401`. This is the `bearerAuth` security
    scheme below; the top-level `security` requirement is declared as optional
    (`{}` alternative) to reflect that auth is opt-in.

    **Static assets are exempt** — only `/api`, `/metrics` and the `/ws`
    upgrade are protected, so `index.html` / scripts / styles always load (to
    render the login screen). `GET /api/auth/check` lets a client discover its
    auth state: it returns `200` when authorized (or when auth is disabled) and
    `401` otherwise.

    **`GET /api/health` is also exempt** — the liveness probe is always
    unauthenticated so a container/orchestrator health check can reach it without
    the bearer token. It carries no sensitive data. The richer
    `GET /api/health/detailed` is **not** exempt — it exposes internal subsystem
    state and is gated like every other route.

    **WebSocket auth:** browsers cannot set an `Authorization` header on a
    WebSocket upgrade, so the client offers the token via the
    `Sec-WebSocket-Protocol` header as `aqualink, bearer.<token>`. The server
    constant-time-compares the `bearer.<token>` entry and, on success, completes
    the handshake echoing the `aqualink` subprotocol. Non-browser clients may
    still use the `Authorization: Bearer <token>` header on the upgrade.

    ## WebSocket Endpoints

    These are not part of the OpenAPI spec but are documented here for reference:

    - `GET /ws/equipment` - Real-time equipment status updates via WebSocket.
    - `GET /ws/equipment/stats` - Real-time equipment statistics streaming via WebSocket.

    WebSocket frames are JSON objects `{ "type": <string>, "payload": <object> }`.
    Message types on `/ws/equipment` include `ChemistryUpdate`, `TemperatureUpdate`,
    `CirculationUpdate`, `ButtonStateChange`, `SystemStatusChange`,
    `SystemStateUpdate`, and `AlertTransition`. The `CirculationUpdate` payload
    (circulation/active-body changes) is `{ "mode": <string>, "spa_mode": <bool>,
    "active_body": <string|null>, "bodies": [ { "id": <string>, "is_active": <bool> } ] }`,
    where `mode` is one of `Pool`, `Spa`, `SpaFill`, `SpaDrain`, `Spillover` and
    `active_body`/`bodies[].id` are body-of-water ids (`Pool`, `Spa`, `Shared`).
    The `AlertTransition` payload (fault-detection alerts) is
    `{ "condition": <string>, "state": "raised"|"cleared", "ts": <unix-seconds>,
    "detail": <string>, "params": <object, optional> }`, where `condition` is one
    of `chlorinator_fault`, `chlorinator_warning`, `salt_low`, `service_mode`,
    `serial_comms_loss`, `temperature_stale`. `detail` is the human-readable
    ENGLISH description (stable contract); `params` carries the structured values
    behind it — e.g. `{"salt_ppm": 2400, "threshold_ppm": 2700}` for `salt_low` or
    `{"health": "Warning_LowSalt", "health_flags": ["Warning_LowSalt"]}` for the
    chlorinator conditions — so consumers (the web UI's translated alerts,
    automations) can act on the data without parsing prose. The same shape is
    POSTed by the alert webhook. `chlorinator_warning` covers the cell warnings
    (no flow, low/high salt, clean cell, low/high voltage/current, low
    temperature); `chlorinator_fault`/`chlorinator_warning` can both be raised
    at once, since the cell's status byte is a bitfield and can report a hard
    fault and a warning simultaneously. `params.health` is the single
    worst-of-the-set flag relevant to THIS condition (raw enum name);
    `params.health_flags` is every flag relevant to this condition, in case more
    than one warning (or, rarely, more than one fault) is active at once.
    `temperature_stale` raises when the filter pump is running but the active
    body's water temperature has not refreshed within the staleness threshold
    (`--temperature-staleness-threshold`); pump-off staleness is expected and
    never raises. Its `params` are `{"body": "pool"|"spa",
    "threshold_seconds": <int>}`.
  version: 1.0.0
  contact:
    name: Aqualink Automate
  license:
    name: Proprietary

servers:
  - url: http://localhost
    description: Local server

tags:
  - name: Health
    description: Liveness probe for container/orchestrator health checks
  - name: Version
    description: Application and equipment version information
  - name: Equipment
    description: Equipment status and control
  - name: Buttons
    description: Control buttons and triggerable devices
  - name: Devices
    description: Equipment devices information
  - name: Setpoints
    description: Temperature setpoint control
  - name: Diagnostics
    description: Diagnostics and logging configuration
  - name: Administration
    description: User, group, entitlement, API-key and session management (system.admin)

# Authentication is optional (opt-in). The empty requirement object `{}` permits
# unauthenticated access (the default when no API auth token is configured);
# `bearerAuth` applies the `Authorization: Bearer <token>` scheme when a token is
# set. A request with a missing/mismatched token (when auth is enabled) gets 401.
security:
  - {}
  - bearerAuth: []

paths:
  /api/version:
    get:
      tags:
        - Version
      summary: Get application version information
      description: Returns software version details, git metadata, and server uptime
      operationId: getVersion
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
              example:
                software_version:
                  name: "Aqualink Automate"
                  version: "1.0.0"
                  description: "Pool automation system"
                  homepage: "https://github.com/example/aqualink"
                git_info:
                  commit_sha1: "abc123def456"
                  commit_date: "2024-01-15"
                  uncommitted_changes: false
                server_start_time: "2024-01-15T10:30:00Z"
                uptime_seconds: 3600
        '401':
          $ref: '#/components/responses/Unauthorized'

  /metrics:
    get:
      tags:
        - Metrics
      summary: Prometheus metrics exposition
      description: >
        Serial/message/latency statistics in Prometheus text exposition format
        (version 0.0.4) for scraping. Served at the root (NOT under /api) per
        Prometheus convention. Always available; subject to the same bearer-token
        enforcement as every other route when --api-auth-token is configured
        (Prometheus scrapers support bearer auth natively).
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus exposition document
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP aqualink_build_info Build information (constant 1; value carried in labels).
                # TYPE aqualink_build_info gauge
                aqualink_build_info{version="1.0.0",commit="abc123"} 1
                # HELP aqualink_serial_read_bytes_total Total bytes read from the serial port.
                # TYPE aqualink_serial_read_bytes_total counter
                aqualink_serial_read_bytes_total 12345
                # HELP aqualink_serial_write_bytes_total Total bytes written to the serial port.
                # TYPE aqualink_serial_write_bytes_total counter
                aqualink_serial_write_bytes_total 678
                # HELP aqualink_messages_total Total protocol messages decoded across all message types.
                # TYPE aqualink_messages_total counter
                aqualink_messages_total 4210
                # HELP aqualink_message_errors_total Protocol message decode errors by kind.
                # TYPE aqualink_message_errors_total counter
                aqualink_message_errors_total{kind="checksum"} 2
                # HELP aqualink_serial_errors_total Serial-layer errors by kind.
                # TYPE aqualink_serial_errors_total counter
                aqualink_serial_errors_total{kind="overflow"} 0
                # HELP aqualink_latency_microseconds Operation latency percentiles (sliding 60s window), in microseconds.
                # TYPE aqualink_latency_microseconds gauge
                aqualink_latency_microseconds{stage="serial_read",quantile="0.5"} 850.5
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/check:
    get:
      tags:
        - Authentication
      summary: Probe authentication state
      description: >
        Returns 200 when the request is authorized (or when auth is disabled),
        401 otherwise. The UI calls this on load to decide whether to show the
        login screen. Reached only when already authorized, so the body always
        reports authenticated=true.
      operationId: getAuthCheck
      responses:
        '200':
          description: Authorized (or authentication disabled)
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
              example:
                authenticated: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get the resolved subject for the calling request
      description: >
        Returns the identity the request resolved to — the global identity-system
        posture (`--auth-mode`), the subject id, whether the caller is
        authenticated, the credential provider, group memberships, and the
        effective entitlements — so a client (the SPA) can gate its affordances
        (lock icons, hidden admin navigation) from one source of truth. The
        server-side policy engine remains the actual enforcement point.

        When `--auth-mode enabled`, this route deliberately declares no
        entitlement requirement: an anonymous/guest caller can always ask
        "who am I and what may I do?" (the answer being the Guest scope).
        With auth-mode disabled the subject is root-anonymous and
        `entitlements` is empty — everything is permitted by posture, so
        entitlements are not enumerated. The documented `401` occurs only under
        the legacy shared-token model (auth-mode disabled with an API auth token
        configured), where this route is bearer-gated like every other route.
      operationId: getAuthMe
      responses:
        '200':
          description: The resolved subject
          content:
            application/json:
              schema:
                type: object
                properties:
                  posture:
                    type: string
                    enum: [disabled, enabled]
                    description: Global identity-system posture (--auth-mode)
                  setup_required:
                    type: boolean
                    description: True while first-run setup is open (auth-mode enabled + zero users)
                  kiosk_enabled:
                    type: boolean
                    description: True when kiosk PIN elevation is configured (offer PIN entry on the login screen)
                  id:
                    type: string
                    description: Stable subject identity ("anonymous" when unauthenticated)
                  username:
                    type: string
                    description: >-
                      Human-readable name for the subject — the local account's
                      username, or an API key's label. Empty when the provider
                      has no natural name (anonymous, kiosk PIN sessions);
                      clients should fall back to `id`.
                  authenticated:
                    type: boolean
                    description: True only when a valid credential was presented and verified
                  provider:
                    type: string
                    enum: [Anonymous, Local, ApiKey, Oidc, Proxy, KioskPin]
                    description: The credential source the subject was resolved from
                  groups:
                    type: array
                    items:
                      type: string
                    description: Group memberships (the anonymous subject carries Guest when auth-mode is enabled)
                  entitlements:
                    type: array
                    items:
                      type: string
                    description: Effective entitlements, sorted and deterministic (the same shape as the JWT `ent` claim)
              example:
                posture: enabled
                id: anonymous
                username: ''
                authenticated: false
                provider: Anonymous
                groups:
                  - Guest
                entitlements: []
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Log in with a username and password
      description: >
        Verifies a local account and, on success, issues a short-lived access
        JWT plus a rotating refresh token. Available only when `--auth-mode
        enabled`. Declares no entitlement requirement — this is how a subject
        acquires a credential. The password is verified with argon2id off the
        kernel thread; an unknown username is verified against a decoy hash so
        response timing does not reveal whether the account exists. Failed
        attempts are counted per account and lock the account out after a
        threshold.
      operationId: authLogin
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
            example:
              username: alice
              password: a-long-enough-password
      responses:
        '200':
          description: Authenticated; the session credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  session_id: { type: string }
                  token_type: { type: string, enum: [Bearer] }
              example:
                access_token: "eyJhbGciOi..."
                refresh_token: "art_..."
                session_id: "2b0e9d3f-5a67-4c1d-9e8f-7a6b5c4d3e2f"
                token_type: Bearer
        '400': { description: Missing or non-string username/password }
        '401': { description: Invalid username or password }
        '405': { description: Method not allowed (POST required) }
        '429':
          description: >
            The account is locked out after too many failed attempts; retry
            after the window (Retry-After header).

  /api/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Exchange a refresh token for a fresh token pair
      description: >
        Rotates the (single-use) refresh token and mints a new access token.
        Available only when `--auth-mode enabled`. Declares no entitlement
        requirement — the refresh token IS the credential. Replaying a
        rotated-out token is treated as theft: the whole session is revoked and
        the reuse is audited.
      operationId: authRefresh
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
            example:
              refresh_token: "art_..."
      responses:
        '200':
          description: A fresh access token and rotated refresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
              example:
                access_token: "eyJhbGciOi..."
                refresh_token: "art_..."
                token_type: Bearer
        '400': { description: Missing or non-string refresh_token }
        '401': { description: Invalid/expired session, or a revoked (reused) token }
        '405': { description: Method not allowed (POST required) }

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out a session (or every session)
      description: >
        Revokes the session identified by the presented refresh token. Always
        answers 204 — it never discloses whether the token was live. With
        `{"everywhere": true}` it revokes every session for the authenticated
        caller and bumps the token version so outstanding access tokens die
        too; that variant requires an authenticated subject. Available only
        when `--auth-mode enabled`.
      operationId: authLogout
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
                everywhere:
                  type: boolean
                  description: Revoke every session for the authenticated caller
            example:
              refresh_token: "art_..."
      responses:
        '204': { description: Logged out (whether or not the token was live) }
        '400': { description: Missing or non-string refresh_token }
        '401': { description: everywhere logout requested without an authenticated subject }
        '405': { description: Method not allowed (POST required) }

  /api/auth/setup:
    post:
      tags:
        - Authentication
      summary: Create the first administrator (first-run setup)
      description: >
        Self-sealing first-run setup: creates the first administrator when the
        user store is empty. Once any user exists it answers 403 and is gone
        for good, so it can never mint a second admin. Available only when
        `--auth-mode enabled`. The password is hashed with argon2id off the
        kernel thread and must satisfy the policy (at least 12 characters).
      operationId: authSetup
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
            example:
              username: admin
              password: a-long-enough-password
      responses:
        '201':
          description: The first administrator was created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string }
                  username: { type: string }
              example:
                user_id: "0f8fad5b-d9cb-469f-a165-70867728950e"
                username: admin
        '400': { description: Missing fields, empty username, or a password under 12 characters }
        '403': { description: Setup has already been completed }
        '405': { description: Method not allowed (POST required) }

  /api/auth/pin:
    post:
      tags:
        - Authentication
      summary: Kiosk PIN elevation (guest mode)
      description: >
        Elevate an anonymous visitor into the admin-configured target group by
        PIN. On success returns an ordinary session (provider = KioskPin,
        revocable and session-listed under the `kiosk` subject id). The PIN is
        verified with argon2id off the kernel thread, timing-equalised against a
        decoy so a disabled kiosk is indistinguishable, and rate-limited with a
        lockout. Available only when `--auth-mode enabled`.
      operationId: authPin
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string }
            example: { pin: "2468" }
      responses:
        '200':
          description: Elevated; a kiosk session in the target group
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  session_id: { type: string }
                  token_type: { type: string, example: Bearer }
        '400': { description: Missing or malformed pin }
        '401': { description: Wrong PIN or kiosk not enabled (one indistinguishable error) }
        '429': { description: Too many attempts; see Retry-After }

  /api/kiosk:
    get:
      tags: [Administration]
      summary: Get kiosk PIN configuration
      description: >
        Report whether kiosk PIN elevation is enabled and which group it targets.
        The PIN and its hash are write-only and never returned. Requires
        `system.admin`.
      operationId: kioskGet
      responses:
        '200':
          description: Kiosk status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  target_group: { type: string }
              example: { enabled: true, target_group: Household }
        '401': { description: Anonymous request }
        '403': { description: Authenticated but not system.admin }
    put:
      tags: [Administration]
      summary: Set or replace the kiosk PIN
      description: >
        Configure kiosk PIN elevation into `target_group`. The PIN (min 4
        characters) is hashed with argon2id off the kernel thread. Bumps the
        kiosk token version — invalidating any outstanding kiosk access tokens —
        and revokes prior kiosk refresh sessions. Requires `system.admin`.
      operationId: kioskPut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin, target_group]
              properties:
                pin: { type: string }
                target_group: { type: string }
            example: { pin: "2468", target_group: Household }
      responses:
        '204': { description: The kiosk PIN was set }
        '400': { description: PIN under 4 characters, or an unknown target group }
        '401': { description: Anonymous request }
        '403': { description: Authenticated but not system.admin }
    delete:
      tags: [Administration]
      summary: Disable the kiosk PIN
      description: >
        Disable kiosk PIN elevation, clear the stored PIN, and revoke all live
        kiosk sessions. Requires `system.admin`.
      operationId: kioskDelete
      responses:
        '204': { description: Kiosk PIN elevation disabled }
        '401': { description: Anonymous request }
        '403': { description: Authenticated but not system.admin }

  /api/users:
    get:
      tags: [Administration]
      summary: List user accounts
      description: >
        Returns every local account: id, username, group memberships, direct
        entitlements, disabled flag and token version. Password hashes are
        never returned. Requires the `system.admin` entitlement (`403`
        otherwise; `401` when anonymous), like every Administration route.
      operationId: listUsers
      responses:
        '200':
          description: The user list
          content:
            application/json:
              example:
                - id: "0f8fad5b-d9cb-469f-a165-70867728950e"
                  username: alice
                  groups: [Administrators]
                  direct_entitlements: []
                  disabled: false
                  tokver: 3
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Administration]
      summary: Create a user account
      description: >
        Creates a local account. The password must satisfy the policy (at
        least 12 characters; the hash is computed off the kernel thread) and
        every direct entitlement must parse and use a known vocabulary action.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            example:
              username: carol
              password: a-long-enough-password
              groups: [Staff]
              direct_entitlements: ["equipment.view"]
      responses:
        '201': { description: Created; the new user record (no password material) }
        '400': { description: Weak password, or unknown/malformed entitlements (listed in the error) }
        '409': { description: Username already exists }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Administration]
      summary: Get a user account
      operationId: getUser
      responses:
        '200': { description: The user record (no password material) }
        '404': { description: Unknown user }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Administration]
      summary: Update a user account
      description: >
        Partial update: `username`, `groups`, `direct_entitlements` and
        `disabled` may each be supplied. A groups/entitlements change bumps the
        user's token version so outstanding access tokens go stale immediately
        (still-valid refresh tokens re-mint with the new grants); `disabled:
        true` additionally revokes every session. A change that would remove
        the last enabled administrator - or claim an existing username - is
        refused with `409`.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            example:
              groups: [Staff]
              disabled: false
      responses:
        '200': { description: The updated user record }
        '400': { description: Validation error (unknown entitlements are listed) }
        '404': { description: Unknown user }
        '409': { description: Duplicate username, or last-admin protection refused the change }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Administration]
      summary: Delete a user account
      description: >
        Removes the account and revokes its refresh sessions; audit entries
        are retained (keyed by the former user id). Deleting the last enabled
        administrator is refused with `409`.
      operationId: deleteUser
      responses:
        '204': { description: Deleted }
        '404': { description: Unknown user }
        '409': { description: Last-admin protection refused the deletion }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/users/{user_id}/password:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Administration]
      summary: Set a user's password
      description: >
        An administrator (`system.admin`) may set anyone's password; any other
        authenticated subject may only set their OWN (`403` otherwise). On
        success the user's token version is bumped and every refresh session
        is revoked - a password change invalidates everything - and the change
        is audited (`auth.password_changed`). Unlike the other Administration
        routes this one is gated only on being authenticated (`prefs.self`).
      operationId: setUserPassword
      requestBody:
        required: true
        content:
          application/json:
            example:
              password: a-brand-new-password
      responses:
        '204': { description: Password changed; every session and token for the user is now invalid }
        '400': { description: Password fails the policy (minimum 12 characters) }
        '403': { description: A non-admin subject may only set their own password }
        '404': { description: Unknown user }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/groups:
    get:
      tags: [Administration]
      summary: List groups
      description: >
        Returns every group with its entitlement set and whether it is a
        built-in (Everyone/Guest/Administrators - editable but undeletable).
      operationId: listGroups
      responses:
        '200':
          description: The group list
          content:
            application/json:
              example:
                - name: Administrators
                  entitlements: ["system.admin"]
                  built_in: true
                - name: Staff
                  entitlements: ["equipment.view", "schedules.view"]
                  built_in: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Administration]
      summary: Create or update a group
      description: >
        Upserts a group by name. Every entitlement must parse
        (`<domain>.<action>[:<selector>]`) and use a known vocabulary action
        (`GET /api/entitlements`); rejects are listed in the `400` error.
        Changing a group's entitlements bumps every member's token version so
        the grant change propagates within one request.
      operationId: upsertGroup
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Staff
              entitlements: ["equipment.view", "equipment.control.aux:*"]
      responses:
        '200': { description: The upserted group }
        '400': { description: Unknown or malformed entitlements (listed in the error) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/groups/{group_name}:
    parameters:
      - name: group_name
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Administration]
      summary: Delete a group
      description: >
        Removes a (non-built-in) group. Member users keep their membership
        reference, which degrades safely to no entitlements; their token
        versions are bumped so the lost grants propagate immediately.
      operationId: deleteGroup
      responses:
        '204': { description: Deleted }
        '404': { description: Unknown group }
        '409': { description: Built-in groups cannot be removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/entitlements:
    get:
      tags: [Administration]
      summary: List the entitlement action vocabulary
      description: >
        Returns the known entitlement actions so the admin UI can enumerate
        what is assignable to groups, direct grants and API keys. Selectors
        (`:AUX3`, `:*`) are composed client-side onto these actions.
      operationId: listEntitlements
      responses:
        '200':
          description: The action vocabulary
          content:
            application/json:
              example:
                actions: ["system.admin", "equipment.view", "equipment.control.aux"]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/apikeys:
    get:
      tags: [Administration]
      summary: List API keys
      description: >
        Returns every key's metadata - id, label, entitlements, expiry,
        last-used and revoked flag. The secret (and its digest) is never
        returned; it is shown exactly once, at creation.
      operationId: listApiKeys
      responses:
        '200':
          description: The API-key list
          content:
            application/json:
              example:
                - id: "9c1d1c9e-8f2a-4a7e-b0d3-1f0f6a2b3c4d"
                  label: ha-bridge
                  entitlements: ["equipment.view"]
                  expiry_unix: 0
                  last_used_unix: 1767225600
                  revoked: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Administration]
      summary: Create an API key
      description: >
        Creates an entitlement-scoped machine credential. The response carries
        the ONE-TIME secret (`aak_...`) plus a `warning` field; only its
        digest is persisted, so the secret can never be retrieved again.
        Entitlements are validated like a group's. `expiry_unix` is optional
        (0 or absent = never expires).
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            example:
              label: ha-bridge
              entitlements: ["equipment.view"]
              expiry_unix: 1798761600
      responses:
        '201':
          description: Created; includes the shown-once secret
          content:
            application/json:
              example:
                id: "9c1d1c9e-8f2a-4a7e-b0d3-1f0f6a2b3c4d"
                label: ha-bridge
                entitlements: ["equipment.view"]
                expiry_unix: 1798761600
                last_used_unix: 0
                revoked: false
                secret: "aak_..."
                warning: "Store this secret now; it cannot be retrieved again"
        '400': { description: Missing label, or unknown/malformed entitlements (listed in the error) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/apikeys/{key_id}:
    parameters:
      - name: key_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Administration]
      summary: Revoke an API key
      description: >
        Revokes the key - it stays listed (revoked, for hygiene audits) but
        authenticates nothing from the next request on. Audited.
      operationId: revokeApiKey
      responses:
        '204': { description: Revoked }
        '404': { description: Unknown key }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/sessions:
    get:
      tags: [Administration]
      summary: List active sessions
      description: >
        Returns the refresh-token sessions ("active devices"): id, user id,
        issued/expiry/last-seen timestamps, user agent and peer address. A
        subject holding `system.admin` sees every session; any other
        authenticated subject sees only their OWN (the route is gated on
        `prefs.self`, i.e. simply being authenticated).
      operationId: listSessions
      responses:
        '200':
          description: The session list (scoped to the caller unless admin)
          content:
            application/json:
              example:
                - id: "2b0e9d3f-5a67-4c1d-9e8f-7a6b5c4d3e2f"
                  user_id: "0f8fad5b-d9cb-469f-a165-70867728950e"
                  issued_unix: 1767225600
                  expiry_unix: 1768435200
                  last_seen_unix: 1767312000
                  user_agent: "Mozilla/5.0 ..."
                  peer_ip: "192.168.1.50"
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Administration]
      summary: Revoke a session ("log out that browser")
      description: >
        Terminates one refresh session. An admin (`system.admin`) may revoke
        ANY session; any other authenticated subject only their OWN - a
        non-owned id answers `404`, indistinguishable from an unknown one, so
        session ids are not enumerable. Audited.
      operationId: revokeSession
      responses:
        '204': { description: Revoked; the session's refresh token is dead }
        '404': { description: Unknown session (or not owned by a non-admin caller) }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/health:
    get:
      tags:
        - Health
      summary: Liveness probe for container/orchestrator health checks
      description: >
        Lightweight liveness check intended for Docker HEALTHCHECK, Kubernetes
        liveness probes, and load balancers. Returns 200 with a tiny JSON body as
        long as the process is alive and the HTTP server is responding; a hung
        event loop simply never answers, which a probe treats as unhealthy.

        Unlike every other endpoint this route is **always unauthenticated** — it
        is reachable without the bearer token even when `--api-auth-token` is set,
        so an orchestrator's health check needs no secret. The body deliberately
        carries no version/build details (those live behind the gated
        `GET /api/version`), so nothing sensitive is exposed.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: The service is alive and responding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthInfo'
              example:
                status: ok
                uptime_seconds: 3600

  /api/health/detailed:
    get:
      tags:
        - Health
      summary: Detailed health / readiness report
      description: >
        Richer health view for operators and monitoring, complementing the bare
        liveness probe at `GET /api/health`. Reports overall readiness plus a
        per-subsystem breakdown (configuration + equipment validation, discovered
        equipment count, and MQTT connectivity).

        **Readiness drives the status code:** `200` once the system has determined
        its pool configuration (the same gate the command endpoints use), `503`
        while it is still starting / unconfigured — so this endpoint can serve as a
        Kubernetes readiness probe (distinct from `/api/health`'s liveness role).

        Unlike `/api/health` this route is **subject to the bearer-token policy**
        (it exposes internal subsystem state), so it returns `401` when a token is
        required and not supplied. Serial/protocol counters are not duplicated here
        — those live in the Prometheus exposition at `GET /metrics`.
      operationId: getHealthDetailed
      responses:
        '200':
          description: The system is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDetail'
              example:
                status: ok
                ready: true
                uptime_seconds: 3600
                version:
                  name: "Aqualink Automate"
                  version: "1.0.0"
                  commit_sha1: "abc123def456"
                checks:
                  configuration:
                    status: ok
                    ready: true
                    pool_configuration: "Single Body"
                    system_board: "RS-8 Only"
                    mode: "Normal"
                    emulation_disabled: false
                    equipment_validation:
                      passed: true
                      expected_auxillaries: 5
                      discovered_auxillaries: 5
                      expected_power_centers: 1
                      discovered_power_centers: 1
                      anomalies: []
                  equipment:
                    status: ok
                    device_count: 7
                  mqtt:
                    enabled: true
                    running: true
                    connected: true
        '503':
          description: The system is alive but not yet ready (e.g. pool configuration not yet determined).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDetail'
              example:
                status: starting
                ready: false
                uptime_seconds: 4
                version:
                  name: "Aqualink Automate"
                  version: "1.0.0"
                checks:
                  configuration:
                    status: pending
                    ready: false
                    pool_configuration: "Unknown"
                    system_board: "Unknown"
                    mode: "Normal"
                    emulation_disabled: false
                  equipment:
                    status: pending
                    device_count: 0
                  mqtt:
                    enabled: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: Method not allowed (use GET).

  /api/history/series:
    get:
      tags:
        - History
      summary: List history series or fetch downsampled samples
      description: >
        With no `key`, returns metadata for every recorded series. With a `key`,
        returns server-side bucket-averaged (time-bucket mean) samples for that
        series between `from` and `to`. Series keys contain `/` (e.g.
        `temp/pool`), so the key travels as a query parameter, not a path
        segment. Returns 503 when history is disabled (no `--history-db`), 404
        for an unknown key, and 400 when `to` < `from`.
      operationId: getHistory
      parameters:
        - name: key
          in: query
          required: false
          schema: { type: string }
          description: Series key. Omit to list all series.
        - name: from
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Start of the window, unix seconds (default 0).
        - name: to
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: End of the window, unix seconds (default now).
        - name: max_points
          in: query
          required: false
          schema: { type: integer, default: 500, maximum: 2000 }
          description: Maximum buckets returned (capped at 2000).
      responses:
        '200':
          description: Series list (no key) or downsampled points (with key)
          content:
            application/json:
              examples:
                seriesList:
                  summary: Series list (no key)
                  description: >
                    Each entry carries a `label` (friendly display name). Device
                    series are keyed by the stable button UUID (`device/<uuid>`)
                    and carry their current label; analog series (temperatures,
                    chemistry, SWG) use an empty label.
                  value:
                    - { key: "temp/pool", unit: "C", label: "", first_ts: 1717000000, last_ts: 1717003600, count: 60 }
                    - { key: "chem/salt_ppm", unit: "ppm", label: "", first_ts: 1717000000, last_ts: 1717003600, count: 60 }
                    - { key: "device/4b8c1e2a-7f3d-4a9b-bc10-2f5e6d7a8b90", unit: "state", label: "Pool Light", first_ts: 1717000000, last_ts: 1717003600, count: 18 }
                points:
                  summary: Downsampled points (with key)
                  value:
                    key: "temp/pool"
                    from: 1717000000
                    to: 1717003600
                    max_points: 500
                    points:
                      - { ts: 1717000000, value: 28.5 }
                      - { ts: 1717000060, value: 28.6 }
        '400':
          description: Bad range (to < from)
        '404':
          description: Unknown series key
        '503':
          description: History is disabled (no --history-db configured)
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/schedules:
    get:
      tags:
        - Schedules
      summary: List all schedules
      description: >
        Returns the full list of schedules. A schedule fires an
        ICommandDispatcher action at a local wall-clock time on the selected
        days. Returns 503 when the scheduler is disabled (no --schedules-file).
        Note on DST: recomputing local time each tick means a spring-forward
        02:30 simply never fires; an ambiguous fall-back time fires once.
      operationId: listSchedules
      responses:
        '200':
          description: Array of schedules
          content:
            application/json:
              example:
                - uuid: "f1a2..."
                  name: "Morning pump"
                  enabled: true
                  days_of_week: 31
                  time_local: "08:00"
                  action: { type: "button_on", target: "Pool Pump" }
        '503': { description: Scheduler is disabled }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Schedules
      summary: Create a schedule
      description: >
        Creates a schedule; the server assigns the uuid. The action variant
        mirrors ICommandDispatcher: button_on/button_off/button_toggle
        (target = device label), pool_setpoint/spa_setpoint (value 1..104),
        chlorinator_percent (value 0..100), circulation_mode (target = mode).
        days_of_week is a bitmask (bit0=Mon..bit6=Sun); time_local is "HH:MM".
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: "Spa warm"
              enabled: true
              days_of_week: 64
              time_local: "17:00"
              action: { type: "spa_setpoint", value: 38 }
      responses:
        '201': { description: Created (returns the schedule with its uuid) }
        '400': { description: Validation error (bad time/action/value) }
        '503': { description: Scheduler is disabled }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/schedules/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Schedules]
      summary: Get a schedule
      operationId: getSchedule
      responses:
        '200': { description: The schedule }
        '404': { description: Unknown schedule }
        '503': { description: Scheduler is disabled }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Schedules]
      summary: Replace a schedule
      operationId: replaceSchedule
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        '200': { description: Updated schedule }
        '400': { description: Validation error }
        '404': { description: Unknown schedule }
        '503': { description: Scheduler is disabled }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Schedules]
      summary: Delete a schedule
      operationId: deleteSchedule
      responses:
        '204': { description: Deleted }
        '404': { description: Unknown schedule }
        '503': { description: Scheduler is disabled }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/schedules/{uuid}/promote:
    post:
      tags: [Schedules]
      summary: Promote an app schedule to the controller
      description: >
        Pair this app schedule (a button_on or button_off point) with its
        complement — the matching button_off/on on the same target and days — into
        an on→off SPAN, check it against the controller's constraints, and, if
        representable, create it on the controller (async, via the same POST
        /api/controller/schedules write path). This is the "promote to controller"
        action of the two-tier schedules model. Requires `schedules.edit`.
      operationId: promoteSchedule
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Promotion queued
          content:
            application/json:
              example:
                status: "queued"
                schedule: { target: "Filter Pump", days_of_week: 127, on_local: "09:00", off_local: "17:00" }
        '400':
          description: The paired span is not representable on the controller
          content:
            application/json:
              example: { error: "the paired span is not representable on the controller", blockers: ["day_selection_not_expressible"] }
        '404': { description: Unknown schedule }
        '422': { description: Non-button action, or no complementary on/off schedule to form a span }
        '503': { description: Scheduler disabled / no capable writer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/controller/schedules:
    get:
      tags:
        - Schedules
      summary: List the controller's internal schedules (read-only)
      description: >
        Returns the schedules stored inside the AquaLink controller itself (its
        built-in timers/programs that turn equipment on/off). These are not
        observable from the passive RS-485 stream; they are read by navigating
        the OneTouch/IAQ "Program" menu pages. `status` reports source
        availability: `available` (parsed and listed), `pending_capture` (a
        capable device is present but the page parser is not yet wired) or
        `unsupported` (no device exposes a schedule menu). Each entry is a SPAN
        (on_local..off_local) rather than a point action, distinguishing it from
        the app-side /api/schedules entries in a unified view. The controller
        stores two program groups (A/B); only the currently-active group's
        schedules are observable, so `active_group` names the group the listed
        entries belong to and each entry carries its `group`.
      operationId: listControllerSchedules
      responses:
        '200':
          description: Source status, active program group, plus the array of controller schedules
          content:
            application/json:
              example:
                status: "available"
                active_group: "A"
                schedules:
                  - id: "iaq-A-1"
                    name: "Filter Pump"
                    target: "Filter Pump"
                    group: "A"
                    enabled: true
                    days_of_week: 127
                    on_local: "11:00"
                    off_local: "14:00"
        '503': { description: Controller schedule store is unavailable }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Schedules
      summary: Create a controller program (async)
      description: >
        Creates a new program inside the controller by driving a capable panel's
        (AqualinkTouch/IAQ) Program menu over RS-485. The write is ASYNCHRONOUS: a
        `200` means the write was accepted and queued, not that it is applied —
        poll `GET` to observe the new program appear. The body is one span; only a
        controller-representable program is accepted (single equipment on/off, an
        expressible day selection — all/weekdays/weekends/one day). A body that the
        controller cannot represent is rejected `400` with a `blockers` array of
        stable codes (e.g. `day_selection_not_expressible`). Requires `schedules.edit`.
      operationId: createControllerSchedule
      requestBody:
        required: true
        content:
          application/json:
            example:
              target: "Filter Pump"
              days_of_week: 127
              on_local: "09:00"
              off_local: "17:00"
              name: "Morning filtration"
              group: "A"
      responses:
        '200':
          description: Write queued
          content:
            application/json:
              example:
                status: "queued"
                schedule: { target: "Filter Pump", days_of_week: 127, on_local: "09:00", off_local: "17:00" }
        '400':
          description: Invalid body, or not representable on the controller
          content:
            application/json:
              example:
                error: "program is not representable on the controller"
                blockers: ["day_selection_not_expressible"]
        '503': { description: No controller schedule store / no capable writer present }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/controller/schedules/{id}:
    put:
      tags:
        - Schedules
      summary: Edit a controller program (async)
      description: >
        Edits the controller program whose `id` matches a currently-listed
        controller schedule (resolved from the latest read snapshot), by driving
        the panel's Program menu over RS-485. The body is one span carrying the
        DESIRED field values (same shape as the create body); only a
        controller-representable program is accepted (single equipment on/off, an
        expressible day selection — all/weekdays/weekends/one day). The write is
        ASYNCHRONOUS: a `200` means the edit was queued, not applied — poll `GET`
        to observe the change. A body the controller cannot represent is rejected
        `400` with a `blockers` array. Requires `schedules.edit`.
      operationId: editControllerSchedule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            example:
              target: "Filter Pump"
              days_of_week: 127
              on_local: "09:00"
              off_local: "18:00"
              name: "Morning filtration"
              group: "A"
      responses:
        '200':
          description: Edit queued
          content:
            application/json:
              example:
                status: "queued"
                schedule: { target: "Filter Pump", days_of_week: 127, on_local: "09:00", off_local: "18:00" }
        '400':
          description: Invalid body, or not representable on the controller
          content:
            application/json:
              example:
                error: "program is not representable on the controller"
                blockers: ["day_selection_not_expressible"]
        '404': { description: Unknown program id }
        '503': { description: No controller schedule store / no capable writer present }
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - Schedules
      summary: Delete a controller program (async)
      description: >
        Removes the controller program whose `id` matches a currently-listed
        controller schedule (resolved from the latest read snapshot), by driving
        the panel's Program menu. Asynchronous — a `200` means the delete was
        queued; poll `GET` to confirm the program is gone. Requires `schedules.edit`.
      operationId: deleteControllerSchedule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Delete queued
          content:
            application/json:
              example: { status: "queued" }
        '404': { description: Unknown program id }
        '503': { description: No controller schedule store / no capable writer present }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/preferences:
    get:
      tags:
        - Preferences
      summary: Get user/admin preferences
      description: >
        Returns the current preferences. The typed fields (temperature units,
        alert thresholds, history retention) are read LIVE by the backend
        services, so a change applies without a restart. `ui` is an opaque blob
        the backend does not interpret (e.g. the chemistry gauge bands).
      operationId: getPreferences
      responses:
        '200':
          description: Current preferences
          content:
            application/json:
              example:
                temperature_units: "Celsius"
                alert: { salt_low_ppm: 2600, comms_timeout_seconds: 60, webhook_url: "" }
                history: { retention_days: 90 }
                label_overrides: { "Aux1": "Pool Light", "Aux2": "Waterfall" }
                aux_presence_overrides: { "Aux5": "present" }
                show_aux_id_in_label: false
                ui: { chemistryBands: {}, locale: "en" }
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - Preferences
      summary: Update (partial) preferences
      description: >
        Validates and applies a partial preferences document, then persists it
        (when --preferences-file is set). Ranges enforced: salt_low_ppm 0..6000
        (0 disables), comms_timeout_seconds > 0, retention_days > 0, webhook_url
        empty or absolute http/https, temperature_units Celsius|Fahrenheit,
        label_overrides an object of canonical-label -> friendly-name strings,
        aux_presence_overrides an object of aux-id -> "present"/"absent" (an
        operator override of live aux-presence detection; applying it also
        reconciles the live device graph immediately, same as the dedicated
        `PUT /api/equipment/aux-slots/{aux_id}` route, which is the friendlier
        single-slot entry point for the Settings UI),
        show_aux_id_in_label a boolean (when true the display name is suffixed with
        the protocol aux id, e.g. "Pool Light (Aux5)"; affects display only, not the
        canonical label used for dispatch/MQTT/Home Assistant). The opaque `ui`
        object merges shallowly at its top level: a PUT of `{ui: {locale: "fr"}}`
        updates only `ui.locale` and leaves other `ui.*` keys (e.g.
        `ui.chemistryBands`) intact; a top-level `ui.*` value of null deletes that
        key. A single invalid field rejects the whole request (nothing is applied).
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            example:
              temperature_units: "Fahrenheit"
              alert: { salt_low_ppm: 2800 }
      responses:
        '200': { description: Updated preferences (full document) }
        '400': { description: Validation error }
        '503': { description: Preferences service unavailable }
        '401':
          $ref: '#/components/responses/Unauthorized'

