<!DOCTYPE html>
<html lang="en" x-data x-bind:class="$store.theme.isDark ? 'dark' : ''" x-bind:data-theme="$store.theme.isDark ? 'dark' : 'light'" x-bind:data-accent="$store.accent ? $store.accent.name : 'teal'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <title>Aqualink Automate</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="stylesheet" href="/vendor/fonts/fonts.css">
    <link rel="stylesheet" href="/styles/app.css">
    <link rel="stylesheet" href="/styles/components.css">
    <script defer src="/vendor/qrcode.min.js"></script>
    <script defer src="/vendor/alpine.min.js"></script>
    <script defer src="/vendor/chart.umd.min.js"></script>
    <script defer src="/vendor/chartjs-adapter-date-fns.min.js"></script>
</head>
<body x-data="app()" x-init="init()">

    <!-- ====== ICON SPRITE (equipment controls; line-art, theme-coloured) ====== -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
        <symbol id="icon-power" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>
        </symbol>
        <symbol id="icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </symbol>
        <symbol id="icon-pump" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </symbol>
        <symbol id="icon-filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
        </symbol>
        <symbol id="icon-heater" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
        </symbol>
        <symbol id="icon-waves" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 7c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M2 12c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M2 17c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>
        </symbol>
        <symbol id="icon-droplet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
        </symbol>
        <symbol id="icon-wind" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
        </symbol>
        <symbol id="icon-clean" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"/>
        </symbol>
        <symbol id="icon-valve" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3.5"/><line x1="12" y1="2" x2="12" y2="8"/><line x1="12" y1="16" x2="12" y2="22"/><line x1="2" y1="12" x2="8" y2="12"/><line x1="16" y1="12" x2="22" y2="12"/>
        </symbol>
        <!-- Diagnostics device-card icons (controller/protocol devices) -->
        <symbol id="icon-onetouch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/><line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/>
        </symbol>
        <symbol id="icon-iaq" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="13" r="2.5"/><line x1="12" y1="3" x2="12" y2="6"/>
        </symbol>
        <symbol id="icon-serial" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="13" height="10" rx="2"/><line x1="15" y1="10" x2="22" y2="10"/><line x1="15" y1="14" x2="22" y2="14"/>
        </symbol>
        <symbol id="icon-pda" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="2" width="12" height="20" rx="2"/><line x1="10" y1="18" x2="14" y2="18"/>
        </symbol>
        <symbol id="icon-keypad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="4" height="4"/><rect x="10" y="4" width="4" height="4"/><rect x="16" y="4" width="4" height="4"/><rect x="4" y="10" width="4" height="4"/><rect x="10" y="10" width="4" height="4"/><rect x="16" y="10" width="4" height="4"/><rect x="4" y="16" width="4" height="4"/><rect x="10" y="16" width="4" height="4"/><rect x="16" y="16" width="4" height="4"/>
        </symbol>
        <symbol id="icon-remote" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="7" y="2" width="10" height="20" rx="3"/><circle cx="12" cy="7" r="1.5"/><line x1="10" y1="12" x2="14" y2="12"/><line x1="10" y1="15" x2="14" y2="15"/>
        </symbol>
        <!-- About "Features" icons (line-art, matches the sprite above) -->
        <symbol id="icon-feat-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </symbol>
        <symbol id="icon-feat-control" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>
        </symbol>
        <symbol id="icon-feat-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </symbol>
        <symbol id="icon-feat-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
        </symbol>
        <symbol id="icon-feat-mobile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>
        </symbol>
        <symbol id="icon-feat-api" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
        </symbol>
    </svg>

    <!-- ====== AUTH OVERLAY (first-run setup + login; dismissible for guests) ====== -->
    <div class="login-overlay" x-show="$store.auth.showLogin" x-cloak
         @keydown.escape.window="if ($store.auth.canDismissLogin) $store.auth.showLogin = false"
         @click.self="if ($store.auth.canDismissLogin) $store.auth.showLogin = false"
         x-data="{ username: '', password: '', confirm: '', remember: false, pin: '', min: 12,
                   get setupValid() { return this.password.length >= this.min && this.password === this.confirm && this.username.trim().length > 0; },
                   submitSetup() { $store.auth.setup(this.username.trim(), this.password); },
                   submitLogin() { $store.auth.login(this.username.trim(), this.password, this.remember); },
                   submitPin() { $store.auth.loginWithPin(this.pin).then((ok) => { if (ok) this.pin = ''; }); } }">
        <div class="login-card">
            <!-- Guests opened this from "Sign in"; let them back out to the dashboard. -->
            <button class="login-close" type="button" x-show="$store.auth.canDismissLogin" x-cloak
                    @click="$store.auth.showLogin = false" :aria-label="$t('auth.continue_as_guest_aria')">&times;</button>
            <svg class="login-logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <path d="M16 3C16 3 6 15 6 21a10 10 0 0020 0C26 15 16 3 16 3z" fill="#0ea5e9"/>
            </svg>
            <h1 class="login-title">Aqualink Automate</h1>

            <!-- FIRST-RUN SETUP: no accounts exist yet — create the administrator. -->
            <template x-if="$store.auth.setupRequired">
                <div>
                    <p class="login-subtitle" x-text="$t('auth.setup_subtitle')"></p>
                    <form @submit.prevent="submitSetup()">
                        <input class="login-input" type="text" :placeholder="$t('auth.admin_username')"
                               x-model="username" autocomplete="username" :aria-label="$t('auth.admin_username')" required>
                        <input class="login-input" type="password" :placeholder="$t('auth.password_min_placeholder', { min })"
                               x-model="password" autocomplete="new-password" :aria-label="$t('auth.password')" required>
                        <input class="login-input" type="password" :placeholder="$t('auth.confirm_password')"
                               x-model="confirm" autocomplete="new-password" :aria-label="$t('auth.confirm_password')" required>
                        <p class="login-hint" x-show="password.length > 0 && password.length < min" x-cloak
                           x-text="$t('auth.password_too_short', { min })"></p>
                        <p class="login-hint" x-show="confirm.length > 0 && password !== confirm" x-cloak
                           x-text="$t('auth.passwords_no_match')"></p>
                        <button class="login-submit" type="submit" :disabled="$store.auth.busy || !setupValid">
                            <span x-show="!$store.auth.busy" x-text="$t('auth.create_account')"></span>
                            <span x-show="$store.auth.busy" x-cloak x-text="$t('auth.creating')"></span>
                        </button>
                        <p class="login-error" x-show="$store.auth.error" x-cloak x-text="$store.auth.error" role="alert"></p>
                    </form>
                </div>
            </template>

            <!-- LOGIN: accounts exist — sign in. -->
            <template x-if="!$store.auth.setupRequired">
                <div>
                    <p class="login-subtitle" x-text="$t('auth.signin_subtitle')"></p>
                    <form @submit.prevent="submitLogin()">
                        <input class="login-input" type="text" :placeholder="$t('auth.username')"
                               x-model="username" autocomplete="username" :aria-label="$t('auth.username')" required>
                        <input class="login-input" type="password" :placeholder="$t('auth.password')"
                               x-model="password" autocomplete="current-password" :aria-label="$t('auth.password')" required>
                        <label class="login-remember">
                            <input type="checkbox" x-model="remember">
                            <span x-text="$t('auth.remember_me')"></span>
                        </label>
                        <button class="login-submit" type="submit" :disabled="$store.auth.busy">
                            <span x-show="!$store.auth.busy" x-text="$t('auth.sign_in')"></span>
                            <span x-show="$store.auth.busy" x-cloak x-text="$t('auth.signing_in')"></span>
                        </button>
                        <p class="login-error" x-show="$store.auth.error" x-cloak x-text="$store.auth.error" role="alert"></p>
                    </form>

                    <!-- KIOSK PIN: quick elevation on a shared wall tablet. -->
                    <div class="login-pin" x-show="$store.auth.kioskEnabled" x-cloak>
                        <div class="login-divider"><span x-text="$t('auth.or_use_pin')"></span></div>
                        <form @submit.prevent="submitPin()">
                            <input class="login-input" type="password" inputmode="numeric" autocomplete="off"
                                   :placeholder="$t('auth.kiosk_pin')" x-model="pin" :aria-label="$t('auth.kiosk_pin')">
                            <button class="login-pin-submit" type="submit" :disabled="$store.auth.busy || pin.length === 0">
                                <span x-show="!$store.auth.busy" x-text="$t('auth.enter_pin')"></span>
                                <span x-show="$store.auth.busy" x-cloak x-text="$t('auth.checking')"></span>
                            </button>
                        </form>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- ====== ACCOUNT OVERLAY (Wave A) ====== -->
    <div class="account-overlay" x-data="accountView()" x-show="open" x-cloak
         @account:open.window="show()" @keydown.escape.window="hide()">
        <div class="account-card" role="dialog" aria-modal="true" :aria-label="$t('account.title')" @click.outside="hide()">
            <div class="account-head">
                <h2 class="account-title" x-text="$t('account.title')"></h2>
                <button class="account-close" @click="hide()" :aria-label="$t('common.close')">&times;</button>
            </div>

            <!-- Identity (server-resolved id + group names, rendered verbatim) -->
            <section class="account-section">
                <div class="account-identity">
                    <span class="account-avatar" aria-hidden="true" x-text="identity.slice(0,1).toUpperCase()"></span>
                    <div>
                        <div class="account-username" data-i18n-exempt x-text="identity"></div>
                        <div class="account-groups" data-i18n-exempt x-show="groups.length" x-cloak>
                            <template x-for="g in groups" :key="g">
                                <span class="account-group-chip" x-text="g"></span>
                            </template>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Change password -->
            <section class="account-section">
                <h3 class="account-subhead" x-text="$t('account.change_password')"></h3>
                <form @submit.prevent="changePassword()">
                    <input class="login-input" type="password" :placeholder="$t('account.new_password_min_placeholder', { min: passwordMin })"
                           x-model="newPassword" autocomplete="new-password" :aria-label="$t('account.new_password')">
                    <input class="login-input" type="password" :placeholder="$t('account.confirm_new_password')"
                           x-model="confirmPassword" autocomplete="new-password" :aria-label="$t('account.confirm_new_password')">
                    <button class="account-btn" type="submit" :disabled="pwBusy">
                        <span x-show="!pwBusy" x-text="$t('account.update_password')"></span>
                        <span x-show="pwBusy" x-cloak x-text="$t('account.updating')"></span>
                    </button>
                    <p class="login-error" x-show="pwError" x-cloak x-text="pwError" role="alert"></p>
                    <p class="account-ok" x-show="pwSaved" x-cloak role="status" x-text="$t('account.password_updated_sessions')"></p>
                </form>
            </section>

            <!-- Sessions -->
            <section class="account-section">
                <h3 class="account-subhead" x-text="$t('account.active_sessions')"></h3>
                <p class="login-error" x-show="sessionsError" x-cloak x-text="sessionsError" role="alert"></p>
                <p class="account-muted" x-show="sessionsLoading" x-cloak x-text="$t('account.loading')"></p>
                <p class="account-muted" x-show="!sessionsLoading && sessions.length === 0" x-cloak x-text="$t('account.no_sessions')"></p>
                <ul class="account-session-list">
                    <template x-for="s in sessions" :key="s.id">
                        <li class="account-session">
                            <div class="account-session-info">
                                <!-- Derived from the session's user agent (server data) -->
                                <div class="account-session-device" data-i18n-exempt x-text="deviceLabel(s.user_agent)"></div>
                                <div class="account-session-meta">
                                    <span x-text="s.peer_ip"></span>
                                    <span x-show="s.last_seen_unix" x-cloak x-text="' ' + $t('account.last_seen', { time: relativeTime(s.last_seen_unix) })"></span>
                                </div>
                            </div>
                            <button class="account-revoke" @click="revokeSession(s.id)" :aria-label="$t('account.revoke_session_aria')" x-text="$t('account.revoke')"></button>
                        </li>
                    </template>
                </ul>
            </section>

            <!-- Sign out -->
            <section class="account-section account-actions">
                <button class="account-btn account-btn-secondary" @click="signOut()" x-text="$t('account.sign_out')"></button>
                <button class="account-btn account-btn-danger" @click="signOutEverywhere()" x-text="$t('account.sign_out_everywhere')"></button>
            </section>
        </div>
    </div>

    <!-- ====== ADMINISTRATION OVERLAY (Slice 2 Wave B) ====== -->
    <div class="admin-overlay" x-data="adminView()" x-show="open" x-cloak
         @admin:open.window="show()" @keydown.escape.window="hide()">
        <div class="admin-card" role="dialog" aria-modal="true" :aria-label="$t('admin.title')">
            <div class="admin-head">
                <h2 class="admin-title" x-text="$t('admin.title')"></h2>
                <button class="account-close" @click="hide()" :aria-label="$t('common.close')">&times;</button>
            </div>

            <!-- Tabs -->
            <div class="admin-tabs" role="tablist" :aria-label="$t('admin.sections_aria')">
                <template x-for="t in tabs" :key="t.id">
                    <button class="admin-tab" :class="{ active: tab === t.id }"
                            role="tab" :aria-selected="tab === t.id"
                            @click="selectTab(t.id)" x-text="$t(t.labelKey)"></button>
                </template>
            </div>

            <div class="admin-body">

                <!-- ===== USERS TAB ===== -->
                <section role="tabpanel" x-show="tab === 'users'" x-data="adminUsersView()"
                         x-effect="if (open && tab === 'users') ensureLoaded()">
                    <div class="admin-section-head">
                        <h3 class="admin-subhead" x-text="$t('admin.users')"></h3>
                        <div class="admin-section-actions">
                            <button class="account-btn admin-btn-inline" @click="refresh()" :disabled="loading" x-text="$t('admin.refresh')"></button>
                            <button class="account-btn admin-btn-inline" @click="openCreate()" x-text="$t('admin.new_user')"></button>
                        </div>
                    </div>
                    <p class="login-error" x-show="listError" x-cloak x-text="listError" role="alert"></p>
                    <p class="account-muted" x-show="loading" x-cloak x-text="$t('admin.loading')"></p>

                    <!-- Create panel (x-if so the nested editor only inits when opened) -->
                    <template x-if="panel === 'create'">
                    <div class="admin-panel" x-data="entitlementEditor()" x-init="init([])">
                        <h4 class="admin-panel-title" x-text="$t('admin.new_user')"></h4>
                        <div class="admin-form-grid">
                            <label class="admin-field"><span x-text="$t('admin.username')"></span>
                                <input class="login-input" type="text" x-model="cForm.username" autocomplete="off" :aria-label="$t('admin.username')">
                            </label>
                            <label class="admin-field"><span x-text="$t('admin.password_min', { min: passwordMin })"></span>
                                <input class="login-input" type="password" x-model="cForm.password" autocomplete="new-password" :aria-label="$t('admin.password')">
                            </label>
                            <label class="admin-field"><span x-text="$t('admin.confirm_password')"></span>
                                <input class="login-input" type="password" x-model="cForm.confirm" autocomplete="new-password" :aria-label="$t('admin.confirm_password')">
                            </label>
                        </div>
                        <div class="admin-groups-pick">
                            <div class="admin-group-label" x-text="$t('admin.groups')"></div>
                            <div class="admin-chip-set">
                                <template x-for="g in groups" :key="g.name">
                                    <label class="admin-check-chip" data-i18n-exempt :class="{ on: cForm.groups[g.name] }">
                                        <input type="checkbox" x-model="cForm.groups[g.name]"> <span x-text="g.name"></span>
                                    </label>
                                </template>
                            </div>
                        </div>
                        <div class="admin-group-label" x-text="$t('admin.direct_entitlements')"></div>
                        <div class="ent-editor">
                            <p class="login-error" x-show="loadError" x-cloak x-text="loadError"></p>
                            <label class="admin-check-chip ent-admin" :class="{ on: admin }">
                                <input type="checkbox" x-model="admin"> <span x-text="$t('admin.ent_system_admin')"></span>
                            </label>
                            <div class="ent-actions" x-show="!admin">
                                <div class="admin-chip-set">
                                    <template x-for="a in plainActions()" :key="a">
                                        <label class="admin-check-chip" data-i18n-exempt :class="{ on: selected[a] }">
                                            <input type="checkbox" :checked="selected[a]" @change="toggleAction(a)"> <span x-text="a"></span>
                                        </label>
                                    </template>
                                </div>
                                <template x-if="hasAuxAction()">
                                    <div class="ent-aux">
                                        <div class="admin-group-label" data-i18n-exempt>equipment.control.aux</div>
                                        <div class="ent-aux-modes" role="group" :aria-label="$t('admin.aux_scope_aria')">

                            <div class="circ-body">
                                <div class="circ-title" x-text="$t('dash.active_body')"></div>
                                <div class="circ-sub" x-text="$t('dash.shared_pump', { body: $store.pool.spaModeActive ? $t('common.spa') : $t('common.pool') })"></div>
                            </div>
                            <div class="circ-seg" role="group" :aria-label="$t('dash.active_body')">
                                <button type="button" class="circ-seg-btn" :class="{ active: !$store.pool.spaModeActive }"
                                        :aria-pressed="!$store.pool.spaModeActive"
                                        :disabled="$store.pool.getCommandState('circulation') === 'sending'"
                                        @click="$store.pool.toggleSpaMode(false)" x-text="$t('common.pool')"></button>
                                <button type="button" class="circ-seg-btn" :class="{ active: $store.pool.spaModeActive }"
                                        :aria-pressed="$store.pool.spaModeActive"
                                        :disabled="$store.pool.getCommandState('circulation') === 'sending'"
                                        @click="$store.pool.toggleSpaMode(true)" x-text="$t('common.spa')"></button>
                            </div>
                        </div>
                        <div class="circ-feedback">
                            <span class="cmd-badge cmd-applied" x-show="$store.pool.getCommandState('circulation') === 'applied'" x-transition.opacity x-text="$t('cmd.applied')"></span>
                            <span class="cmd-badge cmd-rejected" x-show="$store.pool.getCommandState('circulation') === 'rejected'" x-transition.opacity x-text="$t('cmd.rejected')"></span>
                            <span class="cmd-badge cmd-timedout" x-show="$store.pool.getCommandState('circulation') === 'timedout'" x-transition.opacity x-text="$t('cmd.timedout')"></span>
                            <span class="cmd-badge cmd-blocked" x-show="$store.pool.getCommandState('circulation') === 'blocked'" x-transition.opacity x-text="$store.system.disableReason || $t('cmd.blocked')"></span>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Temperature Setpoints \u2014 always-visible per-body steppers -->
            <div class="card" x-show="$store.pool.poolSetpoint !== '--' || $store.pool.spaSetpoint !== '--'">
                <div class="card-header" x-text="$t('dash.temperature_setpoints')"></div>
                <div class="card-body">
                    <!-- Pool setpoint -->
                    <div class="setpoint-row" x-show="$store.pool.poolSetpoint !== '--'">
                        <span class="setpoint-row-label" x-text="$t('common.pool')"></span>
                        <span class="setpoint-feedback">
                            <span class="cmd-badge cmd-applied" x-show="$store.pool.getCommandState('setpoint:pool') === 'applied'" x-transition.opacity x-text="$t('cmd.applied')"></span>
                            <span class="cmd-badge cmd-rejected" x-show="$store.pool.getCommandState('setpoint:pool') === 'rejected'" x-transition.opacity x-text="$t('cmd.rejected')"></span>
                        </span>
                        <div class="setpoint-stepper">
                            <button class="setpoint-btn" :aria-label="$t('dash.decrease_setpoint', { body: $t('common.pool') })" @click="$store.pool.adjustSetpoint('pool', -0.5)">&minus;</button>
                            <span class="setpoint-row-value" x-text="$store.pool.poolSetpointDisplay"></span>
                            <button class="setpoint-btn" :aria-label="$t('dash.increase_setpoint', { body: $t('common.pool') })" @click="$store.pool.adjustSetpoint('pool', 0.5)">+</button>
                        </div>
                    </div>
                    <!-- Spa setpoint -->
                    <div class="setpoint-row" x-show="$store.pool.spaSetpoint !== '--'">
                        <span class="setpoint-row-label" x-text="$t('common.spa')"></span>
                        <span class="setpoint-feedback">
                            <span class="cmd-badge cmd-applied" x-show="$store.pool.getCommandState('setpoint:spa') === 'applied'" x-transition.opacity x-text="$t('cmd.applied')"></span>
                            <span class="cmd-badge cmd-rejected" x-show="$store.pool.getCommandState('setpoint:spa') === 'rejected'" x-transition.opacity x-text="$t('cmd.rejected')"></span>
                        </span>
                        <div class="setpoint-stepper">
                            <button class="setpoint-btn" :aria-label="$t('dash.decrease_setpoint', { body: $t('common.spa') })" @click="$store.pool.adjustSetpoint('spa', -0.5)">&minus;</button>
                            <span class="setpoint-row-value" x-text="$store.pool.spaSetpointDisplay"></span>
                            <button class="setpoint-btn" :aria-label="$t('dash.increase_setpoint', { body: $t('common.spa') })" @click="$store.pool.adjustSetpoint('spa', 0.5)">+</button>
                        </div>
                    </div>
                </div>
            </div>
            </div><!-- /.dash-cols -->

            <!-- Chemistry Gauges -->
            <div class="section-title" x-text="$t('dash.water_chemistry')"></div>
            <div class="gauge-grid mb-2">
                <template x-for="type in ['ph', 'orp', 'salt']" :key="type">
                    <div class="gauge-card" x-data="chemistryGauge(type)"
                         :class="{ 'gauge-card--empty': numericValue === null }">
                        <div class="gauge-header">
                            <span class="gauge-label" x-text="cfg.label"></span>
                            <span class="gauge-band-indicator"
                                  x-show="band"
                                  :class="'gauge-band-' + (band || '')"
                                  x-text="statusLabel"></span>
                        </div>
                        <div class="chem-dial" role="meter"
                             :aria-label="cfg.label"
                             :aria-valuenow="numericValue"
                             :aria-valuemin="cfg.min"
                             :aria-valuemax="cfg.max">
                            <svg class="chem-dial-svg" viewBox="0 0 140 140" aria-hidden="true">
                                <circle class="chem-dial-track" cx="70" cy="70" r="54" fill="none" stroke-width="11" stroke-linecap="round" :stroke-dasharray="trackDash"></circle>
                                <circle class="chem-dial-value" cx="70" cy="70" r="54" fill="none" stroke-width="11" stroke-linecap="round"
                                        x-show="numericValue !== null" :stroke="statusColor" :stroke-dasharray="valueDash"></circle>
                            </svg>
                            <div class="chem-dial-center">
                                <span class="chem-dial-num" :style="`color:${statusColor}`" x-text="numericValue === null ? '--' : $nf(numericValue, cfg.decimals)"></span>
                                <span class="chem-dial-unit" x-text="(cfg.unit || '').trim()"></span>
                            </div>
                        </div>
                        <div class="chem-dial-range" x-text="$n(cfg.min) + ' – ' + $n(cfg.max)"></div>
                    </div>
                </template>

                <!-- Chlorinator (SWG): actual output (big) + inline TARGET control.
                     Folded in here (was a duplicate card repeating pH/ORP/Salt). -->
                <div class="gauge-card swg-card" x-data="chlorinatorControl()" x-show="present" x-cloak
                     role="region" :aria-label="$t('dash.swg_aria')">
                    <div class="gauge-header">
                        <span class="gauge-label" x-text="$t('dash.swg_output')"></span>
                        <span class="gauge-band-indicator" x-show="healthBand"
                              :class="'gauge-band-' + (healthBand || '')" x-text="healthLabel"></span>
                    </div>
                    <div class="gauge-value" :style="`color:${healthColor}`" x-text="actualLabel"></div>
                    <div class="swg-target">
                        <span class="swg-target-label" x-text="$t('dash.target')"></span>
                        <input type="range" min="0" max="100" step="5" class="swg-slider"
                               x-model.number="target" @input="touched = true"
                               :disabled="busy || !$store.auth.can('equipment.control.chlorinator')"
                               :aria-label="$t('dash.target_aria')">
                        <span class="swg-target-value" x-text="$n(target) + '%'"></span>
                    </div>
                    <div class="swg-actions">
                        <template x-if="$store.auth.can('equipment.control.chlorinator')">
                            <div class="swg-actions-inner">
                                <button class="swg-set-btn" @click="setPercent()" :disabled="busy || !changed" x-text="$t('dash.set')"></button>
                                <button class="swg-boost-btn" :class="{ active: boost }" @click="toggleBoost()"
                                        :disabled="busy" :aria-pressed="boost" x-text="$t('dash.boost')"></button>
                                <span class="cmd-badge cmd-applied" x-show="feedback === 'applied'" x-transition.opacity x-text="$t('cmd.set_ok')"></span>
                                <span class="cmd-badge cmd-rejected" x-show="feedback === 'rejected'" x-transition.opacity x-text="$t('cmd.failed')"></span>
                            </div>
                        </template>
                        <span class="swg-locked-note" x-show="!$store.auth.can('equipment.control.chlorinator')" x-cloak x-text="$t('auth.locked_adjust')"></span>
                    </div>
                </div>
            </div>

            <!-- Heater Controls -->
            <template x-if="heaterButtons().length > 0">
                <div>
                    <div class="section-title" x-text="$t('dash.heater')"></div>
                    <div class="heater-rows mb-2">
                        <template x-for="button in heaterButtons()" :key="button.id">
                            <div class="heater-row card" x-data="equipmentButton()">
                                <div class="heater-row-inner">
                                    <button class="heater-toggle"
                                            :class="{ active: isActive(button), 'is-locked': !$store.auth.can('equipment.control.heater'), 'cmd-sending': cmdState(button) === 'sending', 'cmd-flash-ok': cmdState(button) === 'applied', 'cmd-flash-bad': cmdState(button) === 'rejected' || cmdState(button) === 'timedout' }"
                                            :aria-pressed="isActive(button)"
                                            :disabled="!$store.auth.can('equipment.control.heater')"
                                            :aria-label="$t('dash.toggle_device', { device: button.label })"
                                            @click="$store.pool.setHeaterMode(button, !isActive(button))">
                                        <span x-text="isActive(button) ? $t('common.on') : $t('common.off')"></span>
                                    </button>
                                    <span class="heater-label" x-text="button.display_label || button.label"></span>
                                    <span class="heater-status-badge"
                                          :class="{
                                              'badge-status-off': !isActive(button),
                                              'badge-status-warn': String(button.status).toLowerCase() === 'enabled',
                                              'badge-status-danger-glow': String(button.status).toLowerCase() === 'heating'
                                          }"
                                          x-text="statusLabel(button)"></span>
                                    <span class="heater-temp" x-text="button.label.toLowerCase().includes('spa') ? $store.pool.spaTemp : $store.pool.poolTemp"></span>
                                    <span class="heater-setpoint text-muted" x-text="button.label.toLowerCase().includes('spa')
                                        ? $store.pool.spaSetpointDisplay
                                        : $store.pool.poolSetpointDisplay"></span>
                                </div>
                                <!-- Command feedback -->
                                <span class="cmd-badge cmd-applied" x-show="cmdState(button) === 'applied'" x-transition.opacity x-text="$t('cmd.applied')"></span>
                                <span class="cmd-badge cmd-rejected" x-show="cmdState(button) === 'rejected'" x-transition.opacity x-text="$t('cmd.rejected')"></span>
                                <span class="cmd-badge cmd-timedout" x-show="cmdState(button) === 'timedout'" x-transition.opacity x-text="$t('cmd.timedout')"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Equipment Controls — controllable (toggleable) devices only -->
            <div class="section-title" x-text="$t('dash.equipment_controls')"></div>
            <div x-show="$store.pool.buttonsLoading" class="text-center">
                <div class="spinner"></div>
                <p class="text-muted text-sm" x-text="$t('dash.loading_equipment')"></p>
            </div>
            <div x-show="!$store.pool.buttonsLoading && controlButtons().length === 0" class="text-center py-3">
                <p class="text-muted" x-text="$t('dash.no_controllable')"></p>
            </div>
            <div class="control-grid" x-show="!$store.pool.buttonsLoading && controlButtons().length > 0">
                <template x-for="button in controlButtons()" :key="button.id">
                    <button class="eq-control"
                            x-data="equipmentButton()"
                            :class="{ active: isActive(button), 'is-locked': !$store.auth.can('equipment.control.aux', button.id), 'cmd-sending': cmdState(button) === 'sending', 'cmd-flash-ok': cmdState(button) === 'applied', 'cmd-flash-bad': cmdState(button) === 'rejected' || cmdState(button) === 'timedout' }"
                            :aria-pressed="isActive(button)"
                            :disabled="!$store.auth.can('equipment.control.aux', button.id)"
                            :aria-label="(button.display_label || button.label) + ' — ' + statusLabel(button) + (!$store.auth.can('equipment.control.aux', button.id) ? ' ' + $t('auth.locked_control_suffix') : '')"
                            @click="toggle(button)">
                        <svg class="eq-control-icon" aria-hidden="true" viewBox="0 0 24 24"><use :href="'#icon-' + iconKey(button)"></use></svg>
                        <span class="eq-control-body">
                            <span class="eq-control-label" x-text="button.display_label || button.label"></span>
                            <span class="eq-control-status" x-text="statusLabel(button)"></span>
                        </span>
                        <!-- Locked affordance for guests / unentitled subjects. -->
                        <span class="eq-lock" x-show="!$store.auth.can('equipment.control.aux', button.id)" x-cloak
                              :title="$t('auth.locked_device')" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <span class="eq-switch" x-show="$store.auth.can('equipment.control.aux', button.id)" :class="{ on: isActive(button) }" aria-hidden="true">
                            <span class="eq-switch-knob"></span>
                        </span>
                        <!-- Command feedback -->
                        <span class="cmd-badge cmd-applied" x-show="cmdState(button) === 'applied'" x-transition.opacity x-text="$t('cmd.applied')"></span>
                        <span class="cmd-badge cmd-rejected" x-show="cmdState(button) === 'rejected'" x-transition.opacity x-text="$t('cmd.rejected')"></span>
                        <span class="cmd-badge cmd-timedout" x-show="cmdState(button) === 'timedout'" x-transition.opacity x-text="$t('cmd.timedout')"></span>
                        <span class="cmd-badge cmd-blocked" x-show="cmdState(button) === 'blocked'" x-transition.opacity x-text="$store.system.disableReason || $t('cmd.blocked')"></span>
                        <span class="cmd-spinner-overlay" x-show="cmdState(button) === 'sending'" aria-hidden="true">
                            <span class="cmd-spinner"></span>
                        </span>
                    </button>
                </template>
            </div>

            <!-- Other Equipment — configurable / informational, read-only. Hidden when empty. -->
            <template x-if="otherButtons().length > 0">
                <div>
                    <div class="section-title" x-text="$t('dash.other_equipment')"></div>
                    <div class="other-equip card mb-2">
                        <template x-for="button in otherButtons()" :key="button.id">
                            <div class="other-equip-row">
                                <span class="other-equip-label" x-text="button.display_label || button.label"></span>
                                <span class="other-equip-status text-muted" x-text="button.status || $t('dash.status_only')"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Freshness pill -->
            <div class="freshness-wrap" x-show="lastUpdateText">
                <span class="freshness-pill" :class="$store.ws.connected ? 'is-live' : 'is-stale'">
                    <span class="freshness-dot" aria-hidden="true"></span>
                    <span x-text="$t('dash.freshness', { state: $store.ws.connected ? $t('common.live') : $t('common.stale'), time: lastUpdateText })"></span>
                </span>
            </div>
        </div>

        <!-- ====== DETAILED VIEW ====== -->
        <div x-show="route === 'detailed'" x-cloak>
            <div class="section-title" x-text="$t('detail.live_system_state')"></div>
            <div class="detail-grid">

                <!-- Temperatures -->
                <div class="card detail-card">
                    <div class="card-header" x-text="$t('detail.temperatures')"></div>
                    <div class="detail-kv">
                        <div class="kv-row"><span class="kv-k" x-text="$t('common.pool')"></span><span class="kv-v" x-text="$store.pool.poolTemp"></span></div>
                        <div class="kv-row"><span class="kv-k" x-text="$t('detail.pool_setpoint')"></span><span class="kv-v" x-text="$store.pool.poolSetpointDisplay"></span></div>
                        <template x-if="$store.pool.hasDualBody">
                            <div>
                                <div class="kv-row"><span class="kv-k" x-text="$t('common.spa')"></span><span class="kv-v" x-text="$store.pool.spaTemp"></span></div>
                                <div class="kv-row"><span class="kv-k" x-text="$t('detail.spa_setpoint')"></span><span class="kv-v" x-text="$store.pool.spaSetpointDisplay"></span></div>
                            </div>
                        </template>
                        <div class="kv-row"><span class="kv-k" x-text="$t('common.air')"></span><span class="kv-v" x-text="$store.pool.airTemp"></span></div>
                    </div>
                </div>

                <!-- Water Chemistry -->
                <div class="card detail-card">
                    <div class="card-header" x-text="$t('detail.water_chemistry')"></div>
                    <div class="detail-kv">
                        <div class="kv-row"><span class="kv-k" x-text="$t('chem.ph')"></span><span class="kv-v" x-text="$store.pool.ph === '--' ? '--' : $n($store.pool.ph)"></span></div>
                        <div class="kv-row"><span class="kv-k" x-text="$t('chem.orp')"></span><span class="kv-v" x-text="$store.pool.orp === '--' ? '--' : ($n($store.pool.orp) + ' mV')"></span></div>
                        <div class="kv-row"><span class="kv-k" x-text="$t('chem.salt')"></span><span class="kv-v" x-text="$store.pool.saltPpm === '--' ? '--' : ($n($store.pool.saltPpm) + ' ppm')"></span></div>
                        <template x-if="$store.pool.chlorinatorPresent">
                            <div>
                                <div class="kv-row"><span class="kv-k" x-text="$t('detail.swg_output')"></span><span class="kv-v" x-text="$store.pool.swgGeneratingPercent === '--' ? '--' : ($n($store.pool.swgGeneratingPercent) + ' %')"></span></div>
                                <div class="kv-row"><span class="kv-k" x-text="$t('detail.swg_target')"></span><span class="kv-v" x-text="$store.pool.swgSetpointPercent === '--' ? '--' : ($n($store.pool.swgSetpointPercent) + ' %')"></span></div>
                                <div class="kv-row"><span class="kv-k" x-text="$t('detail.swg_health')"></span><span class="kv-v" x-text="$store.pool.chlorinatorHealthLabel || $store.pool.chlorinatorHealth"></span></div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Circulation -->
                <div class="card detail-card">
                    <div class="card-header" x-text="$t('detail.circulation')"></div>
                    <div class="detail-kv">
                        <template x-if="$store.pool.hasDualBody">
                            <div class="kv-row"><span class="kv-k" x-text="$t('detail.mode')"></span><span class="kv-v" x-text="$store.pool.spaModeActive ? $t('common.spa') : $t('common.pool')"></span></div>
                        </template>
                        <template x-if="!$store.pool.hasDualBody">
                            <div class="kv-row"><span class="kv-k" x-text="$t('detail.body')"></span><span class="kv-v" x-text="$t('common.pool')"></span></div>
                        </template>
                        <template x-for="b in ($store.pool.buttons || []).filter(x => /pump|filter|spillway/i.test(x.label))" :key="b.id">
                            <div class="kv-row"><span class="kv-k" x-text="b.display_label || b.label"></span><span class="kv-v" x-text="b.status || '--'"></span></div>
                        </template>
                    </div>
                </div>

                <!-- Heating -->
                <template x-if="($store.pool.buttons || []).some(b => /heat|solar/i.test(b.label))">
                <div class="card detail-card">
                    <div class="card-header" x-text="$t('detail.heating')"></div>
                    <div class="detail-kv">
                        <div class="kv-row"><span class="kv-k" x-text="$t('detail.heat_source')"></span><span class="kv-v" x-text="(() => { const h = ($store.pool.buttons || []).find(b => /heat|solar/i.test(b.label) && b.status && !/off/i.test(b.status)); return h ? (h.display_label || h.label) : $t('common.none'); })()"></span></div>
                        <template x-for="b in ($store.pool.buttons || []).filter(x => /heat|solar/i.test(x.label))" :key="b.id">
                            <div class="kv-row"><span class="kv-k" x-text="b.display_label || b.label"></span><span class="kv-v" x-text="b.status || '--'"></span></div>
                        </template>
                    </div>
                </div>
                </template>

                <!-- System -->
                <div class="card detail-card">
                    <div class="card-header" x-text="$t('detail.system')"></div>
                    <div class="detail-kv">
                        <template x-for="field in $store.pool.equipmentVersion" :key="field.label">
                            <div class="kv-row"><span class="kv-k" x-text="field.label"></span><span class="kv-v" x-text="field.value"></span></div>
                        </template>
                        <div class="kv-row"><span class="kv-k" x-text="$t('detail.state')"></span><span class="kv-v" x-text="$store.system.state"></span></div>
                        <div class="kv-row"><span class="kv-k" x-text="$t('detail.system_status')"></span><span class="kv-v" x-text="$store.pool.systemStatusLabel"></span></div>
                        <div class="kv-row" x-show="$store.system.startedAt"><span class="kv-k" x-text="$t('detail.started')"></span><span class="kv-v" x-text="$store.system.startedAt"></span></div>
                        <div class="kv-row" x-show="$store.system.uptime"><span class="kv-k" x-text="$t('detail.uptime')"></span><span class="kv-v" x-text="$store.system.uptime"></span></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- ====== DIAGNOSTICS VIEW ====== -->
        <div x-show="route === 'diagnostics'" x-cloak
             x-data="diagnosticsView()"
             x-effect="if (route === 'diagnostics') { initChart() } else { destroyChart() }">

            <!-- System Health -->
            <div class="section-title mt-2" x-text="$t('diag.system_health')"></div>
            <div class="card mb-2 health-card">
                <div class="health-head">
                    <span class="health-icon" :class="health.ready ? 'is-ok' : 'is-warn'" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                    </span>
                    <div class="health-head-body">
                        <div class="health-title"><span x-text="health.ready ? $t('diag.ready') : $t('diag.not_ready')"></span> <code class="health-endpoint">GET /api/health/detailed</code></div>
                        <div class="health-sub" x-text="health.ready ? $t('diag.all_nominal') : (health.status || $t('diag.starting'))"></div>
                    </div>
                    <div class="health-uptime" x-show="health.uptime_seconds" x-text="$t('diag.uptime', { value: _fmtUptime(health.uptime_seconds) })"></div>
                </div>
                <div class="health-grid">
                    <div class="health-sub-card">
                        <div class="health-sub-title"><span class="health-dot is-ok"></span><span x-text="$t('diag.configuration')"></span></div>
                        <div class="health-kv"><span x-text="$t('diag.pool_config')"></span><span x-text="health.checks?.configuration?.pool_configuration || '--'"></span></div>
                        <div class="health-kv"><span x-text="$t('diag.system_board')"></span><span x-text="health.checks?.configuration?.system_board || '--'"></span></div>
                        <div class="health-kv"><span x-text="$t('diag.mode')"></span><span x-text="health.checks?.configuration?.mode || '--'"></span></div>
                        <div class="health-kv"><span x-text="$t('diag.validation')"></span><span :class="health.checks?.configuration?.equipment_validation?.passed ? 'val-ok' : 'val-bad'" x-text="health.checks?.configuration?.equipment_validation?.passed ? $t('diag.passed') : $t('diag.failed')"></span></div>
                        <div class="health-kv"><span x-text="$t('diag.auxiliaries')"></span><span x-text="(health.checks?.configuration?.equipment_validation?.discovered_auxillaries ?? '–') + ' / ' + (health.checks?.configuration?.equipment_validation?.expected_auxillaries ?? '–')"></span></div>
                        <div class="health-kv"><span x-text="$t('diag.power_centers')"></span><span x-text="(health.checks?.configuration?.equipment_validation?.discovered_power_centers ?? '–') + ' / ' + (health.checks?.configuration?.equipment_validation?.expected_power_centers ?? '–')"></span></div>
                    </div>
                    <div class="health-sub-card">
                        <div class="health-sub-title"><span class="health-dot is-ok"></span><span x-text="$t('diag.equipment')"></span></div>
                        <div class="health-kv"><span x-text="$t('diag.status')"></span><span :class="health.checks?.equipment?.status === 'ok' ? 'val-ok' : ''" x-text="(health.checks?.equipment?.status || '--').toUpperCase()"></span></div>

                        <div class="health-kv"><span x-text="$t('diag.anomalies')"></span><span x-text="(health.checks?.configuration?.equipment_validation?.anomalies?.length) ? health.checks.configuration.equipment_validation.anomalies.length : $t('common.none')"></span></div>
                    </div>
                    <div class="health-sub-card">
                        <div class="health-sub-title"><span class="health-dot" :class="health.checks?.mqtt?.enabled ? 'is-ok' : 'is-off'"></span><span x-text="$t('diag.mqtt')"></span></div>
                        <div class="health-kv"><span x-text="$t('diag.enabled')"></span><span x-text="health.checks?.mqtt?.enabled ? $t('common.yes') : $t('common.no')"></span></div>
                        <div class="health-kv" x-show="health.checks?.mqtt?.enabled"><span x-text="$t('diag.running')"></span><span x-text="health.checks?.mqtt?.running ? $t('common.yes') : $t('common.no')"></span></div>
                        <div class="health-kv" x-show="health.checks?.mqtt?.enabled"><span x-text="$t('diag.connected')"></span><span x-text="health.checks?.mqtt?.connected ? $t('common.yes') : $t('common.no')"></span></div>
                    </div>
                </div>
            </div>

            <div class="section-title mt-2" x-text="$t('diag.serial_port_utilization')"></div>

            <!-- Bandwidth stats -->
            <div class="stat-cards mb-2">
                <div class="stat-card">
                    <div class="stat-card-label" x-text="$t('diag.read_total')"></div>
                    <div class="stat-card-value" x-text="formatBytes($store.stats.bandwidthRead?.total_bytes)"></div>
                    <div class="util-bar-bg">
                        <div class="util-bar-fill" :style="`width:${Math.min(100, $store.stats.bandwidthRead?.average_utilisation_1sec || 0)}%;background:${utilColor($store.stats.bandwidthRead?.average_utilisation_1sec)}`"></div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label" x-text="$t('diag.write_total')"></div>
                    <div class="stat-card-value" x-text="formatBytes($store.stats.bandwidthWrite?.total_bytes)"></div>
                    <div class="util-bar-bg">
                        <div class="util-bar-fill" :style="`width:${Math.min(100, $store.stats.bandwidthWrite?.average_utilisation_1sec || 0)}%;background:${utilColor($store.stats.bandwidthWrite?.average_utilisation_1sec)}`"></div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label" x-text="$t('diag.read_1s_avg')"></div>
                    <div class="stat-card-value" x-text="$nf($store.stats.bandwidthRead?.average_utilisation_1sec || 0, 2) + '%'"></div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label" x-text="$t('diag.write_1s_avg')"></div>
                    <div class="stat-card-value" x-text="$nf($store.stats.bandwidthWrite?.average_utilisation_1sec || 0, 2) + '%'"></div>
                </div>
            </div>

            <!-- Bandwidth utilization chart (FIX 1: Read/Write legend chips + Live indicator) -->
            <div class="card mb-2 bw-card">
                <div class="bw-head">
                    <div>
                        <div class="section-title bw-title" x-text="$t('diag.bandwidth_utilization')"></div>
                        <div class="bw-legend">
                            <button type="button" class="bw-legend-item" :class="{ 'is-off': !bwRead }"
                                    :aria-pressed="bwRead" @click="toggleBw('read')" :title="$t('diag.toggle_read_series')">
                                <span class="bw-legend-swatch bw-swatch-read"></span><span x-text="$t('diag.read')"></span>
                                <strong x-text="$nf($store.stats.bandwidthRead?.average_utilisation_1sec || 0, 1) + '%'"></strong>
                            </button>
                            <button type="button" class="bw-legend-item" :class="{ 'is-off': !bwWrite }"
                                    :aria-pressed="bwWrite" @click="toggleBw('write')" :title="$t('diag.toggle_write_series')">
                                <span class="bw-legend-swatch bw-swatch-write"></span><span x-text="$t('diag.write')"></span>
                                <strong x-text="$nf($store.stats.bandwidthWrite?.average_utilisation_1sec || 0, 1) + '%'"></strong>
                            </button>
                        </div>
                    </div>
                    <div class="bw-head-right">
                        <span class="bw-live" :class="{ 'is-off': !$store.ws.statsConnected }">
                            <span class="bw-live-dot"></span><span x-text="$store.ws.statsConnected ? $t('common.live') : $t('common.offline')"></span>
                        </span>
                        <div class="window-selector">
                            <template x-for="opt in windowOptions" :key="opt.value">
                                <button class="window-btn"
                                        :class="{ active: windowSeconds === opt.value }"
                                        @click="setWindow(opt.value)"
                                        x-text="opt.label"></button>
                            </template>
                        </div>
                    </div>
                </div>
                <div class="chart-container bw-chart">
                    <canvas x-ref="utilizationChart"></canvas>
                </div>
            </div>

            <!-- Serial health metrics (FIX 3: moved to after Bandwidth) -->
            <div class="section-title" x-text="$t('diag.serial_health')"></div>
            <div x-show="$store.stats.serial" class="stat-cards mb-2">
                <div class="stat-card">
                    <div class="stat-card-label" x-text="$t('diag.error_rate')"></div>
                    <div class="stat-card-value" x-text="$store.stats.serial?.message_error_rate ?? '--'"></div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label" x-text="$t('diag.overflow')"></div>
                    <div class="stat-card-value" x-text="$store.stats.serial?.overflow_count ?? '--'"></div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label" x-text="$t('diag.underflow')"></div>
                    <div class="stat-card-value" x-text="$store.stats.serial?.underflow_count ?? '--'"></div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label" x-text="$t('diag.tx_failures')"></div>
                    <div class="stat-card-value" x-text="$store.stats.serial?.transmission_failures ?? '--'"></div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label" x-text="$t('diag.write_queue')"></div>
                    <div class="stat-card-value" x-text="$store.stats.serial?.write_queue_depth ?? '--'"></div>
                </div>
            </div>
            <div x-show="!$store.stats.serial" class="text-center text-muted mb-2 p-2" x-text="$t('diag.waiting_serial')"></div>

            <!-- Message error metrics (FIX 4: after Serial Health, before Latency) -->
            <div class="section-title" x-text="$t('diag.message_errors')"></div>
            <div x-show="$store.stats.messageErrors" class="stat-cards mb-2">
                <div class="stat-card">
                    <div class="stat-card-label" x-text="$t('diag.checksum')"></div>
                    <div class="stat-card-value" x-text="$n($store.stats.messageErrors?.checksum_failures ?? 0)"></div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label" x-text="$t('diag.deserialize')"></div>
                    <div class="stat-card-value" x-text="$n($store.stats.messageErrors?.deserialization_failures ?? 0)"></div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label" x-text="$t('diag.invalid_packet')"></div>
                    <div class="stat-card-value" x-text="$n($store.stats.messageErrors?.invalid_packet_format ?? 0)"></div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label" x-text="$t('diag.generator')"></div>
                    <div class="stat-card-value" x-text="$n($store.stats.messageErrors?.generator_failures ?? 0)"></div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label" x-text="$t('diag.overlapping')"></div>
                    <div class="stat-card-value" x-text="$n($store.stats.messageErrors?.overlapping_packets ?? 0)"></div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label" x-text="$t('diag.buffer_overflow')"></div>
                    <div class="stat-card-value" x-text="$n($store.stats.messageErrors?.buffer_overflows ?? 0)"></div>
                </div>
            </div>
            <div x-show="!$store.stats.messageErrors" class="text-center text-muted mb-2 p-2" x-text="$t('diag.waiting_errors')"></div>

            <!-- Communication Latency (FIX 5: 3-column compact cards, same row) -->
            <div class="section-title" x-text="$t('diag.communication_latency')"></div>
            <div x-show="$store.stats.latency" class="latency-cards mb-2">
                <template x-for="cat in [
                    { key: 'serial_read', labelKey: 'diag.serial_read' },
                    { key: 'serial_write', labelKey: 'diag.serial_write' },
                    { key: 'message_processing', labelKey: 'diag.message_processing' }
                ]" :key="cat.key">
                    <div class="latency-card" x-show="$store.stats.latency?.[cat.key]">
                        <div class="latency-card-head">
                            <span class="latency-card-title" x-text="$t(cat.labelKey)"></span>
                            <span class="latency-window-pill"
                                  x-text="$t('diag.last_window', { window: (($store.stats.latency?.[cat.key]?.window_secs)
                                        ? (($store.stats.latency[cat.key].window_secs % 60 === 0)
                                            ? $t('time.abbr_minutes', { n: $store.stats.latency[cat.key].window_secs / 60 })
                                            : $t('time.abbr_seconds', { n: $store.stats.latency[cat.key].window_secs }))
                                        : $t('time.abbr_minutes', { n: 15 })) })"></span>
                        </div>
                        <div class="latency-pct-grid">
                            <div class="latency-pct">
                                <div class="latency-pct-k">P1</div>
                                <div class="latency-pct-v" x-text="formatMicros($store.stats.latency?.[cat.key]?.p1_us)"></div>
                            </div>
                            <div class="latency-pct">
                                <div class="latency-pct-k">P50</div>
                                <div class="latency-pct-v" x-text="formatMicros($store.stats.latency?.[cat.key]?.p50_us)"></div>
                            </div>
                            <div class="latency-pct">
                                <div class="latency-pct-k">P95</div>
                                <div class="latency-pct-v" x-text="formatMicros($store.stats.latency?.[cat.key]?.p95_us)"></div>
                            </div>
                            <div class="latency-pct">
                                <div class="latency-pct-k">P99</div>
                                <div class="latency-pct-v" x-text="formatMicros($store.stats.latency?.[cat.key]?.p99_us)"></div>
                            </div>
                            <div class="latency-pct">
                                <div class="latency-pct-k" x-text="$t('diag.mean')"></div>
                                <div class="latency-pct-v latency-pct-dim" x-text="formatMicros($store.stats.latency?.[cat.key]?.mean_us)"></div>
                            </div>
                            <div class="latency-pct">
                                <div class="latency-pct-k" x-text="$t('diag.samples')"></div>
                                <div class="latency-pct-v latency-pct-dim" x-text="$n($store.stats.latency?.[cat.key]?.sample_count || 0)"></div>
                            </div>
                            <div class="latency-pct">
                                <div class="latency-pct-k" x-text="$t('diag.cum_mean')"></div>
                                <div class="latency-pct-v latency-pct-dim" x-text="formatMicros($store.stats.latency?.[cat.key]?.cumulative_mean_us)"></div>
                            </div>
                            <div class="latency-pct">
                                <div class="latency-pct-k" x-text="$t('diag.max')"></div>
                                <div class="latency-pct-v latency-pct-dim" x-text="formatMicros($store.stats.latency?.[cat.key]?.max_us)"></div>
                            </div>
                        </div>
                        <div class="latency-card-foot">
                            <span class="latency-foot-label" x-text="$t('diag.since_restart')"></span>
                            <span class="latency-foot-vals">
                                <span><span x-text="$t('diag.min_abbr')"></span> <strong x-text="formatMicros($store.stats.latency?.[cat.key]?.alltime_min_us)"></strong></span>
                                <span><span x-text="$t('diag.max_abbr')"></span> <strong x-text="formatMicros($store.stats.latency?.[cat.key]?.alltime_max_us)"></strong></span>
                            </span>
                        </div>
                    </div>
                </template>
            </div>
            <div x-show="!$store.stats.latency" class="text-center text-muted mb-2 p-2" x-text="$t('diag.waiting_latency')"></div>

            <!-- Device sections (FIX 6/7: compact clickable cards; rich detail moved to modal.
                 Both Emulated + Actual render the same compact card via ONE shared
                 deviceCard() definition; the outer deviceGroups() loop differs only by the
                 bound list. The impl-only "Device Status" section was removed — superseded. -->
            <template x-for="group in deviceGroups()" :key="group.key">
                <div class="device-group" x-data="deviceCard()">
                    <div class="section-title" x-text="group.title"></div>
                    <div>
                        <template x-if="group.devices.length === 0">
                            <p class="text-muted mb-2 mt-0" x-text="group.empty"></p>
                        </template>
                        <div class="device-cards">
                            <template x-for="dev in group.devices" :key="dev.device_id">
                                <div class="device-mini-card"
                                     @click="openDeviceModal(group.key, dev)"
                                     role="button" tabindex="0"
                                     @keydown.enter="openDeviceModal(group.key, dev)"
                                     @keydown.space.prevent="openDeviceModal(group.key, dev)">
                                    <div class="dmc-head">
                                        <span class="dmc-dot" :style="`background:${cardDotColor(dev)}`"></span>
                                        <span class="dmc-name" x-text="dev.device_type"></span>
                                        <span class="dmc-role" x-text="emuLabel(dev)"></span>
                                    </div>
                                    <div class="dmc-summary-row">
                                        <span class="dmc-summary" x-text="summary(dev)"></span>
                                        <template x-if="dev.operating_state">
                                            <span class="badge dmc-status" :class="stateClass(dev.operating_state)"
                                                  x-text="dev.operating_state"></span>
                                        </template>
                                    </div>
                                    <template x-if="hasSuppressedNote(dev)">
                                        <div class="dmc-note">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                                            <span x-text="suppressedNote(dev)"></span>
                                        </div>
                                    </template>
                                    <template x-if="!hasSuppressedNote(dev) && hasPassiveNote(dev)">
                                        <div class="dmc-note">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                                            <span x-text="passiveNote()"></span>
                                        </div>
                                    </template>
                                    <div class="dmc-foot">
                                        <code class="dmc-addr" x-text="dev.device_id"></code>
                                        <span class="dmc-link"><span x-text="$t('diag.view_diagnostics')"></span>
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                                        </span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
            <!-- Message Statistics + MQTT Broker side by side (FIX 8 + FIX 10) -->
            <div class="section-title" x-text="$t('diag.message_statistics_mqtt')"></div>
            <div class="msg-mqtt-grid mb-2">
                <!-- Message Statistics compact card (top 6 + View all) -->
                <div class="card msg-stats-card">
                    <div class="mstat-head">
                        <span class="mstat-title" x-text="$t('diag.message_statistics')"></span>
                        <span class="mstat-sub" x-text="$t('diag.types_top', { count: msgTypeCount })"></span>
                    </div>
                    <div class="mstat-col-head">
                        <span x-text="$t('diag.message_type')"></span>
                        <span class="mstat-col-right"><span class="mstat-cw-count" x-text="$t('diag.count_rate')"></span><span class="mstat-cw-last" x-text="$t('diag.last_seen')"></span></span>
                    </div>
                    <template x-if="msgTypeCount === 0">
                        <div class="text-center text-muted py-3" x-text="$t('diag.waiting_data')"></div>
                    </template>
                    <template x-for="m in msgStatsTop()" :key="m.name || m.id">
                        <div class="mstat-row">
                            <span class="mstat-type" x-text="msgLabel(m)"></span>
                            <span class="mstat-row-right">
                                <span class="mstat-cw-count mstat-nums"><span class="mstat-count" x-text="$n(m.count || 0)"></span><span class="mstat-rate" x-text="msgRate(m)"></span></span>
                                <span class="mstat-cw-last mstat-last" x-text="msgLastSeen(m)"></span>
                            </span>
                        </div>
                    </template>
                    <button type="button" class="mstat-viewall" @click="openMsgModal()">
                        <span x-text="$t('diag.view_all_types', { count: msgTypeCount })"></span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                    </button>
                </div>

                <!-- MQTT Broker card -->
                <div class="card mqtt-card">
                    <div class="mqtt-head">
                        <span class="mqtt-title" x-text="$t('diag.mqtt_broker')"></span>
                        <span class="mqtt-status" :class="!mqtt.enabled ? 'is-off' : (mqtt.connected ? 'is-on' : 'is-warn')">
                            <span class="mqtt-status-dot"></span>
                            <span x-text="!mqtt.enabled ? $t('common.disabled') : (mqtt.connected ? $t('common.connected') : (mqtt.state || $t('common.disconnected')))"></span>
                        </span>
                    </div>
                    <p class="text-muted text-xs mt-0 mb-1" x-show="!mqtt.enabled" x-html="$t('diag.mqtt_disabled_hint_html')"></p>
                    <div class="mqtt-kv" x-show="mqtt.enabled">
                        <div class="mqtt-row"><span x-text="$t('diag.broker')"></span><span class="mqtt-val mqtt-mono"><span x-text="(mqtt.broker_host || '--') + ':' + (mqtt.broker_port || '')"></span><span class="text-muted text-2xs" x-show="mqtt.tls"> · TLS</span></span></div>
                        <div class="mqtt-row"><span x-text="$t('diag.client_id')"></span><span class="mqtt-val" x-text="mqtt.client_id || '--'"></span></div>
                        <div class="mqtt-row"><span x-text="$t('diag.topic_prefix')"></span><span class="mqtt-val" x-text="mqtt.topic_prefix || '--'"></span></div>
                        <div class="mqtt-row"><span x-text="$t('diag.home_assistant')"></span><span class="mqtt-val" x-text="mqtt.home_assistant_enabled ? $t('diag.discovery_on', { prefix: mqtt.ha_discovery_prefix || '' }) : $t('common.off_lc')"></span></div>
                        <div class="mqtt-row mqtt-row-top"><span x-text="$t('diag.published')"></span><span class="mqtt-val mqtt-num" x-text="$n(mqtt.published ?? 0)"></span></div>
                        <div class="mqtt-row"><span x-text="$t('diag.queue_depth')"></span><span class="mqtt-val mqtt-num" x-text="mqtt.queue_depth ?? 0"></span></div>
                        <div class="mqtt-row"><span x-text="$t('diag.dropped')"></span><span class="mqtt-val mqtt-num" x-text="mqtt.dropped ?? 0"></span></div>
                        <div class="mqtt-row"><span x-text="$t('diag.reconnects')"></span><span class="mqtt-val mqtt-num" x-text="mqtt.reconnect_attempts ?? 0"></span></div>
                        <template x-if="mqtt.last_error">
                            <div class="mqtt-row"><span x-text="$t('diag.last_error')"></span><span class="mqtt-val" x-text="mqtt.last_error"></span></div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Log Levels summary card + Configure modal (FIX 9) -->
            <div class="log-levels-head">
                <div class="section-title" style="margin:0" x-text="$t('diag.log_levels')"></div>
                <button type="button" class="log-configure-btn" @click="openLogModal()" :disabled="!logLevelsLoaded">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h6"/></svg>
                    <span x-text="$t('diag.configure')"></span>
                </button>
            </div>
            <div x-show="logLevelsLoaded" class="card log-summary-card mb-2" @click="openLogModal()">
                <div class="logsum-global">
                    <span class="logsum-global-label" x-text="$t('diag.global_level')"></span>
                    <span class="logsum-global-val">
                        <span class="logsum-dot" :style="`background:${logLevelColor(globalLevel || _majorityLevel())}`"></span>
                        <span x-text="logGlobalLabel"></span>
                    </span>
                </div>
                <template x-if="logHasOverrides">
                    <div class="logsum-overrides">
                        <div class="logsum-over-label"><span x-text="$t('diag.overrides')"></span> <span class="logsum-over-count" x-text="logOverrideCount"></span></div>
                        <div class="logsum-over-chips">
                            <template x-for="o in logOverrides()" :key="o[0]">
                                <span class="logsum-chip"><span class="logsum-chip-ch" x-text="o[0]"></span><span class="logsum-chip-lvl" :style="`color:${logLevelColor(o[1])}`" x-text="o[1]"></span></span>
                            </template>
                        </div>
                    </div>
                </template>
                <template x-if="!logHasOverrides">
                    <div class="logsum-none" x-text="$t('diag.all_inherit')"></div>
                </template>
            </div>
            <div x-show="!logLevelsLoaded" class="text-center text-muted mb-2 p-2" x-text="$t('diag.loading_log_levels')"></div>

            <!-- Serial Recording (FIX 11: record chip + status + captures/ prefix input + bytes box) -->
            <div class="section-title" x-text="$t('diag.serial_recording')"></div>
            <div class="card recording-card mb-2">
                <div class="rec-top">
                    <span class="rec-icon"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="7"/></svg></span>
                    <div class="rec-desc">
