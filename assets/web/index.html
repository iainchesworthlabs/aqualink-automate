                        <div class="rec-title" x-text="$t('diag.capture_bus')"></div>
                        <div class="rec-sub" x-text="$t('diag.record_sub')"></div>
                    </div>
                    <span class="badge rec-status" :class="recording.recording ? 'badge-freq' : 'badge-status-off'"
                          x-text="recording.recording ? $t('diag.recording') : $t('diag.idle')"></span>
                    <button type="button" class="rec-toggle"
                            :disabled="recordingBusy || (!recording.recording && !recordingFilename)"
                            @click="recording.recording ? stopRecording() : startRecording()"
                            x-text="recording.recording ? $t('diag.stop') : $t('diag.record')"></button>
                </div>
                <div class="rec-fields">
                    <div class="rec-field-file">
                        <label class="rec-field-label" x-text="$t('diag.capture_file')"></label>
                        <div class="rec-input-wrap" :class="{ 'is-disabled': recording.recording }">
                            <span class="rec-input-prefix">captures/</span>
                            <input type="text" class="rec-input"
                                   x-model="recordingFilename"
                                   :disabled="recording.recording"
                                   spellcheck="false"
                                   placeholder="capture.cap"
                                   :aria-label="$t('diag.capture_file_aria')">
                        </div>
                    </div>
                    <div class="rec-field-bytes">
                        <label class="rec-field-label" x-text="$t('diag.bytes_written')"></label>
                        <div class="rec-bytes-box" :class="{ 'is-active': recording.bytes > 0 }" x-text="formatBytes(recording.bytes)"></div>
                    </div>
                </div>
                <div class="rec-hint">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg>
                    <span x-html="$t('diag.rec_hint_html')"></span>
                </div>
            </div>

            <!-- Matter Status -->
            <!-- Stats connection indicator -->
            <div class="text-muted text-center mt-2 text-2xs">
                <span x-text="$t('diag.stats_ws')"></span>
                <span class="connection-dot connection-dot-sm" :class="$store.ws.statsConnected ? 'connected' : 'disconnected'"></span>
                <span x-text="$store.ws.statsConnected ? $t('common.connected') : $t('common.disconnected')"></span>
            </div>

            <!-- ===== Device-detail modal (FIX 6/7) ===== -->
            <template x-if="modalOpen && selectedDevice()">
                <div class="modal-overlay diag-modal-overlay" @click="closeModal()" x-data="deviceCard()">
                    <div class="modal-content diag-modal" @click="stopProp($event)">
                        <div class="diag-modal-head">
                            <span class="diag-modal-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H4zM2 20h20M9 9h6M9 12h4"/></svg>
                            </span>
                            <div class="diag-modal-titles">
                                <div class="diag-modal-name" x-text="selectedDevice()?.device_type"></div>
                                <div class="diag-modal-addr" x-text="selectedDevice()?.device_id"></div>
                            </div>
                            <span class="dmc-role" x-text="emuLabel(selectedDevice())"></span>
                            <template x-if="selectedDevice()?.operating_state">
                                <span class="badge" :class="stateClass(selectedDevice().operating_state)" x-text="selectedDevice().operating_state"></span>
                            </template>
                            <button type="button" class="diag-modal-close" @click="closeModal()" :aria-label="$t('common.close')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                            </button>
                        </div>
                        <div class="diag-modal-body">
                            <div class="diag-modal-summary" x-text="summary(selectedDevice())"></div>

                            <!-- Tailored detail sections -->
                            <template x-for="(sec, si) in sections(selectedDevice())" :key="si">
                                <div class="diag-modal-section">
                                    <div class="diag-modal-section-title" x-show="sec.label" x-text="sec.label"></div>
                                    <div class="diag-modal-kv">
                                        <template x-for="(row, ri) in sec.rows" :key="ri">
                                            <div class="diag-modal-kv-row">
                                                <span class="diag-modal-kv-k" x-text="row[0]"></span>
                                                <span class="diag-modal-kv-v" x-text="row[1]"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <!-- Spa-side keypad (programmable + pressable) -->
                            <template x-if="selectedDevice()?.device_type === 'SpasideRemote' && spasideForDevice(selectedDevice())">
                                <div class="diag-modal-section">
                                    <div class="diag-modal-section-title">
                                        <span x-text="$t('diag.observed_button_mapping')"></span>
                                        <span class="dmc-role" style="margin-left:8px" x-text="$t('common.read_only')"></span>
                                    </div>
                                    <div class="spaside-indicators" x-show="selectedDevice()?.led_image_seen" style="margin-bottom:12px">
                                        <span class="emu-kv-key" x-text="$t('diag.indicators')"></span>
                                        <template x-for="(state, i) in (selectedDevice()?.leds || [])" :key="i">
                                            <span class="badge" :class="spasideLedBadgeClass(state)"
                                                  :title="$t('diag.indicator_state', { n: i+1, state: state })" x-text="i+1"></span>
                                        </template>
                                    </div>
                                    <div class="spaside-keypad">
                                        <template x-for="grp in spasideKeyGroups(selectedDevice())" :key="grp.label || 'keys'">
                                            <div class="spaside-switch-group">
                                                <div class="spaside-switch-label" x-show="grp.label" x-text="grp.label"></div>
                                                <div class="spaside-key-grid">
                                                    <template x-for="b in grp.buttons" :key="b.index">
                                                        <div class="spaside-key" :class="{ 'is-assigned': b.function, 'is-pending': b.pending }">
                                                            <button class="spaside-key-press"
                                                                    :disabled="!b.pressable || spasideBusy"
                                                                    @click="b.pressable && pressSpasideButton(selectedDevice().device_id, b.index)"
                                                                    :title="b.pressable ? $t('diag.press_key', { n: b.index }) : $t('diag.observed_remote_no_press')">
                                                                <span class="spaside-key-index" x-text="b.index"></span>
                                                                <span class="spaside-key-fn" x-text="b.function || $t('diag.unassigned')"></span>
                                                                <span class="spaside-key-pending" x-show="b.pending" x-text="'→ ' + b.requested"></span>
                                                            </button>
                                                            <button class="spaside-key-edit"
                                                                    :disabled="!b.assignable || spasideBusy || spasideAvailableFunctions.length === 0"
                                                                    @click="toggleSpasideEdit(selectedDevice().device_id, b.index)"
                                                                    :aria-label="$t('diag.program_key')">&#9881;</button>
                                                            <div class="spaside-key-editor"
                                                                 x-show="spasideEditKey === spasideEditId(selectedDevice().device_id, b.index)" x-cloak>
                                                                <select class="settings-input spaside-fn-select" :disabled="spasideBusy"
                                                                        @change="setSpasideAssignment(b.switch, b.button, $event.target.value)">
                                                                    <option value="" x-text="b.function ? $t('diag.change_function') : $t('diag.pick_function')"></option>
                                                                    <template x-for="fn in spasideAvailableFunctions" :key="fn">
                                                                        <option :value="fn" :selected="fn === b.function" x-text="fn"></option>
                                                                    </template>
                                                                </select>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <!-- Recent commands -->
                            <template x-if="recentCommands(selectedDevice()).length">
                                <div class="diag-modal-section">
                                    <div class="diag-modal-section-title" x-text="$t('diag.recent_commands')"></div>
                                    <div class="diag-cmd-list">
                                        <template x-for="(cmd, ci) in recentCommands(selectedDevice())" :key="ci">
                                            <div class="diag-cmd-row">
                                                <span class="diag-cmd-dot" :class="cmdOutcomeClass(cmd.outcome)"></span>
                                                <span class="diag-cmd-desc" x-text="cmd.description"></span>
                                                <span class="diag-cmd-outcome" :class="cmdOutcomeClass(cmd.outcome)" x-text="cmd.outcome"></span>
                                                <span class="diag-cmd-age" x-text="fmtAge(cmd.age_seconds)"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <!-- Panel screen -->
                            <template x-if="hasScreen(selectedDevice())">
                                <div class="diag-modal-section">
                                    <div class="diag-modal-section-title"><span x-text="$t('diag.panel_screen')"></span> &middot; <span style="color:var(--accent)" x-text="screenTitle(selectedDevice())"></span></div>
                                    <div class="diag-screen">
                                        <template x-for="(line, idx) in screenLines(selectedDevice())" :key="idx">
                                            <div class="diag-screen-line" :class="{ 'is-hl': isHighlighted(selectedDevice(), idx) }">
                                                <span class="diag-screen-num" x-text="idx"></span>
                                                <span x-text="line || ' '"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <!-- Raw diagnostics -->
                            <div class="diag-modal-section">
                                <div class="diag-modal-section-title" x-text="$t('diag.raw_diagnostics')"></div>
                                <div class="diag-raw">
                                    <template x-for="rw in rawRows(selectedDevice())" :key="rw.k">
                                        <div class="diag-raw-row"><span class="diag-raw-k" x-text="rw.k"></span><span class="diag-raw-v" x-text="rw.v"></span></div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- ===== Log-levels modal (FIX 9) ===== -->
            <template x-if="logModalOpen">
                <div class="modal-overlay diag-modal-overlay" @click="closeLogModal()">
                    <div class="modal-content diag-modal" @click="stopProp($event)">
                        <div class="diag-modal-head">
                            <span class="diag-modal-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h6"/></svg>
                            </span>
                            <div class="diag-modal-titles">
                                <div class="diag-modal-name" x-text="$t('diag.log_levels')"></div>
                                <div class="diag-modal-addr" x-text="$t('diag.log_modal_sub')"></div>
                            </div>
                            <button type="button" class="diag-modal-close" @click="closeLogModal()" :aria-label="$t('common.close')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                            </button>
                        </div>
                        <div class="diag-modal-body">
                            <div class="log-global-box">
                                <div class="log-global-box-head">
                                    <span class="log-global-box-title" x-text="$t('diag.global_level')"></span>
                                    <span class="log-global-box-sub" x-text="$t('diag.global_inherit_sub')"></span>
                                </div>
                                <div class="log-seg">
                                    <template x-for="lvl in severityLevels" :key="lvl">
                                        <button type="button" class="log-seg-btn" :class="{ active: globalLevel === lvl }"
                                                @click="setGlobalLevel(lvl)" x-text="lvl"></button>
                                    </template>
                                </div>
                            </div>
                            <div class="log-filter-row">
                                <input type="text" class="log-search" x-model="logSearch" :placeholder="$t('diag.search_channels')">
                                <button type="button" class="log-filter-btn" :class="{ active: logFilter === 'all' }" @click="logFilter = 'all'" x-text="$t('common.all')"></button>
                                <button type="button" class="log-filter-btn" :class="{ active: logFilter === 'overrides' }" @click="logFilter = 'overrides'"><span x-text="$t('diag.overrides')"></span> <span x-text="logOverrideCount"></span></button>
                            </div>
                            <div class="log-chan-list">
                                <template x-for="[ch, lvl] in logFilteredChannels()" :key="ch">
                                    <div class="log-chan-row">
                                        <span class="log-chan-name"><span class="log-chan-dot" :style="`background:${logLevelColor(lvl)}`"></span><span x-text="ch"></span></span>
                                        <div class="log-seg log-seg-sm">
                                            <template x-for="s in severityLevels" :key="s">
                                                <button type="button" class="log-seg-btn" :class="{ active: lvl === s }"
                                                        @click="setChannelLevel(ch, s)" x-text="s"></button>
                                            </template>
                                        </div>
                                        <button type="button" class="log-chan-reset" :class="{ 'is-active': logIsOverride(ch) }"
                                                :disabled="!logIsOverride(ch)" @click="resetChannelLevel(ch)" :title="$t('diag.reset_to_global')">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
                                        </button>
                                    </div>
                                </template>
                                <template x-if="logFilteredChannels().length === 0">
                                    <div class="text-center text-muted" style="padding:24px;font-size:13px" x-text="$t('diag.no_channels_match')"></div>
                                </template>
                            </div>
                            <template x-if="logHasOverrides">
                                <div class="log-reset-all-row">
                                    <button type="button" class="log-reset-all" @click="resetAllLogs()" x-text="$t('diag.reset_all_to_global')"></button>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- ===== Message-statistics modal (FIX 8) ===== -->
            <template x-if="msgModalOpen">
                <div class="modal-overlay diag-modal-overlay" @click="closeMsgModal()">
                    <div class="modal-content diag-modal" @click="stopProp($event)">
                        <div class="diag-modal-head">
                            <span class="diag-modal-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-6M11 20V8M17 20v-11"/></svg>
                            </span>
                            <div class="diag-modal-titles">
                                <div class="diag-modal-name" x-text="$t('diag.message_statistics')"></div>
                                <div class="diag-modal-addr" x-text="$t('diag.types_live', { count: msgTypeCount })"></div>
                            </div>
                            <button type="button" class="diag-modal-close" @click="closeMsgModal()" :aria-label="$t('common.close')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                            </button>
                        </div>
                        <div class="diag-modal-body">
                            <input type="text" class="log-search mb-1" style="width:100%" x-model="msgSearch" :placeholder="$t('diag.search_message_types')">
                            <div class="mstat-col-head" style="position:sticky;top:0">
                                <span x-text="$t('diag.message_type')"></span>
                                <span class="mstat-col-right"><span class="mstat-cw-count" x-text="$t('diag.count_rate')"></span><span class="mstat-cw-last" x-text="$t('diag.last_seen')"></span></span>
                            </div>
                            <template x-for="m in msgStatsFiltered()" :key="m.name || m.id">
                                <div class="mstat-row">
                                    <span class="mstat-type" x-text="msgLabel(m)"></span>
                                    <span class="mstat-row-right">
                                        <span class="mstat-cw-count mstat-nums"><span class="mstat-count" x-text="$n(m.count || 0)"></span><span class="mstat-rate" x-text="msgRate(m)"></span></span>
                                        <span class="mstat-cw-last mstat-last" x-text="msgLastSeen(m)"></span>
                                    </span>
                                </div>
                            </template>
                            <template x-if="msgStatsFiltered().length === 0">
                                <div class="text-center text-muted" style="padding:24px;font-size:13px" x-text="$t('diag.no_types_match')"></div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- ====== TRENDS VIEW (WS2) ====== -->
        <!-- The effect reads the i18n revision/locale and the display units so
             the canvas (panel labels, axis digits, tick abbreviations, temp
             unit) redraws when they change while the view is open; route
             re-entry covers the picker-in-Settings case. -->
        <div class="trends-view" x-show="route === 'trends'" x-cloak x-data="trendsView()" x-effect="$store.i18n.revision; $store.i18n.locale; $store.pool.displayUnits; if (route === 'trends') onShown()">
            <div class="trends-head">
                <div class="section-title" style="margin:0" x-text="$t('trends.title')"></div>
                <div class="trends-ranges" x-show="available">
                    <template x-for="r in ranges" :key="r.label">
                        <button class="trends-range-btn" :class="{ active: rangeSeconds === r.seconds }" @click="setRange(r.seconds)" x-text="r.label"></button>
                    </template>
                </div>
            </div>

            <template x-if="!available">
                <div class="trends-empty-card">
                    <span class="trends-empty-icon" aria-hidden="true">
                        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M7 14l4-4 3 3 5-6"/><path d="M2 2l20 20"/></svg>
                    </span>
                    <div class="trends-empty-title" x-text="$t('trends.history_disabled')"></div>
                    <div class="trends-empty-text" x-html="$t('trends.history_disabled_text_html')"></div>
                    <div class="trends-empty-pill">/api/history/series · 503 Service Unavailable</div>
                </div>
            </template>

            <template x-if="available">
                <div class="trends-body">
                    <p class="trends-error" x-show="error" x-cloak x-text="error"></p>

                    <div class="trends-chart-card">
                        <canvas x-ref="trendsCanvas"></canvas>
                        <div class="trends-readout" x-ref="trendsReadout" style="display:none"></div>
                    </div>

                    <div class="trends-stats" x-show="statCards.length">
                        <template x-for="c in statCards" :key="c.key">
                            <div class="trends-stat">
                                <div class="trends-stat-label"><span class="trends-swatch" :style="`background:${c.color}`"></span><span x-text="c.name"></span></div>
                                <div class="trends-stat-value" x-text="c.now"></div>
                                <div class="trends-stat-sub" x-text="c.sub"></div>
                            </div>
                        </template>
                    </div>

                    <div class="trends-pickers">
                        <div class="trends-group" x-show="groupSeries('temp').length">
                            <div class="trends-group-label" x-text="$t('trends.temperatures')"></div>
                            <div class="trends-chips">
                                <template x-for="s in groupSeries('temp')" :key="s.key">
                                    <button class="trends-chip" :class="{ on: selected[s.key] }" @click="toggleSeries(s.key)">
                                        <span class="trends-swatch" :style="selected[s.key] ? `background:${s.color}` : `border:1px solid ${s.color}`"></span>
                                        <span x-text="s.name"></span>
                                        <span class="trends-chip-val" x-show="selected[s.key] && currentLabel(s)" x-text="currentLabel(s)"></span>
                                    </button>
                                </template>
                            </div>
                        </div>

                        <div class="trends-group" x-show="groupSeries('chem').length">
                            <div class="trends-group-label" x-text="$t('trends.water_chemistry')"></div>
                            <div class="trends-chips">
                                <template x-for="s in groupSeries('chem')" :key="s.key">
                                    <button class="trends-chip" :class="{ on: selected[s.key] }" @click="toggleSeries(s.key)">
                                        <span class="trends-swatch" :style="selected[s.key] ? `background:${s.color}` : `border:1px solid ${s.color}`"></span>
                                        <span x-text="s.name"></span>
                                        <span class="trends-chip-val" x-show="selected[s.key] && currentLabel(s)" x-text="currentLabel(s)"></span>
                                    </button>
                                </template>
                            </div>
                        </div>

                        <div class="trends-group" x-show="groupSeries('device').length || inactiveCount">
                            <div class="trends-group-label" x-text="$t('trends.equipment_runtime')"></div>
                            <div class="trends-chips">
                                <template x-for="s in groupSeries('device')" :key="s.key">
                                    <button class="trends-chip" :class="{ on: selected[s.key] }" @click="toggleSeries(s.key)">
                                        <span class="trends-swatch" :style="selected[s.key] ? `background:${s.color}` : `border:1px solid ${s.color}`"></span>
                                        <span x-text="s.name"></span>
                                    </button>
                                </template>
                                <button class="trends-inactive-btn" x-show="inactiveCount" @click="toggleInactive()"
                                        x-text="showInactive ? $t('trends.hide_inactive') : $t('trends.show_inactive', { count: inactiveCount })"></button>
                            </div>
                        </div>

                        <span class="text-muted text-xs" x-show="series.length === 0 && !loading" x-text="$t('trends.no_series')"></span>
                    </div>
                </div>
            </template>
        </div>

        <!-- ====== SCHEDULES VIEW (WS4) ====== -->
        <div x-show="route === 'schedules'" x-cloak x-data="schedulesView()" x-effect="if (route === 'schedules') onShown()">
            <!-- Header: title + List/Timeline toggle + New schedule (reachable from both views) -->
            <div class="sched-header">
                <div class="section-title" x-text="$t('sched.title')"></div>
                <div class="sched-header-actions">
                    <div class="sched-view-toggle">
                        <button :class="{ active: view === 'list' }" @click="setView('list')" x-text="$t('sched.list')"></button>
                        <button :class="{ active: view === 'timeline' }" @click="setView('timeline')" x-text="$t('sched.timeline')"></button>
                    </div>
                    <button class="sched-new-btn" @click="newSchedule()" :disabled="monitorOnly || !appAvailable">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                        <span x-text="$t('sched.new')"></span>
                    </button>
                </div>
            </div>

            <p class="trends-error" x-show="error" x-cloak x-text="error"></p>

            <!-- App scheduler disabled (503) empty state -->
            <div class="sched-empty-card" x-show="!appAvailable" x-cloak>
                <span class="sched-empty-icon sched-empty-icon-muted">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v16H3zM3 9h18M8 3v4M16 3v4"/></svg>
                </span>
                <div class="sched-empty-title" x-text="$t('sched.disabled_title')"></div>
                <div class="sched-empty-text" x-html="$t('sched.disabled_text_html')"></div>
                <div class="sched-empty-pill">GET /api/schedules · 503 Service Unavailable</div>
            </div>

            <div x-show="appAvailable">

            <!-- Conflict banner: app actions that contradict a controller program -->
            <div class="sched-conflict-banner" x-show="conflicts.length > 0 && editing === null" x-cloak>
                <span class="sched-conflict-icon" aria-hidden="true">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>
                </span>
                <div class="sched-conflict-body">
                    <div class="sched-conflict-count" x-text="$tn('sched.conflicts', conflicts.length)"></div>
                    <div class="sched-conflict-list">
                        <template x-for="cf in conflicts" :key="cf.key">
                            <div class="sched-conflict-item"><span x-text="cf.name"></span> — <span x-text="cf.conflictMsg"></span></div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- ===== LIST VIEW (editing surface) ===== -->
            <div x-show="view === 'list' && editing === null">

                <div class="sched-list">
                    <!-- rows -->
                    <template x-for="e in unifiedEntries" :key="e.key">
                        <div class="sched-row" :class="{ 'sched-row-conflict': e.conflict, 'sched-row-disabled': !e.enabled }">
                            <div class="sched-time-col">
                                <div class="sched-time" :class="{ 'sched-time-controller': e.owner === 'controller' }" x-text="fmtMin(e.start)"></div>
                                <div class="sched-time-end" x-show="e.owner === 'controller' && e.end !== null" x-text="$t('sched.to_time', { time: fmtMin(e.end) })"></div>
                            </div>
                            <div class="sched-divider"></div>
                            <div class="sched-main">
                                <div class="sched-name">
                                    <span x-text="e.name"></span>
                                    <span class="sched-owner-tag" :class="e.owner === 'controller' ? 'tag-controller' : 'tag-app'" x-text="e.owner === 'controller' ? $t('sched.owner_controller') : $t('sched.owner_app')"></span>
                                    <span class="sched-conflict-flag" x-show="e.conflict" :title="e.conflictMsg" x-text="$t('sched.conflict')"></span>
                                </div>
                                <div class="sched-meta">
                                    <span x-text="daySummary(e.days)"></span> · <span x-text="e.summary"></span>
                                </div>
                                <div class="sched-row-conflict-msg" x-show="e.conflict && e.conflictMsg" x-cloak x-text="e.conflictMsg"></div>
                            </div>
                            <div class="sched-actions" x-show="e.owner === 'app'">
                                <button type="button" class="sched-switch" :class="{ on: e.enabled }" @click="toggleEnabled(e.raw)" :disabled="monitorOnly" :title="e.enabled ? $t('sched.enabled') : $t('sched.disabled')" role="switch" :aria-checked="e.enabled">
                                    <span class="sched-switch-knob"></span>
                                </button>
                                <button type="button" class="sched-icon-btn" @click="editSchedule(e.raw)" :disabled="monitorOnly" :title="$t('common.edit')" :aria-label="$t('common.edit')">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
                                </button>
                                <button type="button" class="sched-icon-btn" @click="remove(e.raw)" :disabled="monitorOnly" :title="$t('common.delete')" :aria-label="$t('common.delete')">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
                                </button>
                            </div>
                            <div class="sched-readonly" x-show="e.owner === 'controller'">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></svg>
                                <span x-text="$t('common.read_only')"></span>
                            </div>
                        </div>
                    </template>

                    <!-- app empty state (scheduler on, no schedules) -->
                    <div class="sched-empty-card" x-show="unifiedEntries.length === 0 && !loading && !controllerPending" x-cloak>
                        <span class="sched-empty-icon sched-empty-icon-accent">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg>
                        </span>
                        <div class="sched-empty-title" x-text="$t('sched.none_yet_title')"></div>
                        <div class="sched-empty-text" x-text="$t('sched.none_yet_text')"></div>
                    </div>

                    <!-- controller status note -->
                    <div class="sched-note" x-show="controllerPending" x-cloak>
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v4l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg>
                        <span x-text="$t('sched.controller_pending')"></span>
                    </div>
                    <div class="sched-note sched-note-muted" x-show="controllerUnsupported" x-cloak x-text="$t('sched.controller_unsupported')"></div>
                </div>
            </div>

            <!-- ===== TIMELINE VIEW (read-only day view) ===== -->
            <div x-show="view === 'timeline' && editing === null" x-cloak class="sched-timeline-card">
                <div class="sched-days">
                    <template x-for="d in days" :key="d.bit">
                        <button type="button" class="sched-day-chip" :class="{ active: timelineDay === d.bit }" @click="setTimelineDay(d.bit)" x-text="d.label"></button>
                    </template>
                </div>

                <p class="sched-timeline-empty" x-show="timelineRows.length === 0 && !loading" x-text="$t('sched.nothing_today')"></p>

                <template x-if="timelineRows.length > 0">
                    <div class="sched-timeline-body">
                        <template x-for="row in timelineRows" :key="row.label">
                            <div class="sched-trk-row">
                                <span class="sched-trk-label" x-text="row.label"></span>
                                <div class="sched-trk">
                                    <template x-for="e in row.spans" :key="e.key">
                                        <div class="sched-bar" :class="{ 'sched-bar-conflict': e.conflict, 'sched-bar-off': !e.enabled }"
                                             :style="`left:${barLeft(e)};width:${barWidth(e)}`" :title="`${e.name} · ${e.summary}`">
                                            <span class="sched-bar-label" x-text="fmtMin(e.start) + '-' + fmtMin(e.end)"></span>
                                        </div>
                                    </template>
                                    <template x-for="e in row.points" :key="e.key">
                                        <div class="sched-mk" :class="{ 'sched-mk-conflict': e.conflict, 'sched-mk-off': !e.enabled }"
                                             :style="`left:${pointLeft(e)}`" :title="`${e.name} · ${e.summary}`"></div>
                                    </template>
                                </div>
                            </div>
                        </template>
                        <!-- axis -->
                        <div class="sched-axis-row">
                            <div class="sched-trk-label"></div>
                            <div class="sched-axis">
                                <span class="sched-axis-tick" style="left:0">00:00</span>
                                <span class="sched-axis-tick sched-axis-mid" style="left:25%">06:00</span>
                                <span class="sched-axis-tick sched-axis-mid" style="left:50%">12:00</span>
                                <span class="sched-axis-tick sched-axis-mid" style="left:75%">18:00</span>
                                <span class="sched-axis-tick sched-axis-end" style="right:0">24:00</span>
                                <span class="sched-axis-now" x-show="showNow" :style="`left:${nowLeft}`" x-cloak x-text="$t('sched.now')"></span>
                            </div>
                        </div>
                    </div>
                </template>

                <div class="sched-legend">
                    <span><span class="lg-swatch lg-controller"></span><span x-text="$t('sched.legend_controller')"></span></span>
                    <span><span class="lg-swatch lg-app"></span><span x-text="$t('sched.legend_app')"></span></span>
                    <span><span class="lg-swatch lg-conflict"></span><span x-text="$t('sched.legend_conflict')"></span></span>
                </div>

                <p class="sched-note" x-show="controllerPending" x-cloak>
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v4l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg>
                    <span x-text="$t('sched.timeline_pending')"></span>
                </p>
            </div>

            <!-- ===== EDIT / NEW FORM ===== -->
            <div x-show="editing !== null" x-cloak class="sched-form-card">
                <div class="sched-form-head">
                    <span class="sched-form-title" x-text="editing === 'new' ? $t('sched.form_new') : $t('sched.form_edit')"></span>
                    <button type="button" class="sched-form-close" @click="cancel()" :aria-label="$t('common.close')">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                    </button>
                </div>
                <div class="sched-form-body">
                    <div class="sched-form-row-name">
                        <div class="sched-field">
                            <span class="sched-field-label" x-text="$t('sched.name')"></span>
                            <input type="text" x-model="form.name" class="sched-input" :placeholder="$t('sched.name_placeholder')">
                        </div>
                        <label class="sched-enabled-inline">
                            <span x-text="$t('sched.enabled')"></span>
                            <button type="button" class="sched-switch" :class="{ on: form.enabled }" @click="form.enabled = !form.enabled" role="switch" :aria-checked="form.enabled">
                                <span class="sched-switch-knob"></span>
                            </button>
                        </label>
                    </div>
                    <div class="sched-field">
                        <span class="sched-field-label" x-text="$t('sched.days')"></span>
                        <div class="sched-days">
                            <template x-for="d in days" :key="d.bit">
                                <button type="button" class="sched-day-chip" :class="{ active: hasDay(d.bit) }" @click="toggleDay(d.bit)" x-text="d.label"></button>
                            </template>
                        </div>
                    </div>
                    <div class="sched-form-row-time">
                        <div class="sched-field">
                            <span class="sched-field-label" x-text="$t('sched.time')"></span>
                            <input type="time" x-model="form.time" class="sched-input">
                        </div>
                        <div class="sched-field">
                            <span class="sched-field-label" x-text="$t('sched.action')"></span>
                            <select x-model="form.actionType" class="sched-input">
                                <template x-for="a in actionTypes" :key="a.value">
                                    <option :value="a.value" x-text="a.label"></option>
                                </template>
                            </select>
                        </div>
                    </div>
                    <div class="sched-field" x-show="isButtonAction(form.actionType)">
                        <span class="sched-field-label" x-text="$t('sched.target_device')"></span>
                        <select x-model="form.target" class="sched-input">
                            <template x-for="b in buttons" :key="b"><option :value="b" x-text="b"></option></template>
                        </select>
                    </div>
                    <div class="sched-field" x-show="form.actionType === 'circulation_mode'">
                        <span class="sched-field-label" x-text="$t('sched.mode')"></span>
                        <input type="text" x-model="form.target" class="sched-input" :placeholder="$t('sched.mode_placeholder')">
                    </div>
                    <div class="sched-field" x-show="isValueAction(form.actionType)">
                        <span class="sched-field-label" x-text="$t('sched.value')"></span>
                        <input type="number" x-model.number="form.value" class="sched-input">
                    </div>
                    <div class="sched-form-actions">
                        <button type="button" class="sched-form-cancel" @click="cancel()" x-text="$t('common.cancel')"></button>
                        <button type="button" class="sched-form-save" @click="save()" :disabled="monitorOnly" x-text="$t('sched.save')"></button>
                    </div>
                </div>
            </div>

            </div><!-- /appAvailable -->
        </div>

        <!-- ====== SETTINGS VIEW ====== -->
        <div x-show="route === 'settings'" x-cloak x-data="settingsView()">

            <div class="section-title mt-2" x-text="$t('settings.title')"></div>

            <!-- Appearance (client-side prefs) -->
            <div class="card mb-2 settings-card">
                <div class="card-header" x-text="$t('settings.appearance')"></div>
                <div class="card-body">
                    <p class="settings-card-desc" x-text="$t('settings.stored_browser')"></p>
                    <div class="settings-group-label" x-text="$t('settings.theme')"></div>
                    <div class="settings-field">
                        <div class="seg-toggle" role="group" :aria-label="$t('settings.theme')">
                            <button type="button" class="seg-option" :class="{ active: !$store.theme.isDark }" @click="if ($store.theme.isDark) $store.theme.toggle()" x-text="$t('settings.light')"></button>
                            <button type="button" class="seg-option" :class="{ active: $store.theme.isDark }" @click="if (!$store.theme.isDark) $store.theme.toggle()" x-text="$t('settings.dark')"></button>
                        </div>
                    </div>
                    <div class="settings-group-label" x-text="$t('settings.accent')"></div>
                    <div class="settings-field">
                        <div class="accent-swatches" role="group" :aria-label="$t('settings.accent_aria')">
                            <template x-for="opt in $store.accent.options" :key="opt">
                                <button type="button" class="accent-swatch" :class="{ active: $store.accent.name === opt }"
                                        :data-accent-swatch="opt" @click="$store.accent.set(opt)"
                                        :aria-pressed="$store.accent.name === opt" :aria-label="opt">
                                    <span class="accent-swatch-dot" aria-hidden="true"></span>
                                    <span class="accent-swatch-name" x-text="opt"></span>
                                </button>
                            </template>
                        </div>
                        <span class="settings-hint" x-text="$t('settings.accent_hint')"></span>
                    </div>
                    <div class="settings-group-label" x-text="$t('settings.language')"></div>
                    <div class="settings-field">
                        <select class="settings-input" :aria-label="$t('settings.language')"
                                @change="$store.i18n.setLocale($event.target.value)">
                            <template x-for="loc in $store.i18n.locales" :key="loc.code">
                                <option :value="loc.code" :selected="loc.code === $store.i18n.locale" x-text="loc.name"></option>
                            </template>
                        </select>
                        <span class="settings-hint" x-text="$t('settings.language_hint')"></span>
                    </div>
                </div>
            </div>

            <!-- System Preferences -->
            <div class="card mb-2 settings-card">
                <div class="card-header card-header-split">
                    <span x-text="$t('settings.system_prefs')"></span>
                    <div class="settings-card-actions">
                        <span class="badge badge-good" x-show="savedFlash" x-cloak x-text="$t('settings.saved')"></span>
                        <button class="sched-new-btn" @click="saveServerPrefs()" x-text="$t('common.save')"></button>
                    </div>
                </div>
                <div class="card-body">
                    <p class="settings-card-desc" x-text="$t('settings.server_stored')"></p>
                    <div class="settings-grid">
                        <div class="settings-field">
                            <label for="pref-units" x-text="$t('settings.temp_units')"></label>
                            <select id="pref-units" x-model="prefs.temperature_units" class="settings-input">
                                <option value="Celsius" x-text="$t('settings.celsius')"></option>
                                <option value="Fahrenheit" x-text="$t('settings.fahrenheit')"></option>
                            </select>
                        </div>
                        <div class="settings-field">
                            <label for="pref-retention"><span x-text="$t('settings.retention')"></span> <span class="settings-unit" x-text="$t('settings.days_unit')"></span></label>
                            <input id="pref-retention" type="number" min="1" x-model.number="prefs.retention_days" class="settings-input">
                            <span class="settings-hint" x-text="$t('settings.retention_hint')"></span>
                        </div>
                        <div class="settings-field">
                            <label for="pref-salt"><span x-text="$t('settings.salt_low')"></span> <span class="settings-unit" x-text="$t('settings.ppm_unit')"></span></label>
                            <input id="pref-salt" type="number" min="0" max="6000" x-model.number="prefs.salt_low_ppm" class="settings-input">
                            <span class="settings-hint" x-text="$t('settings.salt_low_hint')"></span>
                        </div>
                        <div class="settings-field">
                            <label for="pref-comms"><span x-text="$t('settings.comms_timeout')"></span> <span class="settings-unit" x-text="$t('settings.seconds_unit')"></span></label>
                            <input id="pref-comms" type="number" min="1" x-model.number="prefs.comms_timeout_seconds" class="settings-input">
                            <span class="settings-hint" x-text="$t('settings.comms_timeout_hint')"></span>
                        </div>
                        <div class="settings-field settings-field-full">
                            <label for="pref-webhook"><span x-text="$t('settings.webhook')"></span> <span class="settings-unit" x-text="$t('settings.optional')"></span></label>
                            <input id="pref-webhook" type="text" x-model="prefs.webhook_url" class="settings-input" placeholder="https://example.com/hook">
                            <span class="settings-hint" x-text="$t('settings.webhook_hint')"></span>
                        </div>
                    </div>
                    <p class="trends-error" x-show="prefsError" x-cloak x-text="prefsError"></p>
                </div>
            </div>

            <!-- Device Names -->
            <div class="card mb-2 settings-card">
                <div class="card-header card-header-split">
                    <span x-text="$t('settings.device_names')"></span>
                    <div class="settings-card-actions" x-show="deviceButtons().length > 0">
                        <span class="badge badge-good" x-show="savedFlash" x-cloak x-text="$t('settings.saved')"></span>
                        <button class="sched-new-btn" @click="saveLabels()" x-text="$t('common.save')"></button>
                    </div>
                </div>
                <div class="card-body">
                    <p class="settings-card-desc" x-text="$t('settings.device_names_desc')"></p>
                    <label class="settings-toggle-row">
                        <div class="settings-toggle-text">
                            <div class="settings-toggle-title" x-text="$t('settings.show_aux_id')"></div>
                            <div class="settings-toggle-sub" x-text="$t('settings.show_aux_id_sub')"></div>
                        </div>
                        <input type="checkbox" class="settings-switch" x-model="showAuxIdInLabel" @change="saveShowAuxId()" :aria-label="$t('settings.show_aux_id')">
                    </label>
                    <template x-if="deviceButtons().length > 0">
                        <div class="settings-name-grid">
                            <template x-for="button in deviceButtons()" :key="button.id">
                                <div class="settings-name-field" x-show="button.label">
                                    <label :for="'name-' + button.id" x-text="button.label"></label>
                                    <input :id="'name-' + button.id" type="text" class="settings-input"
                                           :placeholder="button.label" x-model="labelOverrides[button.label]">
                                </div>
                            </template>
                        </div>
                    </template>
                    <p class="settings-hint" x-show="deviceButtons().length === 0" x-text="$t('settings.no_devices')"></p>
                </div>
            </div>

            <!-- Chemistry Target Ranges -->
            <div class="section-title mt-2" x-text="$t('settings.chem_ranges')"></div>
            <p class="text-muted mb-1 text-xs" x-text="$t('settings.chem_ranges_desc')"></p>
            <div class="settings-chem-grid">
                <template x-for="gauge in gauges" :key="gauge.key">
                    <div class="card">
                        <div class="card-body">
                            <div class="settings-gauge-header">
                                <strong x-text="gauge.label" class="settings-gauge-title"></strong>
                                <button class="settings-reset-btn" @click="resetGauge(gauge.key)" x-text="$t('common.reset')"></button>
                            </div>
                            <div class="chem-target-line"><span class="chem-target-dot" aria-hidden="true"></span><span x-text="$t('settings.target')"></span> <strong x-text="chemGoodLabel(gauge.key)"></strong></div>
                            <div class="chem-zone-bar" aria-hidden="true">
                                <template x-for="(z, i) in chemZones(gauge.key)" :key="i">
                                    <div class="chem-zone-seg" :style="`width:${z.pct}%;background:${z.color}`"></div>
                                </template>
                            </div>
                            <div>
                                <template x-for="tier in ['good', 'okay', 'bad']" :key="tier">
                                    <div class="chem-tier-row">
                                        <span class="chem-tier-dot" :style="`background:${tier === 'good' ? 'var(--good)' : (tier === 'okay' ? 'var(--warn)' : 'var(--bad)')}`" aria-hidden="true"></span>
                                        <span class="chem-tier-label" x-text="$t('tier.' + tier)"></span>
                                        <input type="number" class="settings-input" :step="gauge.step" :aria-label="$t('settings.tier_min_aria', { tier: $t('tier.' + tier) })"
                                               :value="values[gauge.key][tier + 'Min']" @change="updateValue(gauge.key, tier + 'Min', $event.target.value)">
                                        <span class="chem-tier-sep">&#x2013;</span>
                                        <input type="number" class="settings-input" :step="gauge.step" :aria-label="$t('settings.tier_max_aria', { tier: $t('tier.' + tier) })"
                                               :value="values[gauge.key][tier + 'Max']" @change="updateValue(gauge.key, tier + 'Max', $event.target.value)">
                                    </div>
                                </template>
                            </div>
                            <p class="settings-hint" x-show="errors[gauge.key]" x-cloak x-text="errors[gauge.key]"></p>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Smart Home (Matter) -->
            <div class="section-title mt-2" x-text="$t('settings.smart_home')"></div>
            <div class="card mb-2 matter-card">
                <div class="matter-head">
                    <span class="matter-title" x-text="$t('settings.matter_bridge')"></span>
                    <span class="badge"
                          :class="!matter.enabled ? 'badge-status-off' : (matter.paired ? 'badge-freq' : (matter.running ? 'badge-status-warn' : 'badge-status-off'))"
                          x-text="!matter.enabled ? $t('common.disabled') : (matter.paired ? $t('settings.paired', { count: matter.fabrics ?? 0 }) : (matter.running ? $t('settings.ready_to_pair') : $t('status.starting')))"></span>
                </div>
                <p class="settings-card-desc" x-text="$t('settings.matter_desc')"></p>
                <template x-if="!matter.enabled">
                    <div class="settings-unavailable">
                        <span class="settings-unavailable-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 3l18 18M10.7 5.1A9 9 0 0 1 18.9 13M5.1 10.7A9 9 0 0 0 13 18.9"/></svg></span>
                        <div><div class="settings-unavailable-title" x-text="$t('settings.matter_disabled')"></div><div class="settings-unavailable-sub" x-html="$t('settings.matter_disabled_sub_html')"></div></div>
                    </div>
                </template>
                <template x-if="matter.enabled &amp;&amp; matter.reachable === false">
                    <div class="settings-unavailable">
                        <span class="settings-unavailable-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/></svg></span>
                        <div><div class="settings-unavailable-title" x-text="$t('settings.sidecar_na')"></div><div class="settings-unavailable-sub" x-text="$t('settings.sidecar_na_sub')"></div></div>
                    </div>
                </template>
                <template x-if="matter.enabled &amp;&amp; matter.running">
                    <div class="matter-body">
                        <div class="matter-info">
                            <div class="matter-kv"><span x-text="$t('settings.sidecar')"></span><span x-text="matter.running ? $t('common.running') : $t('settings.not_running')"></span></div>
                            <div class="matter-kv"><span x-text="$t('settings.paired_fabrics')"></span><span x-text="matter.fabrics ?? 0"></span></div>
                            <div class="matter-kv" x-show="matter.node_id"><span x-text="$t('settings.node_id')"></span><span x-text="matter.node_id"></span></div>
                            <div class="matter-kv" x-show="matter.vendor_id"><span x-text="$t('settings.vendor_id')"></span><span x-text="matter.vendor_id"></span></div>
                            <div class="matter-kv" x-show="matter.spec_version"><span x-text="$t('settings.spec')"></span><span x-text="matter.spec_version"></span></div>
                        </div>
                        <template x-if="!matter.paired &amp;&amp; matter.qr_payload">
                            <div class="matter-qr-panel">
                                <div x-ref="matterQr" class="matter-qr" :aria-label="$t('settings.matter_qr_aria')"></div>
                                <div class="matter-qr-label" x-text="$t('settings.scan_to_commission')"></div>
                                <div class="matter-qr-code" x-text="matter.manual_code || '--'"></div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <!-- Profiling -->
            <div class="section-title mt-2" x-text="$t('settings.profiling')"></div>
            <div class="card mb-2 matter-card">
                <div class="matter-head">
                    <span class="matter-title" x-text="$t('settings.perf_profiler')"></span>
                    <span class="badge" :class="profiling.running ? 'badge-freq' : 'badge-status-off'"
                          x-text="!profiling.enabled ? $t('common.disabled') : (profiling.running ? $t('common.running') : $t('common.paused'))"></span>
                </div>
                <p class="settings-card-desc" x-text="$t('settings.profiling_desc')"></p>
                <template x-if="!profiling.enabled">
                    <div class="settings-unavailable">
                        <span class="settings-unavailable-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 3l18 18M10.7 5.1A9 9 0 0 1 18.9 13M5.1 10.7A9 9 0 0 0 13 18.9"/></svg></span>
                        <div><div class="settings-unavailable-title" x-text="$t('settings.profiling_na')"></div><div class="settings-unavailable-sub" x-html="$t('settings.profiling_na_sub_html')"></div></div>
                    </div>
                </template>
                <template x-if="profiling.enabled">
                    <div>
                        <div class="prof-label" x-text="$t('settings.backend')"></div>
                        <div class="prof-backends">
                            <template x-for="b in profiling.available" :key="b">
                                <button type="button" class="prof-backend-btn" :class="{ active: b === profiling.backend }" :disabled="profilingBusy" @click="selectProfilingBackend(b)" x-text="b"></button>
                            </template>
                        </div>
                        <div class="prof-controls">
                            <button type="button" class="btn btn-sm" :disabled="profilingBusy || profiling.running" @click="startProfiling()" x-text="$t('settings.resume')"></button>
                            <button type="button" class="btn btn-sm btn-secondary" :disabled="profilingBusy || !profiling.running" @click="stopProfiling()" x-text="$t('settings.pause')"></button>
                            <span class="prof-state" x-text="profiling.running ? $t('settings.capturing_on', { backend: profiling.backend || '--' }) : $t('common.paused')"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- ====== ABOUT VIEW ====== -->
        <div x-show="route === 'about'" x-cloak x-data="aboutView()">

            <div class="section-title mt-2" x-text="$t('about.software_info')"></div>
            <div class="card mb-2">
                <div class="card-body">
                    <dl class="info-grid">
                        <dt x-text="$t('about.application')"></dt>
                        <dd x-text="$store.pool.projectName || 'Aqualink Automate'"></dd>

                        <dt x-text="$t('about.version')"></dt>
                        <dd x-text="$store.pool.softwareVersion"></dd>

                        <dt x-text="$t('about.description')"></dt>
                        <dd x-text="$store.pool.projectDescription || '--'"></dd>

                        <dt x-text="$t('about.git_commit')"></dt>
                        <dd>
                            <code x-text="shortCommit"></code>
                            <span x-show="$store.pool.gitUncommitted" class="badge badge-warn ml-1" x-text="$t('about.uncommitted')"></span>
                        </dd>

                        <dt x-text="$t('about.commit_date')"></dt>
                        <dd x-text="$store.pool.gitDate || '--'"></dd>

                        <dt x-text="$t('about.homepage')"></dt>
                        <dd>
                            <a x-show="safeHomepage" :href="safeHomepage" x-text="safeHomepage" target="_blank" rel="noopener noreferrer"></a>
                            <span x-show="!safeHomepage" class="text-muted">--</span>
                        </dd>
                    </dl>
                </div>
            </div>

            <div class="section-title" x-text="$t('about.equipment_info')"></div>
            <div class="card mb-2">
                <div class="card-body">
                    <dl class="info-grid" x-show="$store.pool.equipmentVersion.length > 0">
                        <template x-for="field in $store.pool.equipmentVersion" :key="field.label">
                            <div class="contents">
                                <dt x-text="field.label"></dt>
                                <dd x-text="field.value"></dd>
                            </div>
                        </template>
                    </dl>
                    <p x-show="$store.pool.equipmentVersion.length === 0" class="text-muted" x-text="$t('about.no_equipment_info')"></p>
                </div>
            </div>

        </div>

    </main>

    <!-- Toast notifications -->
    <div class="toast-container" aria-live="polite" aria-atomic="false">
        <template x-for="toast in $store.toast.items" :key="toast.id">
            <div class="toast" :class="'toast-' + toast.level" x-transition.opacity>
                <span x-text="toast.message"></span>
                <button class="toast-dismiss" @click="$store.toast.dismiss(toast.id)" :aria-label="$t('common.dismiss')">&times;</button>
            </div>
        </template>
    </div>

    <!-- I18n: English catalog first (synchronous fallback), then the runtime.
         Must precede every store/component/view script. -->
    <script src="/i18n/en.js"></script>
    <script src="/scripts/i18n.js"></script>
    <!-- Store scripts -->
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/prefs-sync.js"></script>
    <script src="/scripts/stores/theme-store.js"></script>
    <script src="/scripts/stores/accent-store.js"></script>
    <script src="/scripts/stores/toast-store.js"></script>
    <script src="/scripts/stores/alerts-store.js"></script>
    <script src="/scripts/stores/ws-store.js"></script>
    <script src="/scripts/stores/system-store.js"></script>
    <script src="/scripts/stores/pool-store.js"></script>
    <script src="/scripts/stores/stats-store.js"></script>
    <!-- Component scripts -->
    <script src="/scripts/components/pool-graphic.js"></script>
    <script src="/scripts/components/chemistry-gauge.js"></script>
    <script src="/scripts/components/chlorinator-control.js"></script>
    <script src="/scripts/components/equipment-button.js"></script>
    <script src="/scripts/components/device-card.js"></script>
    <script src="/scripts/components/entitlement-editor.js"></script>
    <!-- View scripts -->
    <script src="/scripts/views/dashboard-view.js"></script>
    <script src="/scripts/views/diagnostics-view.js"></script>
    <script src="/scripts/views/trends-view.js"></script>
    <script src="/scripts/views/schedules-view.js"></script>
    <script src="/scripts/views/about-view.js"></script>
    <script src="/scripts/views/settings-view.js"></script>
    <script src="/scripts/views/account-view.js"></script>
    <script src="/scripts/views/admin-view.js"></script>
    <script src="/scripts/views/admin-users-view.js"></script>
    <script src="/scripts/views/admin-groups-view.js"></script>
    <script src="/scripts/views/admin-apikeys-view.js"></script>
    <script src="/scripts/views/admin-kiosk-view.js"></script>
    <!-- App init -->
    <script src="/scripts/app.js"></script>
    <!-- Progressive Web App: register the service worker -->
    <script src="/scripts/pwa.js"></script>
</body>
</html>
