# Reusable check for self-hosted CI runner availability — shared by every workflow
# that can build/test on the iainchesworthlabs org-level fleet (_build.yml, ci.yml,
# release.yml, fuzzing.yml, automated-codescanning.yml), so the live-check logic is
# defined once instead of duplicated per caller. See docs/ci-self-hosted-runners.md
# for the full design; the short version:
#   - a fork PR never gets a self-hosted label, full stop - untrusted code must
#     never land on a persistent runner, no live check needed.
#   - vars.RUNNER_LINUX_MODE / RUNNER_WINDOWS_MODE (`auto` default, `self-hosted`,
#     or `github-hosted`) let a forced mode skip the live check entirely - an
#     explicit override is trusted outright.
#   - `auto` checks this repo's own registered runners (works today, empty until a
#     runner is registered directly against this repo) and, if the optional
#     ORG_RUNNERS_TOKEN secret is set, the iainchesworthlabs org's runners too - the
#     fleet itself lives in iainchesworthlabs/ci-runners, this workflow only
#     consumes it, never provisions it.
# Any API failure degrades to GitHub-hosted rather than failing the job - this check
# being unavailable is never a reason to block CI.
name: Check self-hosted runner availability

on:
  workflow_call:
    secrets:
      ORG_RUNNERS_TOKEN:
        description: >-
          Optional org-scoped PAT/App token with "Self-hosted runners: read" on
          iainchesworthlabs, letting this job see runners registered at the org
          level (see iainchesworthlabs/ci-runners) rather than just this repo's own
          runner list. Unset -> that half of the live check is skipped, not an
          error; the repo-level check alone still works once a runner is
          registered directly against this repo.
        required: false
    outputs:
      linux_runner:
        description: 'JSON label array for the Linux leg, e.g. ["self-hosted","Linux","X64"] or ["ubuntu-latest"].'
        value: ${{ jobs.check-runners.outputs.linux_runner }}
      windows_runner:
        description: 'JSON label array for the Windows leg, e.g. ["self-hosted","Windows","X64"] or ["windows-latest"].'
        value: ${{ jobs.check-runners.outputs.windows_runner }}

permissions:
  contents: read

jobs:
  check-runners:
    name: Check self-hosted runner availability
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      linux_runner: ${{ steps.decide.outputs.linux_runner }}
      windows_runner: ${{ steps.decide.outputs.windows_runner }}
    steps:
      - name: Decide runner labels per OS
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          ORG_TOKEN: ${{ secrets.ORG_RUNNERS_TOKEN }}
          REPO: ${{ github.repository }}
          ORG: iainchesworthlabs
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          LINUX_MODE: ${{ vars.RUNNER_LINUX_MODE || 'auto' }}
          WINDOWS_MODE: ${{ vars.RUNNER_WINDOWS_MODE || 'auto' }}
        shell: bash
        run: |
          set -uo pipefail
          HOSTED_LINUX='["ubuntu-latest"]'
          HOSTED_WINDOWS='["windows-latest"]'
          SELF_LINUX='["self-hosted","Linux","X64"]'
          SELF_WINDOWS='["self-hosted","Windows","X64"]'

          # Untrusted fork-PR code never touches self-hosted infra - decided here,
          # before either mode override or the live check even run.
          if [ "$IS_FORK_PR" = "true" ]; then
            echo "linux_runner=$HOSTED_LINUX" >> "$GITHUB_OUTPUT"
            echo "windows_runner=$HOSTED_WINDOWS" >> "$GITHUB_OUTPUT"
            echo "Fork PR - both legs stay on GitHub-hosted runners."
            exit 0
          fi

          # At least one online, idle runner carrying both "self-hosted" and $2 (the
          # OS label) in $1's runner list. Never fails the job: a missing/errored API
          # response (e.g. no runner registered against this repo yet, or ORG_TOKEN
          # unset) just means "not found".
          runner_available() {
            local scope="$1" os_label="$2" json count
            json="$(gh api "$scope/actions/runners" --jq '.runners' 2>/dev/null)" || return 1
            count="$(printf '%s' "$json" | jq "[.[] | select(.status==\"online\" and .busy==false and any(.labels[]; .name==\"self-hosted\") and any(.labels[]; .name==\"$os_label\"))] | length" 2>/dev/null)" || return 1
            [ "${count:-0}" -gt 0 ]
          }

          decide_for_os() {
            local mode="$1" os_label="$2" hosted="$3" self_hosted="$4"
            case "$mode" in
              self-hosted)   printf '%s' "$self_hosted"; return ;;
              github-hosted) printf '%s' "$hosted"; return ;;
            esac
            # auto: repo-level first (works today with zero extra setup), then
            # org-level if a token for it was provisioned.
            if runner_available "repos/$REPO" "$os_label"; then
              printf '%s' "$self_hosted"; return
            fi
            if [ -n "${ORG_TOKEN:-}" ] && GH_TOKEN="$ORG_TOKEN" runner_available "orgs/$ORG" "$os_label"; then
              printf '%s' "$self_hosted"; return
            fi
            printf '%s' "$hosted"
          }

          linux_runner="$(decide_for_os "$LINUX_MODE" "Linux" "$HOSTED_LINUX" "$SELF_LINUX")"
          windows_runner="$(decide_for_os "$WINDOWS_MODE" "Windows" "$HOSTED_WINDOWS" "$SELF_WINDOWS")"
          echo "linux_runner=$linux_runner" >> "$GITHUB_OUTPUT"
          echo "windows_runner=$windows_runner" >> "$GITHUB_OUTPUT"
          echo "Linux: mode=$LINUX_MODE -> $linux_runner"
          echo "Windows: mode=$WINDOWS_MODE -> $windows_runner"
