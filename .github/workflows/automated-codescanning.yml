name: Automated Code Scanning

on:
  # Code scanning is SLOW (full per-platform builds), so only scan code where it is
  # genuinely NEW or where the result must be RECORDED against a branch:
  #   * pull_request into develop -> feature work entering the integration branch
  #   * pull_request into main    -> code arriving on the release branch, EXCEPT a
  #       develop->main promotion (skipped per-job below: that code was already
  #       scanned when it entered develop, so re-scanning the promotion is pure
  #       duplication and was the long redundant run we removed)
  #   * push to main -> REQUIRED to keep the default-branch security baseline (the
  #       Security tab / CodeQL "tool status") current. A pull_request run uploads
  #       SARIF against the throwaway refs/pull/N/merge ref, which NEVER updates
  #       main's baseline -- only an analysis whose ref is refs/heads/main does. So
  #       no amount of per-PR scanning refreshes the Security tab; without this push
  #       trigger the baseline depended solely on the weekly schedule below, and a
  #       single failed/skipped cron silently froze it for weeks. Fires only on
  #       merges to main (one scan per promotion), not the old per-feature-push
  #       re-scanning we removed.
  #   * schedule -> weekly safety-net baseline of the default branch
  #   * workflow_dispatch -> on demand
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      - 'LICENSE'
  pull_request:
    branches: [ "develop", "main" ]
    # Docs-only changes touch no compiled code, so there is nothing new to scan.
    # These jobs are NOT required status checks, so a path-filtered (non-running)
    # workflow does not block the PR — unlike ci.yml, which must use a gate job.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      - 'LICENSE'
  schedule:
    - cron: '42 21 * * 2'
  workflow_dispatch:

concurrency:
  group: code-scanning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:

  ##
  ## CODEQL JOB
  ##

  CodeScanning_CodeQL:
    # Skip a develop->main promotion PR (already scanned on develop entry); run for
    # everything else (PR into develop, non-develop PR into main, schedule, dispatch).
    # AND: fork PRs must not run on the persistent self-hosted runners (untrusted
    # code on a long-lived host) — gate them out, leaving schedule/dispatch/same-repo.
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'pull_request' ||
       github.head_ref != 'develop' ||
       github.base_ref != 'main')
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '["ubuntu-latest"]') }}
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'c-cpp' ]

    steps:
    # BEFORE checkout so a dirty tree cannot fail actions/checkout's git-clean. A
    # prior RELEASE built inside a root gcc container (_build.yml) can leave
    # root-owned files the unprivileged runner cannot delete; reset ownership via a
    # throwaway ROOT container -- NOT host sudo -- then drop the stale build trees.
    - name: Clean workspace (self-hosted)
      if: contains(vars.RUNNER_LINUX || '', 'self-hosted')
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ] && [ -n "$(find . ! -uid "$(id -u)" -print -quit 2>/dev/null)" ]; then
          docker run --rm -v "${{ github.workspace }}":/w -w /w alpine:3 chown -R "$(id -u):$(id -g)" /w
        fi
        rm -rf build install

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        submodules: recursive

    - uses: ./.github/actions/setup-cpp-toolchain
      if: ${{ !contains(vars.RUNNER_LINUX || '', 'self-hosted') }}
      with:
        compiler: gcc-15

    - name: Initialize CodeQL
      uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
      with:
        languages: ${{ matrix.language }}

    - name: Setup vcpkg cache (self-hosted)
      if: contains(vars.RUNNER_LINUX || '', 'self-hosted')
      run: |
        BINARY_DIR="$HOME/.cache/vcpkg/archives"
        DOWNLOADS_DIR="$HOME/.cache/vcpkg/downloads"
        mkdir -p "$BINARY_DIR" "$DOWNLOADS_DIR"
        echo "VCPKG_DEFAULT_BINARY_CACHE=$BINARY_DIR" >> "$GITHUB_ENV"
        echo "VCPKG_DOWNLOADS=$DOWNLOADS_DIR" >> "$GITHUB_ENV"

    - uses: ./.github/actions/setup-vcpkg-cache
      if: ${{ !contains(vars.RUNNER_LINUX || '', 'self-hosted') }}
      with:
        cache-key-prefix: CodeQL

    - name: Bootstrap vcpkg
      run: bash "${{ github.workspace }}/deps/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      env:
        VCPKG_BINARY_SOURCES: "clear;default,readwrite"

    - name: Configure
      uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
      with:
        configurePreset: config-linux-gcc
      env:
        VCPKG_ROOT: ${{ github.workspace }}/deps/vcpkg

    - name: Build
      uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
      with:
        buildPreset: build-linux-gcc
        buildPresetAdditionalArgs: "['--parallel', '8']"
      env:
        VCPKG_ROOT: ${{ github.workspace }}/deps/vcpkg

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
      with:
        upload: false

    - name: filter-sarif
      uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
      with:
        patterns: |
          -**/*
          src/**/*
        input: '../results/cpp.sarif'
        output: '../results/cpp.sarif'

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
      with:
        category: "/language:${{ matrix.language }}"

    - name: Upload Analysis as a Build Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sarif-results
        path: sarif-results
        retention-days: 1

  ##
  ## E2E COVERAGE JOB
  ##
  ## SonarCloud's new-code coverage previously read only the unit/integration
  ## binary's coverage, so every line exercised ONLY by the Playwright e2e suite
  ## (HTTP routes, WebSocket, MQTT, app bootstrap) counted as uncovered. This job
  ## closes that gap: it builds a gcov-instrumented `aqualink-automate`, drives the
  ## SAME Playwright suite ci.yml runs against it, and emits a SECOND SonarQube
  ## coverage report. The SonarCloud job below merges both (Sonar dedupes by line:
  ## a line covered by EITHER report counts as covered).
  ##
  ## It lives in THIS workflow — not ci.yml alongside the functional e2e — so the
  ## report is a same-run artifact the scan can download directly, and so the gcov
  ## toolchain is byte-identical to the unit-coverage build (no cross-runner gcov
  ## version skew, no fragile cross-workflow artifact bridge).
  ##

  CodeScanning_E2ECoverage:
    # Same gating as the other jobs: skip a develop->main promotion PR (already
    # scanned on develop entry) and keep fork PRs off the self-hosted runners.
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'pull_request' ||
       github.head_ref != 'develop' ||
       github.base_ref != 'main')
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '["ubuntu-latest"]') }}
    permissions:
      actions: read
      contents: read

    steps:
    # BEFORE checkout so a dirty tree cannot fail actions/checkout's git-clean. A
    # prior RELEASE built inside a root gcc container (_build.yml) can leave
    # root-owned files the unprivileged runner cannot delete; reset ownership via a
    # throwaway ROOT container -- NOT host sudo -- then drop the stale build trees.
    - name: Clean workspace (self-hosted)
      if: contains(vars.RUNNER_LINUX || '', 'self-hosted')
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ] && [ -n "$(find . ! -uid "$(id -u)" -print -quit 2>/dev/null)" ]; then
          docker run --rm -v "${{ github.workspace }}":/w -w /w alpine:3 chown -R "$(id -u):$(id -g)" /w
        fi
        rm -rf build install

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        submodules: recursive

    - uses: ./.github/actions/setup-cpp-toolchain
      if: ${{ !contains(vars.RUNNER_LINUX || '', 'self-hosted') }}
      with:
        compiler: gcc-15

    - name: Setup vcpkg cache (self-hosted)
      if: contains(vars.RUNNER_LINUX || '', 'self-hosted')
      run: |
        BINARY_DIR="$HOME/.cache/vcpkg/archives"
        DOWNLOADS_DIR="$HOME/.cache/vcpkg/downloads"
        mkdir -p "$BINARY_DIR" "$DOWNLOADS_DIR"
        echo "VCPKG_DEFAULT_BINARY_CACHE=$BINARY_DIR" >> "$GITHUB_ENV"
        echo "VCPKG_DOWNLOADS=$DOWNLOADS_DIR" >> "$GITHUB_ENV"

    - uses: ./.github/actions/setup-vcpkg-cache
      if: ${{ !contains(vars.RUNNER_LINUX || '', 'self-hosted') }}
      with:
        cache-key-prefix: E2ECoverage

    - name: Bootstrap vcpkg
      run: bash "${{ github.workspace }}/deps/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      env:
        VCPKG_BINARY_SOURCES: "clear;default,readwrite"

    # The coverage preset turns ENABLE_COVERAGE on, which appends `--coverage
    # -fprofile-abs-path` to EVERY target (root CMakeLists). So the app target is
    # instrumented exactly like the unit build; -fprofile-abs-path bakes ABSOLUTE
    # .gcda paths into the .gcno, so the counters land back in this build tree no
    # matter what working directory Playwright launches the app from.
    - name: Configure (coverage)
      uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
      with:
        configurePreset: config-linux-gcc-coverage
      env:
        VCPKG_ROOT: ${{ github.workspace }}/deps/vcpkg

    # Build ONLY the app, not the build-linux-gcc-coverage preset's default
    # coverage-testaqualink-automate target (which would instead run the unit
    # suite). Invoke cmake on the configured build dir directly with an explicit
    # --target so there is no preset-vs-CLI target ambiguity. This compiles the app
    # and its instrumented dependency libraries, nothing more. No reconfigure
    # happens (Configure just ran), so vcpkg is not re-invoked here.
    - name: Build instrumented app
      shell: bash
      run: |
        cmake --build "${{ github.workspace }}/build/config-linux-gcc-coverage" \
          --target aqualink-automate --parallel 8
      env:
        VCPKG_ROOT: ${{ github.workspace }}/deps/vcpkg

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install Playwright + Chromium
      shell: bash
      run: |
        npm ci
        # See ci.yml e2e-ui for the --with-deps fallback rationale.
        npx playwright install --with-deps chromium || npx playwright install chromium

    # Drive the four spec variants (mirrors ci.yml e2e-ui) against the INSTRUMENTED
    # binary in its build tree. gcov accumulates counters across the runs (each run
    # merges into the existing .gcda), and Playwright stops the app with SIGTERM
    # (gracefulShutdown in playwright.config.ts) so each run flushes cleanly.
    # continue-on-error: this job exists to harvest coverage, NOT to gate function
    # (ci.yml e2e-ui is the functional gate) — a spec flake must not discard the
    # coverage already written, so keep going to gcovr regardless.
    - name: E2E — default (unauthenticated)
      continue-on-error: true
      shell: bash
      run: npx playwright test
      env:
        AQUALINK_EXE: ${{ github.workspace }}/build/config-linux-gcc-coverage/src/aqualink-automate

    # Identity system (AQUALINK_AUTH_MODE=enabled) — one spec per step; the three
    # identity specs have incompatible auth-store preconditions, so each runs in its
    # own invocation against a fresh --auth-state-dir (see playwright.config.ts).
    - name: E2E — identity (first-run + sessions)
      continue-on-error: true
      shell: bash
      run: npx playwright test e2e/auth.spec.ts
      env:
        AQUALINK_EXE: ${{ github.workspace }}/build/config-linux-gcc-coverage/src/aqualink-automate
        AQUALINK_AUTH_MODE: enabled

    - name: E2E — identity (admin management)
      continue-on-error: true
      shell: bash
      run: npx playwright test e2e/admin.spec.ts
      env:
        AQUALINK_EXE: ${{ github.workspace }}/build/config-linux-gcc-coverage/src/aqualink-automate
        AQUALINK_AUTH_MODE: enabled

    - name: E2E — identity (guest mode + kiosk PIN)
      continue-on-error: true
      shell: bash
      run: npx playwright test e2e/guest.spec.ts
      env:
        AQUALINK_EXE: ${{ github.workspace }}/build/config-linux-gcc-coverage/src/aqualink-automate
        AQUALINK_AUTH_MODE: enabled

    - name: E2E — history enabled
      continue-on-error: true
      shell: bash
      run: npx playwright test
      env:
        AQUALINK_EXE: ${{ github.workspace }}/build/config-linux-gcc-coverage/src/aqualink-automate
        AQUALINK_HISTORY_DB: ${{ runner.temp }}/e2e-history.db

    - name: E2E — scheduler enabled
      continue-on-error: true
      shell: bash
      run: npx playwright test
      env:
        AQUALINK_EXE: ${{ github.workspace }}/build/config-linux-gcc-coverage/src/aqualink-automate
        AQUALINK_SCHEDULES_FILE: ${{ runner.temp }}/e2e-schedules.json

    # TLS mode: serve the whole UI/API over HTTPS (self-signed cert auto-provisioned)
    # so the e2e run exercises the TLS/SSL session path in the HTTP server, the
    # certificate self-provisioning, and the HTTPS bootstrap branch — none of which
    # the plain-HTTP runs above reach. Same (non-identity) spec suite, HTTPS origin.
    - name: E2E — TLS (https)
      continue-on-error: true
      shell: bash
      run: npx playwright test
      env:
        AQUALINK_EXE: ${{ github.workspace }}/build/config-linux-gcc-coverage/src/aqualink-automate
        AQUALINK_TLS: enabled

    # Bootstrap-admin: seed the administrator at start-up via --bootstrap-admin +
    # the password env (not the first-run wizard), covering that headless-provision
    # code path. The store is then non-empty, so admin.spec takes its login branch
    # (its ADMIN_USER/ADMIN_PASS match what we seed here).
    - name: E2E — bootstrap admin
      continue-on-error: true
      shell: bash
      run: npx playwright test e2e/admin.spec.ts
      env:
        AQUALINK_EXE: ${{ github.workspace }}/build/config-linux-gcc-coverage/src/aqualink-automate
        AQUALINK_AUTH_MODE: enabled
        AQUALINK_BOOTSTRAP_ADMIN: wbadmin
        AQUALINK_BOOTSTRAP_ADMIN_PASSWORD: correct-horse-battery-staple

    # Open-bind guard: a non-loopback bind (0.0.0.0) with auth off trips the
    # open-control-plane start-up guard — =warn exercises the prominent warning,
    # =ack the acknowledged (--insecure-no-auth) branch. The default suite runs
    # unchanged (the browser reaches the server over loopback).
    - name: E2E — open bind (warning)
      continue-on-error: true
      shell: bash
      run: npx playwright test
      env:
        AQUALINK_EXE: ${{ github.workspace }}/build/config-linux-gcc-coverage/src/aqualink-automate
        AQUALINK_OPEN_BIND: warn

    - name: E2E — open bind (insecure-no-auth ack)
      continue-on-error: true
      shell: bash
      run: npx playwright test
      env:
        AQUALINK_EXE: ${{ github.workspace }}/build/config-linux-gcc-coverage/src/aqualink-automate
        AQUALINK_OPEN_BIND: ack

    # gcovr may already be baked into the self-hosted image (the unit-coverage
    # CMake target needs it); install it as a fallback for a stock runner.
    - name: Ensure gcovr is available
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        if ! command -v gcovr >/dev/null 2>&1; then
          python3 -m pip install --user --break-system-packages gcovr \
            || python3 -m pip install --user gcovr
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
        fi
        gcovr --version

    # Reduce the .gcda counters to a SonarQube generic coverage report, mirroring
    # the unit target's gcovr invocation (test/CMakeLists.txt) so file paths
    # resolve to `src/...` against the same root and Sonar can merge the two. Run
    # even if a spec failed above, so partial e2e coverage is still captured.
    - name: Generate e2e coverage report (gcovr)
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        gcovr --sonarqube "${{ github.workspace }}/coverage-e2e.xml" \
          -r "${{ github.workspace }}" \
          --gcov-ignore-parse-errors=negative_hits.warn \
          --exclude-throw-branches --exclude-unreachable-branches \
          -e "${{ github.workspace }}/deps" \
          -e "${{ github.workspace }}/build/config-linux-gcc-coverage/vcpkg_installed" \
          -e "${{ github.workspace }}/test" \
          -e "/usr/include" \
          --object-directory="${{ github.workspace }}/build/config-linux-gcc-coverage"
        echo "Generated coverage-e2e.xml ($(wc -c < "${{ github.workspace }}/coverage-e2e.xml") bytes)."

    - name: Upload e2e coverage report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: e2e-coverage-xml
        path: coverage-e2e.xml
        if-no-files-found: warn
        retention-days: 1

  ##
  ## SONARCLOUD JOB
  ##

  CodeScanning_SonarCloud:
    # Depend on the e2e-coverage job so its report is available as a same-run
    # artifact. !cancelled() (rather than the implicit success()) keeps the scan
    # running even if the e2e job FAILED — the assemble step below then falls back
    # to unit-only coverage, so a flaky e2e never drops the whole quality gate.
    needs: CodeScanning_E2ECoverage
    # Skip a develop->main promotion PR (already scanned on develop entry).
    # AND gate out fork PRs from the persistent self-hosted runners (untrusted code
    # on a long-lived host; SonarCloud also needs SONAR_TOKEN, withheld from forks).
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'pull_request' ||
       github.head_ref != 'develop' ||
       github.base_ref != 'main')
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '["ubuntu-latest"]') }}
    env:
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory

    steps:
    # BEFORE checkout so a dirty tree cannot fail actions/checkout's git-clean. A
    # prior RELEASE built inside a root gcc container (_build.yml) can leave
    # root-owned files the unprivileged runner cannot delete; reset ownership via a
    # throwaway ROOT container -- NOT host sudo -- then drop the stale build trees.
    - name: Clean workspace (self-hosted)
      if: contains(vars.RUNNER_LINUX || '', 'self-hosted')
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ] && [ -n "$(find . ! -uid "$(id -u)" -print -quit 2>/dev/null)" ]; then
          docker run --rm -v "${{ github.workspace }}":/w -w /w alpine:3 chown -R "$(id -u):$(id -g)" /w
        fi
        rm -rf build install

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
        submodules: recursive

    - uses: ./.github/actions/setup-cpp-toolchain
      if: ${{ !contains(vars.RUNNER_LINUX || '', 'self-hosted') }}
      with:
        compiler: gcc-15

    - name: Install build-wrapper
      uses: SonarSource/sonarqube-scan-action/install-build-wrapper@713881670b6b3676cda39549040e2d88c70d582e # v8

    - name: Setup vcpkg cache (self-hosted)
      if: contains(vars.RUNNER_LINUX || '', 'self-hosted')
      run: |
        BINARY_DIR="$HOME/.cache/vcpkg/archives"
        DOWNLOADS_DIR="$HOME/.cache/vcpkg/downloads"
        mkdir -p "$BINARY_DIR" "$DOWNLOADS_DIR"
        echo "VCPKG_DEFAULT_BINARY_CACHE=$BINARY_DIR" >> "$GITHUB_ENV"
        echo "VCPKG_DOWNLOADS=$DOWNLOADS_DIR" >> "$GITHUB_ENV"

    - uses: ./.github/actions/setup-vcpkg-cache
      if: ${{ !contains(vars.RUNNER_LINUX || '', 'self-hosted') }}
      with:
        cache-key-prefix: SonarCloud

    - name: Bootstrap vcpkg
      run: bash "${{ github.workspace }}/deps/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      env:
        VCPKG_BINARY_SOURCES: "clear;default,readwrite"

    - name: Configure
      uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
      with:
        configurePreset: config-linux-gcc-coverage
        configurePresetAdditionalArgs: "['-DUSE_SONARQUBE=ON']"
      env:
        VCPKG_ROOT: ${{ github.workspace }}/deps/vcpkg

    - name: Build with build-wrapper
      run: |
        build-wrapper-linux-x86-64 --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} cmake --build --preset=build-linux-gcc-coverage

    # Pull the e2e coverage report produced by CodeScanning_E2ECoverage (same
    # workflow run). Gated on that job succeeding; continue-on-error so a missing
    # artifact (e2e job failed) degrades to unit-only coverage rather than failing.
    - name: Download e2e coverage report
      if: needs.CodeScanning_E2ECoverage.result == 'success'
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: e2e-coverage-xml
        path: e2e-coverage

    # sonar.coverageReportPaths is comma-separated; Sonar merges line coverage so a
    # line covered by EITHER the unit or the e2e report counts. Fall back to the
    # unit report alone if the e2e XML is absent.
    - name: Assemble coverage report paths
      shell: bash
      run: |
        UNIT="${{ github.workspace }}/build/config-linux-gcc-coverage/coverage-testaqualink-automate.xml"
        E2E="${{ github.workspace }}/e2e-coverage/coverage-e2e.xml"
        if [ -f "$E2E" ]; then
          echo "COVERAGE_REPORTS=${UNIT},${E2E}" >> "$GITHUB_ENV"
          echo "Merging unit + e2e coverage reports into the scan."
        else
          echo "COVERAGE_REPORTS=${UNIT}" >> "$GITHUB_ENV"
          echo "::warning::e2e coverage report not found; scanning with unit coverage only."
        fi

    - name: Run SonarCloud scan
      uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dproject.settings=${{ github.workspace }}/sonar-project.properties
          -Dsonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json
          -Dsonar.coverageReportPaths=${{ env.COVERAGE_REPORTS }}

  ##
  ## MSVC CODE ANALYSIS JOB
  ##

  CodeScanning_MSVCCodeAnalysis:
    # Skip a develop->main promotion PR (already scanned on develop entry).
    # AND gate out fork PRs from the persistent self-hosted Windows runners
    # (untrusted code on a long-lived host).
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'pull_request' ||
       github.head_ref != 'develop' ||
       github.base_ref != 'main')
    runs-on: ${{ fromJSON(vars.RUNNER_WINDOWS || '["windows-latest"]') }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    # BEFORE checkout so a dirty tree cannot fail actions/checkout. (The
    # root-owned-file recovery only applies to Linux self-hosted runners; on Windows
    # the plain rm suffices, so the guarded branch is a no-op here.)
    - name: Clean workspace (self-hosted)
      if: contains(vars.RUNNER_WINDOWS || '', 'self-hosted')
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ] && [ -n "$(find . ! -uid "$(id -u)" -print -quit 2>/dev/null)" ]; then
          docker run --rm -v "${{ github.workspace }}":/w -w /w alpine:3 chown -R "$(id -u):$(id -g)" /w
        fi
        rm -rf build install

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        submodules: recursive

    - uses: ./.github/actions/setup-cpp-toolchain
      if: ${{ !contains(vars.RUNNER_WINDOWS || '', 'self-hosted') }}
      with:
        compiler: msvc

    # Pure-PowerShell local composite (no Node) — replaces ilammy/msvc-dev-cmd,
    # which only ships a deprecated Node 20 runtime.
    - name: Setup MSVC environment (self-hosted)
      if: contains(vars.RUNNER_WINDOWS || '', 'self-hosted')
      uses: ./.github/actions/setup-msvc-env

    - name: Setup vcpkg cache (self-hosted)
      if: contains(vars.RUNNER_WINDOWS || '', 'self-hosted')
      shell: bash
      run: |
        BINARY_DIR="$HOME/.cache/vcpkg/archives"
        DOWNLOADS_DIR="$HOME/.cache/vcpkg/downloads"
        mkdir -p "$BINARY_DIR" "$DOWNLOADS_DIR"
        # Convert Git bash paths to native Windows paths for CMake/vcpkg
        if command -v cygpath >/dev/null 2>&1; then
          BINARY_DIR=$(cygpath -w "$BINARY_DIR")
          DOWNLOADS_DIR=$(cygpath -w "$DOWNLOADS_DIR")
        fi
        echo "VCPKG_DEFAULT_BINARY_CACHE=$BINARY_DIR" >> "$GITHUB_ENV"
        echo "VCPKG_DOWNLOADS=$DOWNLOADS_DIR" >> "$GITHUB_ENV"

    - uses: ./.github/actions/setup-vcpkg-cache
      if: ${{ !contains(vars.RUNNER_WINDOWS || '', 'self-hosted') }}
      with:
        cache-key-prefix: MSVCAnalysis

    - name: Bootstrap vcpkg
      shell: bash
      run: |
        if [ -f "${{ github.workspace }}/deps/vcpkg/bootstrap-vcpkg.sh" ]; then
          bash "${{ github.workspace }}/deps/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        elif [ -f "${{ github.workspace }}/deps/vcpkg/bootstrap-vcpkg.bat" ]; then
          "${{ github.workspace }}/deps/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
        fi
      env:
        VCPKG_BINARY_SOURCES: "clear;default,readwrite"

    - name: Configure
      uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
      with:
        configurePreset: config-windows-msvc
      env:
        VCPKG_ROOT: ${{ github.workspace }}/deps/vcpkg

    - name: Build
      uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
      with:
        buildPreset: build-windows-msvc
      env:
        VCPKG_ROOT: ${{ github.workspace }}/deps/vcpkg

    - uses: microsoft/msvc-code-analysis-action@24c285ab36952c9e9182f4b78dfafbac38a7e5ee # v0.1.1
      id: run-analysis
      with:
        cmakeBuildDirectory: ${{ github.workspace }}/build/config-windows-msvc
        buildConfiguration: Release
        ruleset: NativeRecommendedRules.ruleset
        ignoredPaths: ${{ github.workspace }}/deps;${{ github.workspace }}/src/version;${{ github.workspace }}/test

    - name: Upload SARIF to GitHub
      uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
      with:
        sarif_file: ${{ steps.run-analysis.outputs.sarif }}

    - name: Upload SARIF as an Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sarif-file
        path: ${{ steps.run-analysis.outputs.sarif }}
