# Reusable build/test(/package) workflow — the single definition of how the C++
# project is configured, built, tested and (optionally) packaged on each platform.
# Called by ci.yml (build-and-test) and release.yml (build-packages) so the two
# can never drift. Behaviour is identical to the two matrix jobs it replaces; the
# only parameters are whether to also package (release) and the checkout depth.
name: Reusable Build

on:
  workflow_call:
    inputs:
      do_package:
        description: "Also run cpack + the install/extract smoke test + upload packages (release path)."
        type: boolean
        default: false
      version_tag:
        description: "Resolved v* tag, threaded into configure as DERIVED_VERSION_OVERRIDE so the build stamps it deterministically. Empty in CI -> `git describe`."
        type: string
        default: ""
      fetch_depth:
        description: "checkout fetch-depth (0 for releases so `git describe`/cut-from-main see full history + tags; 1 for CI)."
        type: number
        default: 1
      upload_installtree:
        description: "On Linux, run `cmake --install` and upload installtree-linux-gcc (the relocatable FHS tree e2e-ui and the assembled Docker image consume instead of recompiling)."
        type: boolean
        default: false
    secrets:
      ORG_RUNNERS_TOKEN:
        description: "Forwarded to _check-runners.yml — see that workflow's own description."
        required: false
    outputs:
      linux_runner:
        description: >-
          The resolved x64 Linux runner label set the build matrix actually used (see
          check-runners below). Callers that consume this workflow's build artifacts on
          a fresh job (e.g. ci.yml's e2e-ui, which downloads and runs installtree-linux-gcc)
          MUST run on this same label set rather than making their own independent
          check-runners call — a self-hosted Linux leg's binary is built against that
          runner's glibc, which a GitHub-hosted ubuntu-latest job resolved separately and
          concurrently cannot assume it can run (glibc is backward- but not
          forward-compatible: GLIBC_x.yy not found when the artifact's build glibc is
          newer). Two independent live checks can disagree from one moment to the next
          even with identical inputs, since runner availability itself changes between
          them — this output is what keeps a single workflow run internally consistent.
        value: ${{ jobs.check-runners.outputs.linux_runner }}
      windows_runner:
        description: "The resolved Windows runner label set the build matrix actually used — the BIG pair, not the shared fleet (see the Windows MSVC matrix entry for why). See linux_runner's description — Windows has no equivalent cross-job artifact consumer today, but this is exposed for symmetry and any future one, and it has to keep tracking whatever the matrix actually resolved to or it silently becomes wrong."
        value: ${{ jobs.check-runners.outputs.windows_runner_big }}

permissions:
  contents: read

jobs:
  # Live self-hosted-availability check ahead of the build matrix — see
  # docs/ci-self-hosted-runners.md and _check-runners.yml's own header.
  check-runners:
    uses: ./.github/workflows/_check-runners.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit

  build:
    name: ${{ matrix.name }}
    needs: check-runners
    # Fork PRs must not run on the persistent self-hosted runners (untrusted code on
    # a long-lived host) - check-runners' own fork-PR branch already forces hosted
    # labels for them; this is belt-and-braces so a gap in that logic can't silently
    # hand a fork PR a self-hosted runner. This reusable workflow is also called
    # from release.yml on push/dispatch (never pull_request), so that path is
    # unaffected; same-repo PRs from ci.yml continue to run normally.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux GCC"
            runner: ${{ needs.check-runners.outputs.linux_runner }}
            compiler: gcc-15
            configure_preset: config-linux-gcc
            build_preset: build-linux-gcc
            test_preset: test-linux-gcc
            package_preset: pack-linux-gcc
            # Release packages build in this glibc-2.36 container (Debian Bookworm /
            # Raspberry Pi OS baseline) so they run on a stock Pi; CI builds on the host.
            docker_platform: linux/amd64
            # Install-tree artifact name (consumed by e2e-ui + the multi-arch Docker
            # image). The x64 name is unsuffixed for back-compat with the e2e-ui job.
            installtree_name: installtree-linux-gcc
          # Native arm64 build so the .deb/.rpm/.tgz install on a Raspberry Pi and
          # other aarch64 hosts. ubuntu-24.04-arm is a GitHub-hosted arm64 runner
          # (free for public repos); override RUNNER_LINUX_ARM to use a self-hosted
          # arm runner. The triplet/toolchain target aarch64, so no cross-compile.
          - name: "Linux GCC (arm64)"
            runner: ${{ vars.RUNNER_LINUX_ARM || '["ubuntu-24.04-arm"]' }}
            compiler: gcc-15
            configure_preset: config-linux-gcc-arm64
            build_preset: build-linux-gcc-arm64
            test_preset: test-linux-gcc-arm64
            package_preset: pack-linux-gcc-arm64
            docker_platform: linux/arm64
            installtree_name: installtree-linux-gcc-arm64
          # Routed to the BIG Windows runner, not the shared fleet. Measured on
          # tf-gh-windows-runner-01 mid-job (2026-08-31): this leg's build tree is
          # 10.1 GB on a 16 GB D: that also carries a ~2 GB cache, leaving 3.6 GB
          # free at peak — and on 2026-08-30 tf-gh-windows-runner-05 tipped over it
          # with `fatal error C1085 ... No space left on device`. Nearly all of it is
          # LTCG: INTERPROCEDURAL_OPTIMIZATION_RELEASE (CMakeLists.txt) puts /GL on
          # libaqualink-{automate,jandy,pentair}, so their objects carry intermediate
          # language and each .lib archives a second copy of it — 4.5 GB of .obj plus
          # 4.7 GB of .lib across just those three targets, against 0.35 GB of PDBs
          # and 0.65 GB of vcpkg_installed. The big pair's 48 GB D: absorbs that.
          #
          # The cost is deliberate: windows_runner_big probes for "online", not
          # "idle" (see _check-runners.yml), so this leg QUEUES behind whatever the
          # single big Windows runner is already doing instead of falling back to
          # windows-latest. Concurrent PRs serialise here. That is the accepted price
          # of NOT disabling IPO in CI — this way CI keeps validating the exact LTCG
          # build that ships. If the queue ever hurts more than the coverage helps,
          # the cheaper lever is ENABLE_IPO=OFF (CMakeLists.txt:38) on this preset,
          # which reclaims ~9 GB and puts the leg back on the shared fleet.
          - name: "Windows MSVC"
            runner: ${{ needs.check-runners.outputs.windows_runner_big }}
            compiler: msvc
            configure_preset: config-windows-msvc
            build_preset: build-windows-msvc
            test_preset: test-windows-msvc
            package_preset: pack-windows-msvc
          - name: "macOS Clang"
            runner: '["macos-latest"]'
            compiler: llvm
            configure_preset: config-macos-llvm
            build_preset: build-macos-llvm
            test_preset: test-macos-llvm
            package_preset: pack-macos-llvm

    steps:
      # BEFORE checkout: a prior RELEASE built inside a root gcc container (the
      # glibc-2.36 packaging step below) can leave root-owned files in this shared
      # self-hosted workspace that actions/checkout's git-clean cannot delete
      # ("permission denied, rmdir build/..."), failing the job before it starts.
      # Reset ownership to the runner user via a throwaway ROOT container -- NOT host
      # sudo -- then drop the stale build trees. The chown-on-exit trap in that
      # packaging step is what stops new root-owned files appearing; this is the
      # belt-and-braces recovery for any that predate it.
      - name: Clean workspace (self-hosted)
        if: contains(matrix.runner, 'self-hosted')
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ] && [ -n "$(find . ! -uid "$(id -u)" -print -quit 2>/dev/null)" ]; then
            docker run --rm -v "${{ github.workspace }}":/w -w /w alpine:3 chown -R "$(id -u):$(id -g)" /w
          fi
          rm -rf build install
          # Reclaim what VCPKG_INSTALL_OPTIONS can only prevent going forward.
          # deps/vcpkg persists between jobs on a self-hosted runner (that is why
          # this step exists at all), so buildtrees/ and packages/ accumulate from
          # EVERY previous run until a build dies with 'No space left on device'.
          # Both are pure intermediates -- the binary cache lives in
          # $HOME/.cache/vcpkg/archives and is untouched, so ports still restore
          # from cache rather than rebuilding. downloads/ is deliberately NOT
          # pruned: on self-hosted it is redirected to the size-capped persistent
          # cache, and clearing it would force re-downloads for no disk win.
          rm -rf deps/vcpkg/buildtrees deps/vcpkg/packages

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: ${{ inputs.fetch_depth }}

      - uses: ./.github/actions/setup-cpp-toolchain
        if: ${{ !contains(matrix.runner, 'self-hosted') }}
        with:
          compiler: ${{ matrix.compiler }}

      # Self-hosted Windows images bake in the VS Build Tools but do not expose the
      # MSVC environment (cl.exe, INCLUDE/LIB) on the default PATH; load it so the
      # Configure step can find the compiler. Pure-PowerShell local composite (no
      # Node) — replaces ilammy/msvc-dev-cmd, which only ships a deprecated Node 20
      # runtime. (vcvars also leaks VCPKG_ROOT -> the VS-bundled vcpkg, same as the
      # old action; the Configure/Build/Test steps override it per-step.)
      - name: Setup MSVC environment (self-hosted)
        if: contains(matrix.runner, 'self-hosted') && runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env

      - name: Install NSIS (Windows packaging)
        if: inputs.do_package && runner.os == 'Windows' && !contains(matrix.runner, 'self-hosted')
        run: choco install nsis -y

      - name: Setup vcpkg cache (self-hosted)
        if: contains(matrix.runner, 'self-hosted')
        shell: bash
        run: |
          BINARY_DIR="$HOME/.cache/vcpkg/archives"
          DOWNLOADS_DIR="$HOME/.cache/vcpkg/downloads"
          ASSETS_DIR="$HOME/.cache/vcpkg/assets"
          mkdir -p "$BINARY_DIR" "$DOWNLOADS_DIR" "$ASSETS_DIR"
          # The asset cache needs a file:// URL (forward slashes); cygpath -m gives
          # a Windows path WITH forward slashes (C:/...), so file:/// + that is a
          # valid URL on both OSes. Build it before -w mangles ASSETS_DIR below.
          if command -v cygpath >/dev/null 2>&1; then
            ASSET_URL="file:///$(cygpath -m "$ASSETS_DIR")"
          else
            ASSET_URL="file://$ASSETS_DIR"
          fi
          # Convert Git bash paths to native Windows paths for CMake/vcpkg
          # (vcpkg rejects an MSYS-style VCPKG_DEFAULT_BINARY_CACHE like /c/...).
          if command -v cygpath >/dev/null 2>&1; then
            BINARY_DIR=$(cygpath -w "$BINARY_DIR")
            DOWNLOADS_DIR=$(cygpath -w "$DOWNLOADS_DIR")
          fi
          echo "VCPKG_DEFAULT_BINARY_CACHE=$BINARY_DIR" >> "$GITHUB_ENV"
          echo "VCPKG_DOWNLOADS=$DOWNLOADS_DIR" >> "$GITHUB_ENV"
          # Persistent vcpkg asset cache (source tarballs + tool fetches, keyed by
          # SHA512). On a binary-cache miss vcpkg rebuilds from source; serving the
          # sources from here avoids re-fetching from GitHub, which intermittently
          # throttles this busy box with HTTP 400 (boostorg archives) that vcpkg
          # treats as non-retryable. Mirrors the Docker build's asset cache.
          echo "X_VCPKG_ASSET_SOURCES=clear;x-azurl,$ASSET_URL,,readwrite" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-vcpkg-cache
        if: ${{ !contains(matrix.runner, 'self-hosted') }}
        with:
          cache-key-prefix: ${{ matrix.name }}

      # Host build path (CI on every platform + the Windows/macOS release builds).
      # The Linux RELEASE build runs in a glibc-2.36 container instead (see the
      # "Build, test & package (glibc-2.36 container)" step below), so these host
      # steps skip for it.
      - name: Bootstrap vcpkg
        if: ${{ !(inputs.do_package && runner.os == 'Linux') }}
        shell: bash
        run: |
          if [ -f "${{ github.workspace }}/deps/vcpkg/bootstrap-vcpkg.sh" ]; then
            bash "${{ github.workspace }}/deps/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          elif [ -f "${{ github.workspace }}/deps/vcpkg/bootstrap-vcpkg.bat" ]; then
            "${{ github.workspace }}/deps/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          fi
        env:
          VCPKG_BINARY_SOURCES: "clear;default,readwrite"

      # At the 2026.06.01 vcpkg baseline the libbacktrace port (a boost-stacktrace
      # dependency) regenerates its configure via autoreconf, so the build host now
      # needs autoconf / autoconf-archive / automake / libtool. The self-hosted Linux
      # image bakes these in (cicd/packer/scripts/linux/06-dev-tools.sh), but install
      # them here too so the build also works on a not-yet-rebuilt image and on the
      # GitHub-hosted macOS runner. Windows builds libbacktrace without this path.
      # On Linux, skip apt entirely when the packages are already present (the baked
      # image case) and otherwise wait for the dpkg lock instead of failing — the
      # self-hosted runners run unattended-upgrades, which briefly holds
      # /var/lib/dpkg/lock-frontend and made a bare apt-get die with exit 100.
      - name: Install autotools for libbacktrace (Linux/macOS)
        if: ${{ runner.os != 'Windows' && !(inputs.do_package && runner.os == 'Linux') }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            if dpkg -s autoconf autoconf-archive automake libtool >/dev/null 2>&1; then
              echo "autotools already installed; skipping apt-get"
            else
              sudo apt-get -o DPkg::Lock::Timeout=600 update -qq
              sudo apt-get -o DPkg::Lock::Timeout=600 install -y -qq autoconf autoconf-archive automake libtool
            fi
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install autoconf autoconf-archive automake libtool
          fi

      # VCPKG_ROOT points lukka/run-cmake (and the in-tree vcpkg toolchain) at the
      # project's deps/vcpkg. On self-hosted Windows, vcvarsall (msvc-dev-cmd) leaks
      # VCPKG_ROOT -> the VS-bundled, manifest-less vcpkg; this step-level env value
      # overrides that leak, so no special "pin" step is needed (same as Linux/macOS).
      # Stamp the resolved version deterministically: release callers pass the tag
      # via version_tag, which GitVersionDerivation honours OVER `git describe`
      # (eliminating the configure-time tag-race and the need to pre-create a local
      # tag). CI passes no tag, so use an explicit 0.0.0-dev rather than an empty
      # override: that stops the configure falling through to `git describe`, which
      # on the shallow CI checkout (no tags in history) can't resolve a v* tag and
      # emits a noisy "could not parse a v<...> tag" warning. 0.0.0-dev is exactly
      # the value that fallback would produce — just without the warning.
      - name: Configure
        if: ${{ !(inputs.do_package && runner.os == 'Linux') }}
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: ${{ matrix.configure_preset }}
          # NOTE: a previous -DVCPKG_INSTALL_OPTIONS=--clean-buildtrees-after-build;--clean-packages-after-build
          # was removed here. The embedded ';' is split by the shell run-cmake uses to
          # invoke cmake, so the macOS/Windows Configure failed at exit 127
          # (/bin/sh: --clean-packages-after-build: command not found). This step only
          # runs on macOS/Windows + the non-package Linux CI build anyway — the Linux
          # RELEASE build uses the glibc container path below, not this step. If the
          # self-hosted-Linux disk-saving is wanted, re-add it via a shell-safe channel
          # (e.g. a preset cacheVariable), with a test.
          configurePresetAdditionalArgs: "['-DDERIVED_VERSION_OVERRIDE=${{ inputs.version_tag || '0.0.0-dev' }}']"
        env:
          VCPKG_ROOT: ${{ github.workspace }}/deps/vcpkg

      - name: Build
        if: ${{ !(inputs.do_package && runner.os == 'Linux') }}
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          buildPreset: ${{ matrix.build_preset }}
        env:
          VCPKG_ROOT: ${{ github.workspace }}/deps/vcpkg
          # Ninja defaults to nproc+2 and no preset sets `jobs`, so an 8-vCPU
          # shared guest builds at -j10. At ~1.09 GiB per cc1plus (measured from an
          # oom-killer dump: 10 concurrent cc1plus, 10.9 GiB anon RSS) that is
          # 10.9 GiB against 11.7 GiB usable on the 12 GB Linux guests — ~7%
          # headroom, which the heaviest Boost/C++23 TUs consume. Note the fleet's
          # RAM:vCPU ratio is unchanged across the 2026-08-27 right-size (1.5 GB per
          # vCPU either way); what broke is that Ninja's `+2` is ADDITIVE, so it
          # overshoots 25% at 8 cores against 6% at 32. Cap CI only — no preset
          # change, so developer machines keep the default.
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ runner.os == 'Linux' && '6' || '' }}

      - name: Show build errors on failure
        if: ${{ failure() && !(inputs.do_package && runner.os == 'Linux') }}
        shell: bash
        run: |
          echo "::group::CMake build retry (verbose)"
          cmake --build --preset ${{ matrix.build_preset }} -- -k 1 2>&1 | tail -200 || true
          echo "::endgroup::"
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ runner.os == 'Linux' && '6' || '' }}

      - name: Test
        if: ${{ !(inputs.do_package && runner.os == 'Linux') }}
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          testPreset: ${{ matrix.test_preset }}
        env:
          VCPKG_ROOT: ${{ github.workspace }}/deps/vcpkg

      # Persist the glibc-2.36 container's vcpkg binary cache. On self-hosted runners
      # $HOME/.cache survives across runs already; this restores it for the
      # GitHub-hosted arm64 runner. Keyed separately from the host (Ubuntu-26.04)
      # cache so the two glibc baselines never share archives.
      - name: Cache vcpkg (glibc-2.36 container)
        if: ${{ inputs.do_package && runner.os == 'Linux' && !contains(matrix.runner, 'self-hosted') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vcpkg-bookworm
          key: vcpkg-bookworm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg/triplets/**') }}
          restore-keys: |
            vcpkg-bookworm-${{ runner.os }}-${{ runner.arch }}-

      # ---------------------------------------------------------------------------
      # Linux RELEASE build — inside a glibc-2.36 container (Debian Bookworm /
      # Raspberry Pi OS baseline) so the .deb/.rpm/.tgz run on a stock Pi and every
      # newer distro. Native per-arch (linux/amd64 on the x64 runner, linux/arm64 on
      # the arm runner — no QEMU). The job stays on the host, so the deb smoke test
      # below still has Docker. The bundled gcc-15 libstdc++/libgcc (see
      # cmake/CPackConfig.cmake) make the older-glibc base safe for the C++23 code.
      # ---------------------------------------------------------------------------
      - name: Build, test & package (glibc-2.36 container)
        if: ${{ inputs.do_package && runner.os == 'Linux' }}
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.version_tag || '0.0.0-dev' }}
          CONFIGURE_PRESET: ${{ matrix.configure_preset }}
          BUILD_PRESET: ${{ matrix.build_preset }}
          TEST_PRESET: ${{ matrix.test_preset }}
          PACKAGE_PRESET: ${{ matrix.package_preset }}
          # Both Linux legs produce a per-arch install tree the multi-arch Docker
          # image consumes (and e2e-ui consumes the x64 one).
          PACK_INSTALLTREE: ${{ inputs.upload_installtree }}
          INSTALLTREE_NAME: ${{ matrix.installtree_name }}
        run: |
          mkdir -p "$HOME/.cache/vcpkg-bookworm"
          docker run --rm --platform ${{ matrix.docker_platform }} \
            -v "${{ github.workspace }}":/work -w /work \
            -v "$HOME/.cache/vcpkg-bookworm":/vcpkgcache \
            -e VERSION_OVERRIDE -e CONFIGURE_PRESET -e BUILD_PRESET -e TEST_PRESET \
            -e PACKAGE_PRESET -e PACK_INSTALLTREE -e INSTALLTREE_NAME \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            gcc:15-bookworm bash -eu -c '
              # This container runs as root (needed for apt-get and writing /opt), so
              # every file it creates under the bind-mounted /work is root-owned on the
              # host. On a persistent self-hosted runner that poisons the shared
              # workspace -- the next jobs (CodeQL, CI) cannot delete build/ and their
              # checkout fails. Chown the tree back to the invoking host user on exit,
              # via a trap so it runs even if configure/build/test/package fails.
              trap "chown -R $HOST_UID:$HOST_GID /work 2>/dev/null || true" EXIT
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                ninja-build git ca-certificates curl zip unzip tar make \
                autoconf autoconf-archive automake libtool libltdl-dev pkg-config python3 \
                binutils file rpm fakeroot >/dev/null
              # TEMPORARY DIAGNOSTIC (remove once the real gap is identified): run
              # vcpkg-make's own prerequisite probe directly and print its raw
              # output, since three guesses at the missing apt package in a row
              # have all failed identically despite the packages genuinely
              # installing with no apt errors.
              echo "::group::libbacktrace prerequisite diagnostic"
              dpkg -l | grep -E "autoconf|automake|libtool" || true
              echo "--- which ---"
              which aclocal autoconf autoreconf libtoolize automake m4 || true
              echo "--- aclocal search path ---"
              aclocal --print-ac-dir || true
              echo "\$ACLOCAL_PATH=$ACLOCAL_PATH"
              echo "--- ls autoconf-archive macro dir ---"
              ls "$(aclocal --print-ac-dir)"/ax_check_compile_flag.m4 2>&1 || true
              ls "$(aclocal --print-ac-dir)"/libtool.m4 2>&1 || true
              ls "$(aclocal --print-ac-dir)"/ltdl.m4 2>&1 || true
              echo "--- reproducing vcpkg-make's own probe ---"
              probe_dir=/tmp/probe && rm -rf "$probe_dir" && mkdir -p "$probe_dir"
              cat > "$probe_dir/configure.ac" <<PROBE
AC_INIT([check-autoconf], [1.0])
AM_INIT_AUTOMAKE
# vcpkg begin
m4_ifndef([AX_CHECK_COMPILE_FLAG], [m4_errprintn([System package autoconf-archive is missing.])])
m4_ifndef([LT_INIT],               [m4_errprintn([System package libtool is missing.])])
m4_ifndef([LTDL_INIT],             [m4_errprintn([System package libltdl-dev is missing.])])
# vcpkg end
AC_OUTPUT
PROBE
              (cd "$probe_dir" && aclocal --dry-run); echo "aclocal exit=$?"
              echo "::endgroup::"
              ARCH=$(uname -m)
              curl -fsSL "https://github.com/Kitware/CMake/releases/download/v3.31.12/cmake-3.31.12-linux-${ARCH}.tar.gz" | tar xz -C /opt
              export PATH="/opt/cmake-3.31.12-linux-${ARCH}/bin:$PATH"
              # Restore exec bits on the maintainer scripts (lost on a Windows checkout).
              chmod +x packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm packaging/rpm/*.sh packaging/tarball/*.sh
              git config --global --add safe.directory /work
              git config --global --add safe.directory /work/deps/vcpkg
              export VCPKG_DEFAULT_BINARY_CACHE=/vcpkgcache
              # Same Ninja nproc+2 cap as the host Linux legs above — the container
              # sees the guest's 8 vCPU, so it would otherwise build at -j10 on a
              # 12 GB box.
              export CMAKE_BUILD_PARALLEL_LEVEL=6
              ./deps/vcpkg/bootstrap-vcpkg.sh -disableMetrics >/dev/null
              cmake --preset "$CONFIGURE_PRESET" -DDERIVED_VERSION_OVERRIDE="$VERSION_OVERRIDE"
              cmake --build --preset "$BUILD_PRESET"
              ctest --preset "$TEST_PRESET"
              if [ "$PACK_INSTALLTREE" = "true" ]; then
                # Stage through DESTDIR (not --prefix): the default config is
                # installed to an ABSOLUTE /etc/aqualink-automate (see
                # cmake/CPackConfig.cmake), which --prefix does NOT relocate -- it
                # would leak into the container /etc instead of the tree. DESTDIR
                # prepends the staging root to absolute paths too; --prefix / keeps
                # the tree flat (bin/lib/share at the root) for the Docker image
                # and e2e-ui consumers. (No apostrophes in this block: it is inside
                # a single-quoted docker `bash -c` script.)
                DESTDIR="$PWD/install/$CONFIGURE_PRESET" cmake --install "build/$CONFIGURE_PRESET" --prefix /
                tar czf "${INSTALLTREE_NAME}.tar.gz" -C "install/$CONFIGURE_PRESET" .
              fi
              cpack --preset "$PACKAGE_PRESET"
            '

      # ---------------------------------------------------------------------------
      # Linux install tree (consumed by e2e-ui and the assembled Docker image so
      # they do not recompile). This is the same `cmake --install` tree the
      # Dockerfile assembles the runtime image from: the binary + bundled vcpkg libs
      # ($ORIGIN RPATH) + web/ssl assets. Linux only (the consumers are Linux), and
      # built on the host runner, whose glibc/libstdc++ baseline is <= the
      # ubuntu:26.04 Docker runtime base, so the tree runs there.
      # ---------------------------------------------------------------------------
      # x64 only: the install tree feeds the (x64) Docker image + e2e-ui, and the
      # artifact name is fixed, so the arm64 Linux entry must NOT also upload it.
      # CI builds the tree here on the host; the RELEASE tree is produced inside the
      # glibc-2.36 container step above (so the Docker image runs on a stock Pi too).
      - name: Install + pack the Linux install tree
        if: inputs.upload_installtree && matrix.configure_preset == 'config-linux-gcc' && !inputs.do_package
        shell: bash
        run: |
          # Stage through DESTDIR (not --prefix): the default config installs to an
          # ABSOLUTE /etc/aqualink-automate (see cmake/CPackConfig.cmake), which
          # --prefix does NOT relocate -- on the non-root CI runner that aborts with
          # "cannot create directory /etc/aqualink-automate". DESTDIR prepends the
          # staging root to absolute paths too; --prefix / keeps the tree flat
          # (bin/lib/share at the root) for the Docker image and e2e-ui consumers.
          DESTDIR="${{ github.workspace }}/install/config-linux-gcc" \
            cmake --install build/config-linux-gcc --prefix /
          # Pack as a tarball so the versioned .so SYMLINKS and exec bits survive the
          # CI artifact round-trip losslessly (a raw upload-artifact mangles symlinks,
          # and the runtime binary loads libs by their versioned SONAME).
          tar czf "${{ github.workspace }}/installtree-linux-gcc.tar.gz" \
            -C "${{ github.workspace }}/install/config-linux-gcc" .

      # CI uploads only the x64 tree (for e2e-ui); a release uploads both Linux legs'
      # trees (x64 + arm64) for the multi-arch Docker image. Per-arch artifact name.
      - name: Upload Linux install tree
        if: inputs.upload_installtree && runner.os == 'Linux' && (inputs.do_package || matrix.configure_preset == 'config-linux-gcc')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.installtree_name }}
          if-no-files-found: error
          path: ${{ matrix.installtree_name }}.tar.gz
          retention-days: 3

      # ---------------------------------------------------------------------------
      # Packaging (release path only — inputs.do_package)
      # ---------------------------------------------------------------------------
      # Windows/macOS package on the host; Linux packages are built by the
      # glibc-2.36 container step above (cpack runs inside it).
      - name: Package
        if: inputs.do_package && runner.os != 'Linux'
        run: cpack --preset=${{ matrix.package_preset }}

      # Install the freshly built .deb on a CLEAN debian:bookworm (the Raspberry Pi
      # OS baseline: glibc 2.36, gcc-12 system libstdc++) and run it. This is the
      # guard that the packages still run on a stock Pi — it catches both a missing
      # runtime dependency AND a regression to a too-new glibc/libstdc++ baseline
      # (which an ubuntu:26.04 test would silently pass). Runs natively per arch.
      - name: Smoke test — install package & run (Linux)
        if: inputs.do_package && runner.os == 'Linux'
        run: |
          docker run --rm --platform ${{ matrix.docker_platform }} \
            -v "$PWD/packages:/pkg:ro" debian:bookworm bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq /pkg/*.deb
            aqualink-automate --version
            test -f /etc/aqualink-automate/aqualink-automate.conf
            getent passwd aqualink >/dev/null'

      - name: Smoke test — extract ZIP & run (Windows)
        if: inputs.do_package && runner.os == 'Windows'
        # Windows PowerShell (always present on self-hosted + GitHub-hosted), NOT
        # pwsh/PowerShell 7 which the self-hosted runner image does not ship.
        shell: powershell
        run: |
          $zip = Get-ChildItem packages/*.zip | Select-Object -First 1
          if (-not $zip) { throw "No ZIP package was produced" }
          Expand-Archive -Path $zip.FullName -DestinationPath smoke -Force
          $exe = Get-ChildItem -Path smoke -Recurse -Filter aqualink-automate.exe | Select-Object -First 1
          if (-not $exe) { throw "aqualink-automate.exe not found in the package" }
          & $exe.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Binary exited with code $LASTEXITCODE" }

      - name: Smoke test — extract TGZ & run (macOS)
        if: inputs.do_package && runner.os == 'macOS'
        run: |
          set -e
          mkdir -p smoke
          tar xzf packages/*.tar.gz -C smoke
          BIN="$(find smoke -name aqualink-automate -type f -perm +111 | head -1)"
          if [ -z "$BIN" ]; then echo "::error::binary not found in package"; exit 1; fi
          "$BIN" --version

      - name: Upload packages
        if: inputs.do_package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.configure_preset }}
          if-no-files-found: error
          path: |
            packages/*.deb
            packages/*.rpm
            packages/*.tar.gz
            packages/*.zip
            packages/*.exe
            packages/*.dmg
            packages/*.sha512
          retention-days: 30
