# fuzzing.yml — bounded coverage-guided fuzzing of the RS-485 protocol decoders.
#
# The app parses UNTRUSTED wire data in the Jandy and Pentair message
# deserialisers; this workflow builds the libFuzzer harnesses (fuzz/) and runs each
# for a bounded time against a corpus seeded from the recorded capture fixtures.
# It exists to give the OpenSSF Scorecard "Fuzzing" check a real signal (not just a
# posture tick) and to catch malformed-frame crashes before they reach the field.
#
# It is NOT a required PR gate: a bounded fuzz run is best-effort, so a clean run is
# reassurance, not proof. A crash, however, fails the job and uploads the reproducer
# — that IS a real bug (fix the decoder + add a regression test; never weaken the
# parser). Docs: docs/fuzzing.md.
name: Fuzzing

on:
  # Weekly deep-ish run (staggered from the supply-chain crons at :17/:27/:37).
  schedule:
    - cron: "47 22 * * 1"
  # Smoke the harnesses on PRs that touch the decoders or the fuzzing scaffolding.
  pull_request:
    paths:
      - "src/jandy/**"
      - "src/pentair/**"
      - "src/core/protocol/**"
      - "src/core/scheduling/**"
      - "src/core/http/**"
      - "src/core/mqtt/**"
      - "src/core/options/**"
      - "src/core/auth/**"
      - "src/core/developer/**"
      - "src/core/utility/**"
      - "fuzz/**"
      - "cmake/Fuzzing.cmake"
      - ".github/workflows/fuzzing.yml"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to fuzz EACH harness."
        type: string
        default: "300"

permissions:
  contents: read

concurrency:
  group: fuzzing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Live self-hosted-availability check ahead of the fuzz matrix — see
  # docs/ci-self-hosted-runners.md.
  check-runners:
    name: Check self-hosted runner availability
    uses: ./.github/workflows/_check-runners.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit

  fuzz:
    name: Fuzz ${{ matrix.harness }}
    needs: check-runners
    # Fork PRs must not run on the persistent self-hosted runners (untrusted code on
    # a long-lived host) - check-runners' own fork-PR branch already forces hosted
    # labels for them; this is belt-and-braces so a gap in that logic can't silently
    # hand a fork PR a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(needs.check-runners.outputs.linux_runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: fuzz-jandy-message
            corpus: jandy
          - harness: fuzz-pentair-message
            corpus: pentair
          - harness: fuzz-schedule-json
            corpus: schedule-json
          - harness: fuzz-websocket-json
            corpus: websocket-json
          - harness: fuzz-mqtt-payload
            corpus: mqtt-payload
          - harness: fuzz-config-parse
            corpus: config-parse
          - harness: fuzz-query-string
            corpus: query-string
          - harness: fuzz-jwt
            corpus: jwt
          - harness: fuzz-duration
            corpus: duration
          - harness: fuzz-replay-line
            corpus: replay-line
    steps:
      - name: Clean workspace (self-hosted)
        if: contains(needs.check-runners.outputs.linux_runner, 'self-hosted')
        shell: bash
        run: |
          if [ -n "$(find . ! -uid "$(id -u)" -print -quit 2>/dev/null)" ]; then
            docker run --rm -v "${{ github.workspace }}":/w -w /w alpine:3 chown -R "$(id -u):$(id -g)" /w
          fi
          rm -rf build install

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: ./.github/actions/setup-cpp-toolchain
        if: ${{ !contains(needs.check-runners.outputs.linux_runner, 'self-hosted') }}
        with:
          compiler: llvm

      # libFuzzer + the ASan build (SANITIZE_ADDRESS) link against the compiler-rt static
      # runtimes (libclang_rt.fuzzer.a / libclang_rt.asan*.a). Neither aminya/setup-cpp's
      # apt.llvm.org clang (hosted) NOR the self-hosted runner image ships them, so install
      # the matching libclang-rt-<major>-dev for the selected clang. Runs on EVERY Linux
      # runner, installing only when the package is missing; if it isn't already
      # indexed, add the apt.llvm.org source for that version + codename.
      - name: Install LLVM compiler-rt runtimes (fuzzer + sanitizers)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # -o DPkg::Lock::Timeout waits out transient dpkg-lock holders on the
          # persistent self-hosted runners (unattended-upgrades) instead of exit 100.
          apt_get() { sudo apt-get -o DPkg::Lock::Timeout=600 "$@"; }
          ver="$(clang --version | sed -n 's/.*clang version \([0-9][0-9]*\).*/\1/p' | head -1)"
          if dpkg -s "libclang-rt-${ver}-dev" >/dev/null 2>&1; then
            echo "libclang-rt-${ver}-dev already installed; skipping apt-get"
          else
            echo "Installing compiler-rt runtimes for clang major version ${ver}"
            apt_get update -qq
            if ! apt_get install -y -qq "libclang-rt-${ver}-dev"; then
              echo "libclang-rt-${ver}-dev not indexed; adding apt.llvm.org source"
              . /etc/os-release
              wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
              echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-${ver} main" | sudo tee "/etc/apt/sources.list.d/llvm-${ver}.list" >/dev/null
              apt_get update -qq
              apt_get install -y -qq "libclang-rt-${ver}-dev"
            fi
          fi
          echo "compiler-rt libs:"; ls "/usr/lib/llvm-${ver}/lib/clang/${ver}/lib/"*/ 2>/dev/null | grep -i "fuzzer\|asan" || true

      - uses: ./.github/actions/setup-vcpkg-cache
        if: ${{ !contains(needs.check-runners.outputs.linux_runner, 'self-hosted') }}
        with:
          cache-key-prefix: fuzzing

      - name: Bootstrap vcpkg
        shell: bash
        run: bash "${{ github.workspace }}/deps/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        env:
          VCPKG_BINARY_SOURCES: "clear;default,readwrite"

      # Skip apt when the packages are already baked into the runner image; otherwise
      # wait for the dpkg lock (unattended-upgrades briefly holds it on the
      # self-hosted runners) instead of failing with exit 100. Mirrors _build.yml.
      - name: Install autotools for libbacktrace
        shell: bash
        run: |
          if dpkg -s autoconf autoconf-archive automake libtool >/dev/null 2>&1; then
            echo "autotools already installed; skipping apt-get"
          else
            sudo apt-get -o DPkg::Lock::Timeout=600 update -qq
            sudo apt-get -o DPkg::Lock::Timeout=600 install -y -qq autoconf autoconf-archive automake libtool
          fi

      - name: Configure
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: config-linux-llvm-fuzzing
          configurePresetAdditionalArgs: "['-DDERIVED_VERSION_OVERRIDE=0.0.0-dev']"
        env:
          VCPKG_ROOT: ${{ github.workspace }}/deps/vcpkg

      - name: Build fuzz harness
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          buildPreset: build-linux-llvm-fuzzing
        env:
          VCPKG_ROOT: ${{ github.workspace }}/deps/vcpkg

      - name: Seed corpus from capture fixtures
        shell: bash
        run: python3 fuzz/seed_corpus.py

      - name: Fuzz (bounded)
        shell: bash
        env:
          MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time || '180' }}
        run: |
          set -o pipefail
          exe="build/config-linux-llvm-fuzzing/fuzz/${{ matrix.harness }}"
          corpus="fuzz/corpus/${{ matrix.corpus }}"
          mkdir -p "$corpus" artifacts
          # -max_total_time bounds wall time; -rss_limit_mb guards a runaway alloc;
          # -artifact_prefix drops any reproducer where we can upload it. libFuzzer
          # exits non-zero on a crash/leak/timeout, failing the job.
          "$exe" "$corpus" \
            -max_total_time="$MAX_TOTAL_TIME" \
            -rss_limit_mb=4096 \
            -timeout=25 \
            -print_final_stats=1 \
            -artifact_prefix=artifacts/

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.harness }}
          if-no-files-found: ignore
          path: artifacts/
          retention-days: 30
