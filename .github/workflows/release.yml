name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0, v1.0.0-beta.1)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run — build packages but don't create release"
        required: false
        type: boolean
        default: false

# Serialise releases of the same version; never cancel an in-flight release.
concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

# Least-privilege default: jobs inherit read-only access to the repo contents and
# must opt in to anything more. Each job below grants only the extra scope it needs
# (docker-publish: packages:write for GHCR + id-token/attestations:write to sign the
# image provenance + SBOM attestations; github-release: contents:write to push tags +
# create releases, plus id-token/attestations:write for the package attestations;
# cleanup: contents:write). The reusable publish-repos.yml declares its own.
permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_tag: ${{ steps.resolve.outputs.version_tag }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
      is_dry_run: ${{ steps.resolve.outputs.is_dry_run }}

    steps:
      # Needed for the "cut from main" guard below (merge-base ancestry check).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version from trigger
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
            IS_DRY_RUN="false"
          else
            TAG="${{ inputs.version }}"
            IS_DRY_RUN="${{ inputs.dry_run }}"
          fi

          # Validate tag format: v<M>.<M>.<P>[-(alpha|beta|rc).<N>]
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Invalid version format: $TAG (expected v<M>.<M>.<P>[-(alpha|beta|rc).<N>])"
            exit 1
          fi

          # Strip leading 'v' for version string
          VERSION="${TAG#v}"

          # Detect prerelease from tag name or manual input
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "$TAG" =~ -(alpha|beta|rc)\. ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          else
            IS_PRERELEASE="${{ inputs.prerelease }}"
            # Auto-detect if the tag itself has a prerelease suffix
            if [[ "$TAG" =~ -(alpha|beta|rc)\. ]]; then
              IS_PRERELEASE="true"
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "is_dry_run=$IS_DRY_RUN" >> "$GITHUB_OUTPUT"

          echo "### Version Resolution" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | $VERSION |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | $TAG |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pre-release | $IS_PRERELEASE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run | $IS_DRY_RUN |" >> "$GITHUB_STEP_SUMMARY"

      # On a manual dispatch the tag does not exist yet (github-release pushes it
      # at the end). Fail fast if it is already present so we don't build every
      # package and only discover the collision at the final push. (A tag-push
      # trigger is exempt: the tag obviously exists — it triggered the run.)
      - name: Guard against an existing tag (dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve.outputs.version_tag }}"
          if gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Push it to trigger a release, or choose a new version."
            exit 1
          fi
          echo "Tag ${TAG} is available."

      # Real releases must be cut from main: develop is the integration branch,
      # only main holds released code. The release commit must be contained in
      # origin/main (works for both a v* tag push and a workflow_dispatch).
      # Dry-runs are EXEMPT so the pipeline can be validated from any branch
      # (e.g. develop) without merging to main first.
      - name: Enforce releases are cut from main
        if: steps.resolve.outputs.is_dry_run != 'true'
        shell: bash
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is contained in main — OK."
          else
            echo "::error::Release commit $GITHUB_SHA is not on main. Cut releases from main (merge develop -> main, then tag main)."
            exit 1
          fi

      # Version lock-step: the Home Assistant add-on wraps the image this very release
      # publishes, so the RELEASED channel's config.yaml `version` MUST equal the release
      # version (the Dockerfile derives its base image from it; there is no build.yaml). A prerelease releases the `edge` channel; a
      # stable release the `stable` channel. Fail fast here (before any build) if that
      # channel was not bumped in release prep, so a released add-on can never point at an
      # image that does not exist. Bump with:
      #   ./scripts/sync-homeassistant-addon-version.ps1 -Channel <edge|stable> -Version <ver>
      - name: Home Assistant add-on version lock-step
        if: steps.resolve.outputs.is_dry_run != 'true'
        shell: pwsh
        run: >-
          ./scripts/sync-homeassistant-addon-version.ps1 -Check
          -Channel ${{ steps.resolve.outputs.is_prerelease == 'true' && 'edge' || 'stable' }}
          -Version ${{ steps.resolve.outputs.version }} -Root $PWD

  # Live self-hosted-availability check, shared by the Linux jobs below that can
  # build on the org-level fleet — see docs/ci-self-hosted-runners.md.
  check-runners:
    name: Check self-hosted runner availability
    uses: ./.github/workflows/_check-runners.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit

  # Build + test + package on every platform via the same reusable workflow CI
  # uses, so the suites can never diverge between CI and release. do_package adds
  # cpack + the per-OS install/extract smoke test + the package artifact upload.
  # It runs its own internal check-runners job (see _build.yml); actions: read is
  # threaded through this call so that internal job can list runners.
  build-packages:
    name: Package
    needs: [resolve-version]
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      do_package: true
      version_tag: ${{ needs.resolve-version.outputs.version_tag }}
      fetch_depth: 0
      # Publish the relocatable Linux install tree so docker-publish assembles the
      # runtime image from it instead of recompiling vcpkg from scratch.
      upload_installtree: true

  docker-publish:
    name: Docker Publish
    needs: [resolve-version, check-runners, build-packages]
    if: needs.resolve-version.outputs.is_dry_run != 'true'
    runs-on: ${{ fromJSON(needs.check-runners.outputs.linux_runner) }}
    permissions:
      contents: read      # checkout the source
      packages: write     # push the runtime image to GHCR
      id-token: write     # OIDC token for keyless Sigstore attestation signing
      attestations: write # write the build-provenance + SBOM attestations
    # Surfaced so the "Login to Docker Hub" step's `if:` can gate on the optional
    # secret being present (the `secrets` context is not usable in step-level
    # `if`). Only the username is exposed; the token is referenced directly in the
    # step's `with:`.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # QEMU lets buildx assemble the linux/arm64 image on the x64 runner. The
      # runtime-assembled stage only unpacks a prebuilt tarball (no compilation), so
      # the emulated work is trivial.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # The Dockerfile's base images (ubuntu:26.04, node:24-bookworm-slim) are
      # pulled from Docker Hub. Anonymous pulls share the runner's egress IP and
      # hit the strict anonymous rate limit (acute on self-hosted runners) — the
      # recurring reliability risk. Authenticating raises the pull quota. Gated on
      # the optional DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets so forks and
      # credential-less runs still build anonymously. See docs/releasing.md.
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=semver,pattern={{version}},value=${{ needs.resolve-version.outputs.version_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve-version.outputs.version_tag }}
            type=raw,value=latest,enable=${{ needs.resolve-version.outputs.is_prerelease != 'true' }}
            # `edge` floats to the newest PRERELEASE so users can track betas via a
            # fixed tag (image: ...:edge) without editing their compose file. It is
            # the prerelease counterpart of `latest` (stable-only, above); the two
            # are mutually exclusive per release and never point at the same image.
            # NOTE: docker/metadata-action skips {{major}}.{{minor}} for prereleases,
            # so before this `edge` existed a prerelease had no floating tag at all.
            type=raw,value=edge,enable=${{ needs.resolve-version.outputs.is_prerelease == 'true' }}

      # Stage the prebuilt per-arch install trees (built + version-stamped by
      # build-packages in the glibc-2.36 container) into the build context so the
      # runtime-assembled stage copies each straight in — NO vcpkg/source recompile.
      - name: Download Linux install trees (amd64 + arm64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installtree-linux-gcc*
          path: docker/context-dl
          merge-multiple: true

      - name: Stage + verify per-arch install trees
        run: |
          mkdir -p docker/context
          mv docker/context-dl/installtree-linux-gcc.tar.gz       docker/context/installtree-linux-gcc-amd64.tar.gz
          mv docker/context-dl/installtree-linux-gcc-arm64.tar.gz docker/context/installtree-linux-gcc-arm64.tar.gz
          for a in amd64 arm64; do
            T="docker/context/installtree-linux-gcc-$a.tar.gz"
            [ -f "$T" ] || { echo "::error::Staged install-tree tarball missing ($T)."; exit 1; }
            tar tzf "$T" ./bin/aqualink-automate >/dev/null \
              || { echo "::error::$T does not contain ./bin/aqualink-automate"; exit 1; }
            echo "Staged $a install tree OK ($(du -h "$T" | cut -f1))."
          done

      # Assemble + push via buildx, wrapped in a bounded retry so a transient Docker
      # Hub CDN blob timeout pulling a base image doesn't fail the release. The image
      # is assembled from the prebuilt install tree (no C++ recompile); only the
      # matter sidecar's TypeScript builds (matter-builder stage). The binary is
      # already version-stamped, so no VERSION build-arg is needed. The "pull & run"
      # smoke test below is the ABI guard (a glibc/libstdc++ mismatch would fail
      # --version); CI's from-source docker-verify is the cold-build gate.
      - name: Build and push runtime image (assembled)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_LABELS: ${{ steps.meta.outputs.labels }}
        with:
          shell: bash
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 30
          retry_on: error
          command: |
            # runtime-assembled does COPY --from=ci, so this builds the C++ stage
            # too. Cap Ninja on the 12 GB self-hosted guests for the same reason
            # ci.yml does -- see docs/ci-cd.md.
            cmd=(docker buildx build --target runtime-assembled --platform linux/amd64,linux/arm64 --push --metadata-file "$RUNNER_TEMP/docker-meta.json")
            cmd+=(--build-arg "CMAKE_BUILD_PARALLEL_LEVEL=${{ contains(needs.check-runners.outputs.linux_runner, 'self-hosted') && '6' || '' }}")
            while IFS= read -r tag;   do [ -n "$tag" ]   && cmd+=(--tag   "$tag");   done <<< "${IMAGE_TAGS}"
            while IFS= read -r label; do [ -n "$label" ] && cmd+=(--label "$label"); done <<< "${IMAGE_LABELS}"
            cmd+=(.)
            printf 'Running:'; printf ' %q' "${cmd[@]}"; echo
            "${cmd[@]}"

      # Read the image-index digest buildx recorded in --metadata-file. Attesting by
      # digest (not tag) binds the provenance to the exact bytes that were pushed, so
      # a later tag move can't silently re-point at an unattested image. Parsed with
      # grep (not jq) so this also works on a self-hosted runner without jq.
      - name: Capture pushed image digest
        id: digest
        run: |
          set -euo pipefail
          DIGEST="$(grep -oE '"containerimage.digest"[[:space:]]*:[[:space:]]*"sha256:[0-9a-f]+"' "$RUNNER_TEMP/docker-meta.json" | grep -oE 'sha256:[0-9a-f]+' | head -1)"
          case "$DIGEST" in
            sha256:*) : ;;
            *) echo "::error::Could not read the image digest from buildx metadata"; cat "$RUNNER_TEMP/docker-meta.json"; exit 1 ;;
          esac
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published image digest: $DIGEST"

      # Keyless SLSA build-provenance attestation, signed via Sigstore/Fulcio using
      # the job's OIDC identity (no private key to manage). `push-to-registry` attaches
      # the attestation to the image in GHCR so `gh attestation verify oci://...` and
      # `cosign`-style tooling can find it. See docs/SECURITY.md > Verifying builds.
      - name: Attest image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      # SBOM of the published multi-arch image (scans the image by digest → SPDX).
      - name: Generate image SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/image.spdx.json
          upload-artifact: false

      - name: Attest image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: ${{ runner.temp }}/image.spdx.json
          push-to-registry: true

      # Verify the image we just published is actually pullable from GHCR and
      # runs. `buildx build --push` pushes straight to the registry without loading
      # the image locally, so `docker pull` here genuinely exercises the published
      # artifact (not a local build cache). Assert it reports the resolved version.
      - name: Smoke test — pull & run the published image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}:${{ needs.resolve-version.outputs.version }}"
          echo "Manifest platforms:"
          PLATFORMS="$(docker buildx imagetools inspect "$IMAGE" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
          echo "  $PLATFORMS"
          for want in linux/amd64 linux/arm64; do
            echo "$PLATFORMS" | grep -qw "$want" \
              || { echo "::error::Published image is missing the $want platform"; exit 1; }
          done
          echo "Pulling + running (native amd64):"
          docker pull "$IMAGE"
          OUTPUT="$(docker run --rm "$IMAGE" --version)"
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -qF "${{ needs.resolve-version.outputs.version }}"; then
            echo "::error::Published image did not report version ${{ needs.resolve-version.outputs.version }}"
            exit 1
          fi
          echo "Running --version on the arm64 variant (QEMU):"
          # Capture into a var rather than piping `docker run` straight into grep:
          # under `set -o pipefail`, `grep -q` closes the pipe on first match, the
          # app gets SIGPIPE on its next write ("broken pipe") and exits non-zero,
          # which would fail the pipeline even though the image ran fine.
          ARM_OUTPUT="$(docker run --rm --platform linux/arm64 "$IMAGE" --version)"
          echo "$ARM_OUTPUT"
          if ! echo "$ARM_OUTPUT" | grep -qF "${{ needs.resolve-version.outputs.version }}"; then
            echo "::error::arm64 image did not run/report version"
            exit 1
          fi
          echo "arm64 variant OK"
          echo "Published multi-arch Docker image verified (amd64 + arm64)."

  # Build + push the Home Assistant add-on WRAPPER images (one single-arch image per
  # HA arch), so the Supervisor can PULL the add-on (config.yaml `image:`) instead of
  # building it on the user's device. Each image is this release's published app image
  # with bashio + run.sh layered on (aqualink-automate/Dockerfile). HA
  # substitutes {arch} (aarch64/amd64) and pulls the add-on `version` tag, so each name
  # must be a single-arch image — NOT a multi-arch manifest — hence the per-arch matrix.
  #
  # NOTE (first publish): the GHCR packages homeassistant-{aarch64,amd64} are created on
  # first push and default to PRIVATE. They must be made PUBLIC once (Package settings)
  # so the Supervisor's anonymous pull works — same one-time step the app image needed.
  homeassistant-addon-publish:
    name: HA Add-on Publish (${{ matrix.ha_arch }})
    needs: [resolve-version, check-runners, docker-publish]
    if: needs.resolve-version.outputs.is_dry_run != 'true'
    runs-on: ${{ fromJSON(needs.check-runners.outputs.linux_runner) }}
    permissions:
      contents: read      # checkout the add-on Dockerfile + run.sh
      packages: write     # push the wrapper image to GHCR
      id-token: write     # OIDC token for keyless Sigstore attestation signing
      attestations: write # write the build-provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ha_arch: amd64,   platform: linux/amd64 }
          - { ha_arch: aarch64, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU lets buildx assemble the linux/arm64 wrapper on the x64 runner. The layer
      # is just apt (jq) + a bashio tarball + run.sh, so the emulated work is light.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/homeassistant-${{ matrix.ha_arch }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve-version.outputs.version_tag }}
            type=raw,value=latest,enable=${{ needs.resolve-version.outputs.is_prerelease != 'true' }}
            type=raw,value=edge,enable=${{ needs.resolve-version.outputs.is_prerelease == 'true' }}

      # Build FROM this release's app image (Docker resolves the arch from the manifest
      # under --platform). --provenance=false keeps the pushed artifact a clean
      # single-arch image (no buildx index wrapper) so HA's {arch} pull is unambiguous;
      # provenance is attested below via the repo's keyless Sigstore action instead.
      - name: Build and push add-on wrapper image
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_LABELS: ${{ steps.meta.outputs.labels }}
          # The Dockerfile's FROM is ghcr.io/…/aqualink-automate:${BUILD_VERSION}; pass
          # this release's version so the wrapper is built on the matching base image.
          BUILD_VERSION: ${{ needs.resolve-version.outputs.version }}
        with:
          shell: bash
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 30
          retry_on: error
          command: |
            cmd=(docker buildx build
              --file aqualink-automate/Dockerfile
              --platform ${{ matrix.platform }}
              --build-arg BUILD_VERSION="$BUILD_VERSION"
              --provenance=false
              --push
              --metadata-file "$RUNNER_TEMP/addon-meta.json")
            while IFS= read -r tag;   do [ -n "$tag" ]   && cmd+=(--tag   "$tag");   done <<< "${IMAGE_TAGS}"
            while IFS= read -r label; do [ -n "$label" ] && cmd+=(--label "$label"); done <<< "${IMAGE_LABELS}"
            cmd+=(aqualink-automate)
            printf 'Running:'; printf ' %q' "${cmd[@]}"; echo
            "${cmd[@]}"

      - name: Capture pushed image digest
        id: digest
        run: |
          set -euo pipefail
          DIGEST="$(grep -oE '"containerimage.digest"[[:space:]]*:[[:space:]]*"sha256:[0-9a-f]+"' "$RUNNER_TEMP/addon-meta.json" | grep -oE 'sha256:[0-9a-f]+' | head -1)"
          case "$DIGEST" in
            sha256:*) : ;;
            *) echo "::error::Could not read the image digest from buildx metadata"; cat "$RUNNER_TEMP/addon-meta.json"; exit 1 ;;
          esac
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published add-on image digest: $DIGEST"

      - name: Attest add-on image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/homeassistant-${{ matrix.ha_arch }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      # Pull the pushed image and confirm the wrapper layered correctly (bashio + the
      # executable run.sh). Exercises the real published artifact, under QEMU for arm64.
      - name: Smoke test — pull & inspect the wrapper image
        run: |
          set -euo pipefail
          IMG="ghcr.io/${{ github.repository }}/homeassistant-${{ matrix.ha_arch }}:${{ needs.resolve-version.outputs.version }}"
          docker pull --platform ${{ matrix.platform }} "$IMG"
          docker run --rm --platform ${{ matrix.platform }} --entrypoint sh "$IMG" \
            -c 'command -v bashio >/dev/null && test -x /run.sh && echo "bashio + run.sh present"'

  github-release:
    name: GitHub Release
    needs: [resolve-version, build-packages, docker-publish]
    if: needs.resolve-version.outputs.is_dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # push the tag + create the release
      id-token: write      # OIDC token for keyless Sigstore attestation signing
      attestations: write  # write the build-provenance + SBOM attestations
    # Surface the signing key's presence so the GPG-sign step can gate on it (the
    # `secrets` context is not usable in a step-level `if`). Same key/pattern the
    # publish-repos workflow uses; the step no-ops if the secret is unset.
    env:
      HAVE_GPG_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY != '' && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Push tag for dispatch builds
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git tag "${{ needs.resolve-version.outputs.version_tag }}" HEAD && git push origin "${{ needs.resolve-version.outputs.version_tag }}"

      # actions/download-artifact has no Node 24 release yet, so it stays on v4
      # (bumping would not clear the Node 20 warning and risks breaking changes).
      - name: Download all package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          pattern: packages-*
          merge-multiple: true

      # Bundle the Home Assistant companion package (blueprints + helpers package
      # + dashboard) as a versioned release asset. Dropped into release-artifacts/
      # ahead of the signing/attestation steps below, whose *.zip globs pick it up
      # deliberately: the companion zip is shipped content and gets the same GPG
      # signature + provenance/SBOM attestation as the binaries. The CI-only
      # test-harness/ folder is excluded; a VERSION stamp records the app release
      # the bundle shipped with.
      - name: Bundle Home Assistant companion package
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          STAGE=$(mktemp -d)
          cp -r homeassistant/companion "$STAGE/aqualink-automate-homeassistant-companion"
          rm -rf "$STAGE/aqualink-automate-homeassistant-companion/test-harness"
          echo "$VERSION" > "$STAGE/aqualink-automate-homeassistant-companion/VERSION"
          (cd "$STAGE" && zip -qr "$GITHUB_WORKSPACE/release-artifacts/aqualink-automate-homeassistant-companion-${VERSION}.zip" aqualink-automate-homeassistant-companion)
          echo "Bundled homeassistant/companion as aqualink-automate-homeassistant-companion-${VERSION}.zip"

      # GPG-sign every shipped artifact with the project key (the same
      # REPO_GPG_PRIVATE_KEY that signs the APT/DNF repos). Produces a detached
      # armored `.asc` beside each binary, plus a signed SHA512SUMS manifest, and
      # exports the public key as a release asset so users can verify offline without
      # trusting GitHub. No-ops if the key is unset (safe before the secret exists).
      # This is the pin-to-a-human-identity complement to the keyless attestations
      # below; see docs/SECURITY.md > Verifying builds.
      - name: GPG-sign release artifacts
        if: env.HAVE_GPG_KEY == 'true'
        env:
          GPG_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$GPG_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          # Allow loopback pinentry so a passphrase-protected key signs non-interactively.
          mkdir -p "$HOME/.gnupg"; chmod 700 "$HOME/.gnupg"
          grep -qxF 'allow-loopback-pinentry' "$HOME/.gnupg/gpg-agent.conf" 2>/dev/null \
            || echo 'allow-loopback-pinentry' >> "$HOME/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent || true
          gpg --armor --export "$KEYID" > release-artifacts/aqualink-automate-signing-key.asc
          cd release-artifacts
          shopt -s nullglob
          artifacts=( *.deb *.rpm *.tar.gz *.zip *.exe *.dmg )
          if [ ${#artifacts[@]} -eq 0 ]; then echo "::error::No release artifacts to sign"; exit 1; fi
          # Aggregate SHA-512 manifest over every shipped binary, then one detached
          # signature that covers all of them (standard release practice), plus a
          # per-binary detached signature for direct verification.
          : > SHA512SUMS
          for f in "${artifacts[@]}"; do sha512sum "$f" >> SHA512SUMS; done
          sign() { gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --armor --detach-sign "$1" 3<<<"$REPO_GPG_PASSPHRASE"; }
          sign SHA512SUMS
          for f in "${artifacts[@]}"; do sign "$f"; done
          # Fail the release if the manifest signature does not verify.
          gpg --verify SHA512SUMS.asc SHA512SUMS
          echo "Signed ${#artifacts[@]} artifacts + SHA512SUMS with key $KEYID"

      # Keyless SLSA build-provenance attestation over the shipped binaries (NOT the
      # .asc/.sha512/SBOM sidecars). Signed via Sigstore/Fulcio using the job's OIDC
      # identity; verified with `gh attestation verify <file> --repo <owner>/<repo>`.
      - name: Attest package build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-artifacts/*.deb
            release-artifacts/*.rpm
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/*.exe
            release-artifacts/*.dmg

      # One aggregate SPDX SBOM over the release artifact set, shipped as a release
      # asset and attested to each package subject. (The per-image SBOM produced in
      # docker-publish is the authoritative one for the container; this covers the
      # loose downloads.)
      - name: Generate release SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release-artifacts
          format: spdx-json
          output-file: release-artifacts/aqualink-automate-${{ needs.resolve-version.outputs.version }}.spdx.json
          upload-artifact: false

      - name: Attest package SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: |
            release-artifacts/*.deb
            release-artifacts/*.rpm
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/*.exe
            release-artifacts/*.dmg
          sbom-path: release-artifacts/aqualink-automate-${{ needs.resolve-version.outputs.version }}.spdx.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ needs.resolve-version.outputs.is_prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${{ needs.resolve-version.outputs.version_tag }}" \
            --title "${{ needs.resolve-version.outputs.version_tag }}" \
            --generate-notes \
            $PRERELEASE_FLAG \
            release-artifacts/*

  # Sign + publish the APT/DNF repos to gh-pages from the just-created release.
  # Called here (workflow_call) rather than via a `release: published` trigger,
  # which GitHub does NOT fire for a GITHUB_TOKEN-created release (anti-recursion).
  # No-ops if REPO_GPG_PRIVATE_KEY is unset. A failure here leaves the published
  # release intact (it can be re-published with: gh workflow run publish-repos.yml
  # -f tag=<tag>); the cleanup job below won't touch the tag once the release exists.
  publish-repos:
    name: Publish package repos
    needs: [resolve-version, github-release]
    if: needs.resolve-version.outputs.is_dry_run != 'true'
    # The called workflow pushes the signed repos to gh-pages (contents: write). A
    # reusable-workflow call may not request more than the calling job is granted,
    # and the top-level default here is contents: read — so grant the write scope at
    # this job (same per-job least-privilege pattern as docker-publish/github-release).
    # Without this the whole Release graph fails to start (permissions escalation).
    permissions:
      contents: write
    uses: ./.github/workflows/publish-repos.yml
    with:
      tag: ${{ needs.resolve-version.outputs.version_tag }}
    secrets: inherit

  # If a real PRERELEASE run did not complete, delete its orphaned tag so a re-tag
  # can retry cleanly (automates the by-hand beta.2/beta.3 cleanup). Never touches a
  # stable tag, a dry-run, or a tag that already has a published release.
  cleanup-failed-prerelease:
    name: Clean up orphaned prerelease tag
    needs: [resolve-version, build-packages, docker-publish, github-release]
    if: >-
      always() &&
      needs.resolve-version.result == 'success' &&
      needs.resolve-version.outputs.is_dry_run != 'true' &&
      needs.resolve-version.outputs.is_prerelease == 'true' &&
      (needs.build-packages.result == 'failure' ||
       needs.docker-publish.result == 'failure' ||
       needs.github-release.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the orphaned prerelease tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.resolve-version.outputs.version_tag }}"
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "A published release exists for $TAG — leaving the tag in place."
            exit 0
          fi
          if gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release did not complete; deleting orphaned prerelease tag $TAG"
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${TAG}"
            echo "Deleted $TAG"
          else
            echo "Tag $TAG not present (a dispatch that failed before pushing it) — nothing to delete."
          fi
