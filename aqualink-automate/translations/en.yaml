# Home Assistant add-on options translations (English).
#
# Provides the friendly label (`name`) and help text (`description`) shown under each
# field in the add-on's Configuration tab, plus the Network port label. Every key here
# MUST match a field in config.yaml `schema:` — the `Home Assistant Add-on` CI job
# fails on any missing or extra key.
configuration:
  serial_protocol:
    name: Serial protocol
    description: >-
      How Aqualink Automate reaches the panel: "usb" for a local serial device on this
      host (a USB-RS485 adapter or a built-in UART), or "rfc2217" / "rawtcp" for a
      serial-to-ethernet adapter on your LAN. "rfc2217" suits most adapters; "rawtcp" is
      a plain TCP stream. This decides how the address below is used.
  serial_port:
    name: Serial device or network address
    description: >-
      For "usb": a local device path — /dev/serial/by-id/usb-... (preferred; it survives
      reboots) or /dev/ttyUSB0 (USB adapters are mapped in automatically). For "rfc2217"
      or "rawtcp": the adapter's address as host:port (e.g. 192.168.1.50:8899).
  mqtt_mode:
    name: MQTT mode
    description: >-
      "auto" discovers the broker Home Assistant already uses (e.g. the Mosquitto
      add-on) — nothing else to fill in. "manual" uses the broker fields below.
      "disabled" turns MQTT off.
  mqtt_host:
    name: MQTT broker host
    description: Broker hostname or IP. Used only when MQTT mode is "manual".
  mqtt_port:
    name: MQTT broker port
    description: Broker port (usually 1883, or 8883 for TLS). Used only when MQTT mode is "manual".
  mqtt_username:
    name: MQTT username
    description: Broker username, if required. Used only when MQTT mode is "manual".
  mqtt_password:
    name: MQTT password
    description: Broker password. Sent only alongside a username. Used only when MQTT mode is "manual".
  mqtt_tls:
    name: MQTT TLS
    description: Connect to the broker over TLS. Used only when MQTT mode is "manual" (auto mode takes TLS from the broker Home Assistant provides).
  mqtt_tls_skip_verify:
    name: MQTT TLS — skip verification
    description: >-
      Do not verify the broker's certificate. Handy for a self-signed broker on your LAN,
      but insecure — prefer providing a CA certificate below.
  mqtt_ca_cert:
    name: MQTT CA certificate
    description: >-
      Filename of a CA certificate in Home Assistant's /ssl share, used to verify a
      broker with a private/self-signed certificate. Leave empty for public CAs.
  mqtt_client_cert:
    name: MQTT client certificate
    description: >-
      Filename of a client certificate in /ssl for mutual TLS. Set together with the
      client key below (both or neither).
  mqtt_client_key:
    name: MQTT client key
    description: Filename of the client private key in /ssl for mutual TLS. Pairs with the client certificate.
  home_assistant_discovery:
    name: Home Assistant discovery
    description: >-
      Publish MQTT auto-discovery so your pool equipment appears in Home Assistant
      automatically. Requires MQTT to be enabled.
  enable_auth:
    name: Require web UI login
    description: >-
      Off by default — ingress already secures the UI with Home Assistant's login. Turn
      this on to require a login on the direct LAN port (which is otherwise
      unauthenticated), or if you want app-level users. Set a password below; the admin
      account is created the first time this is enabled.
  auth_username:
    name: Admin username
    description: Username for the administrator created when web UI login is first enabled.
  auth_password:
    name: Admin password
    description: >-
      Password for that administrator (required when login is enabled; at least 12
      characters). The app stores it hashed; changing it here later does NOT change an
      already-created account.
  log_level:
    name: Log level
    description: >-
      Logging verbosity. Output appears in this add-on's Log tab. Use "debug" or
      "trace" only when diagnosing an issue.
  enable_history:
    name: Enable app history
    description: >-
      Off by default — Home Assistant's Recorder/History is the expected source. Turn
      on to record the app's own time-series history under /data.
  enable_scheduler:
    name: Enable app scheduler
    description: >-
      Off by default — use Home Assistant automations/schedules. Turn on to use the
      app's own schedules, persisted under /data.
  pool_configuration:
    name: Pool configuration
    description: >-
      Installation type. Leave "auto" to detect it from the bus, or force pool-only,
      spa-only, combo, or dual.
  jandy_device_type:
    name: Jandy device type (advanced)
    description: >-
      What the software emulates on the RS-485 bus. "auto" (default, recommended) stands
      up the full default set — OneTouch, IAQ, and Serial Adapter — which suits most
      panels. Pick a single type (e.g. "onetouch") only to restrict emulation to that one
      device.
  jandy_device_id:
    name: Jandy device ID (advanced)
    description: >-
      Optional bus address for a single chosen device type (e.g. 0x41). Leave blank to
      use that type's default, and ignored entirely when the type is "auto".
  install_companion_package:
    name: Install Home Assistant blueprints
    description: >-
      Off by default. When on, installs the bundled Home Assistant companion
      blueprints (dashboard/automation helpers) directly into Home Assistant's
      blueprints folder on every start, so they appear under Settings →
      Automations & Scenes → Blueprints without a manual import. This requests a
      read-write view of Home Assistant's own configuration directory — a
      materially broader permission than this add-on otherwise needs — and only
      ever adds or updates files under blueprints/; it never touches
      configuration.yaml or anything else in your config.
network:
  8099/tcp: Optional direct web UI / HTTP API on your LAN (unauthenticated unless you enable the login option)
